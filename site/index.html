STAGES[6].steps.push(
 {id:'s7-5',no:'7.5',t:'上面发酵啤酒',en:'Top-fermented beer types',p:'742–751',
  goal:'理解上面酵母与下面酵母的差别，以及小麦啤酒、柏林白啤、老啤酒、科隆啤酒和英国、比利时啤酒的酿造要点。',
  table:{head:['类型','原麦汁 %','酒精 % vol','色度 EBC','苦味 BU'],rows:[['小麦全麦啤酒（瓶内发酵，均值）','12.2','5.3','约 11（浅）/ 37（深）','约 18'],['柏林白啤','约 7.5','2.7–2.8','浅','—'],['老啤酒 Altbier','11.5–12','4.8–5','30–38','30–40'],['科隆啤酒 Kölsch','11.2–11.5','4.6–5.1','7–10','16–35'],['Pale ale','约 11','4.5–5.0','15–30','20–25'],['Bitter','9–13','4.0–5.5','更深','25–40'],['Mild ale','—','3.0–3.5','40–50','20–25'],['Stout','约 11.5','4.5–5.0','可达 200','40–50'],['Porter','13–14','4.5–5.0','约 300','约 40'],['比利时白啤 Witbier','约 12','约 5','浅','—']]},
  params:[['上面酵母','出芽后不分离、成簇被 CO₂ 带上液面；棉子糖只能利用约 1/3（下面酵母可全部利用）；48 h 就能产孢子；高级醇和酯可比下面发酵多约 50%'],['接种与主发酵','12–16 °C 接种 0.24–0.5 L 酵母泥/hl，溶氧 5–8 mg/L；升到 18–22 °C，48–60 h 达到发酵间发酵度；pH 从 5.4–5.7 降到 4.0–4.2'],['小麦啤酒','至少 50% 小麦芽、原麦汁 ≥11%；CO₂ 6–10 g/L；4-乙烯基愈创木酚（丁香味）平衡值约 1.2–1.7 ppm'],['酵母型小麦的瓶内发酵','第一段 12–20 °C 3–7 天（残余浸出物发酵到 0.1–0.2%、双乙酰还原，瓶压 1.5–2 bar），第二段 5 °C 14–21 天'],['酵母代数','上面酵母常用 5–15 代；小麦酵母 2–3 代后可能失去产 4-VG 的能力，要重新扩培']],
  pts:['老式上面发酵用开口罐或带溢流口的罐，把泡盖撇入溢流槽收酵母；用锥形罐时酵母沉在锥底收获，罐要留约 50% 顶空。接种后 8–12 h 出现“酒花泡”（带走酒花树脂和凝固物，要撇掉），约 1–1.5 天后进入“酵母泡”阶段，每 3–6 h 撇一次。成熟时先等双乙酰还原，冷到约 7 °C、把酵母彻底分离（常用离心机），再冷到 −1 °C。','小麦啤酒的丁香味来自 4-乙烯基愈创木酚：小麦酵母把阿魏酸脱羧而成，阿魏酸在 35–40 °C 休止、醪 pH 5.7–5.8 时从戊聚糖中释放。有利条件：低温投料、至少 40% 大麦芽、合适的菌株、20–24 °C 发酵、只用 1–2 代酵母、早收酵母。锥形罐里多代循环会让口味趋于中性、偏苹果酯，像下面发酵啤酒。','小麦芽比例高（到 70%）时可同化氮明显减少，要用溶解好的麦芽；麦汁葡萄糖比例升高会使乙酸乙酯和乙酸异戊酯（香蕉味）增加；脂肪酸 >0.7 ppm、FAN 偏高、pH 升高说明酵母在向外分泌，伤口味也伤泡沫。','酵母型小麦的瓶内二次发酵要补浸出物：加约 6–7% 已灭菌的头道麦汁（Speise，使与最终发酵度相差约 12%），或加定型麦汁、下面发酵的起泡酒，并加新鲜酵母（通常是下面酵母）；混合时要防吸氧。水晶小麦是过滤的清亮小麦啤酒：主发酵后在距最终发酵度还差 12% 时带压（4–5 bar）温贮 3–7 天，再加酵母冷贮到 0 °C，过滤前一周降到 −2 °C。','柏林白啤用上面酵母与乳酸菌共生的混合培养发酵，pH 3.2–3.4，麦汁不煮沸而在 95 °C 保持 25–30 min，少量酒花（20–30 g/hl）加在醪里；酸性使它可在瓶中存放多年，常兑覆盆子或香车叶草糖浆饮用。','科隆啤酒只能产于科隆：维也纳型麦芽加至多 20% 小麦芽，14–18 °C 主发酵 3–4 天，带残糖转罐后 4–5 °C 贮 40–60 天或 0–1 °C 贮 14–40 天；老啤酒的酒花分 3–5 次加。Stout 用 10–20% 高色度麦芽或烘烤大麦，氮气出酒得到细腻持久的泡沫。','比利时：修道院啤酒（液体冰糖、20–25 °C 发酵、装瓶前加糖和酵母、约 25 °C 瓶内成熟 3–6 周，可保存多年）；Lambic 自然发酵（30–40% 未发芽小麦、陈酒花长时间煮沸、贮存半年到 3 年，加樱桃为 Kriek、加覆盆子为 Framboise）；白啤用 50% 生小麦、橙皮和芫荽。'],
  q:[['为什么锥形罐里多代循环的小麦酵母会让啤酒“变味”？','酵母产 4-乙烯基愈创木酚的能力逐代下降，丁香味减弱，口味变得中性、偏苹果酯，像下面发酵啤酒。'],['上面酵母为什么可以在液面收获？','它出芽后细胞不分离，成簇的酵母被发酵产生的 CO₂ 带到液面，富集在泡盖里。']]},
 {id:'s7-6',no:'7.6',t:'下面发酵与特种啤酒',en:'Bottom-fermented and special beers',p:'751–761',
  goal:'掌握比尔森、拉格、出口型、博克等下面发酵啤酒的典型参数，以及无醇、糖尿病、淡啤、麦芽饮料等特种啤酒的做法和难点。',
  table:{head:['类型','原麦汁 %','酒精 % vol','色度 EBC','说明'],rows:[['比尔森（VLB 2002 年 375 个样的均值）','11.57','5.07','7.0','28.8 BU（19–44），泡持 R&C 122 s'],['浅色全麦啤酒 Vollbier','11.65','4.99','7.8','21 BU'],['出口型 Export','12.5–13.5','约 5.5','8–15','20–25 BU'],['黑啤 Schwarzbier','11.5–11.8','4.8–5.0','100–150','烘烤而不焦'],['三月啤酒 Märzen','13–14','约 5.5','11–12 或 40–42','浅色或深色'],['博克 Bock','16–17','约 7（6.0–7.5）','8–13 或 45–100','发酵度只有 65–75%'],['双料博克','≥18','7–12','—','季节性'],['无醇啤酒（2002 均值）','5.22','0.40','—','14 kcal/100 mL'],['糖尿病啤酒（均值）','9.48','4.80','—','发酵度 97.4%，33 kcal/100 mL'],['淡啤 Light','6.5–8.0','2.5–4.0','—','25–30 kcal/100 mL'],['麦芽饮料 Malztrunk','11.5–12（加糖后）','<0.5','深琥珀','约 45 kcal/100 mL']]},
  params:[['比尔森在德国','2002 年占销量 68.6%（北部和东部 >80%，巴伐利亚约 32%）；平均原麦汁约 11.6%'],['比尔森其他均值','真正浸出物 3.84%，pH 4.39，热值 40 kcal/100 mL，TBZ 40–45，连二酮 0.08 ppm，顶隙空气 0.23 mL'],['无醇啤酒','德国 ≤0.5% vol；常见原麦汁 5–6%，可利用碳水化合物 2–5 g/100 mL，热值 10–23 kcal/100 mL'],['糖尿病啤酒的糖化','50 °C 30 min → 62、65 °C 各 45 min → 68、70 °C 各 30 min → 72 °C 15 min → 73–74 °C 终了，共 3.5–4 h，只能到 90–92% 的发酵度极限'],['趋势','全球 85–90% 的啤酒不按纯酒令酿造；加蜂蜜时一般在过滤前加 1–3%（稀释后）并瓶内巴氏杀菌']],
  pts:['下面发酵到 19 世纪才占上风，靠的是三件事：林德制冷机（1871）、机械吹制的廉价玻璃瓶和酒杯（酒液清不清一眼可见）、Enzinger 的过滤机。比尔森的趋势是更浅（4–7 EBC）、更干、苦味下降；德式比尔森浅而干，波希米亚型（皮尔森之源）用强化的三次煮出和 2 h 以上的煮沸，颜色更深、口味更醇厚。','拉格/全麦啤酒没有严格定义，占全球下面发酵啤酒的 80–90%；博克要在很冷的窖里加起泡酒贮 3–4 个月，要防酵母自溶和过早老化；原麦汁越高，高级醇和酯越多。','糖尿病啤酒要把糊精也分解发酵掉，所以酒精反而更高（很多国家要求再降醇）。长时间强化糖化也到不了 100%，还要在发酵开始时加 2–3% 麦芽浸出物或 2 × 300 g/hl 麦芽粉，让 β-淀粉酶和界限糊精酶慢慢分解剩余糊精；但会带进微生物和分解泡沫蛋白的蛋白酶 → 改为单独在 60 °C 以上糖化 2–3% 的麦芽（肽酶已失活、界限糊精酶仍有活性）后不煮沸加入，或在 62 °C 糊化液化后把醪降回 50 °C；非纯酒令地区可以直接加酶。','无醇啤酒去醇时必然带走其他挥发物，所以总与原酒不同；淡啤直接稀释会“喝得出来”，要用更深的麦芽、把最终发酵度控制得特别低或特别高、多加酒花并强化煮沸、较温发酵并彻底还原双乙酰，还要避免氨基酸和锌缺乏。','麦芽饮料按 7–8% 酿造、上面酵母只发酵几小时就冷到 0–1 °C，过滤后加糖到 11.5–12%；因为含糖多，必须瓶内巴氏杀菌——只做瞬时杀菌后灌装，一旦带进酵母就会发酵、胀破瓶子。','其他：Kellerbier 不过滤、浑浊可以是蛋白浑浊；烟熏啤酒用山毛榉烟熏的麦芽（工业上用冷烟熏，避免亚硝胺）；石头啤酒把烧红的石头放进醪或麦汁，产生焦糖化香气；啤酒混合饮料是啤酒与柠檬汽水等约 1:1，1–2.7% vol。','非纯酒令的新品种常加水果、香料或植物（橘皮、接骨木花、芫荽、姜、樱桃、南瓜等），这时通常减少酒花；蜂蜜几乎可完全发酵，在煮沸结束前加入会失去香气和甜味，所以最好在灌装前加入。添加物必须在标签上声明（在德国不能叫“啤酒”），试验时要把原料、用量、来源、温度和加入时间全部记下来，才能复现。'],
  q:[['糖尿病啤酒的酒精为什么反而比普通啤酒高？','普通啤酒里留下不发酵的糊精；糖尿病啤酒要把糊精也分解成糖并发酵掉，这些糖都变成了酒精。'],['麦芽饮料为什么必须瓶内巴氏杀菌？','它含大量可发酵的糖，只要灌装时带进一点酵母就会在瓶里发酵、产气，瓶子可能被胀破；瓶内杀菌把瓶里的一切都杀灭。']]},
 {id:'s7-7',no:'7.7',t:'品评与微生物检测',en:'Tasting, microbiological control',p:'761–766',
  goal:'用训练过的品评小组判断仪器测不出的口味差别，并用分级取样和快速检测尽早发现、定位污染菌。',
  params:[['品评员筛选','给出 10% 用脱气水稀释、每升加 4 g 糖、加 4 mg 异 α-酸的样品，做二点或三点试验'],['品评条件','无泡倒入 200 mL 深色品评杯；8–14 °C（前一晚就把样品调到这个温度）'],['DLG 评分','香气、口味纯正度、酒体、杀口感、苦味质量，各 5 分制'],['专性有害菌','Pectinatus cerevisiiphilus、Megasphaera cerevisiae（严格厌氧）；Lactobacillus brevis、L. lindneri、L. frigidus、Pediococcus damnosus'],['潜在有害菌','含氧高、pH 偏高（4.7–4.8）或苦味很低时才能生长，如 Lactobacillus casei、Streptococcus lactis、肠杆菌'],['PCR 快检','几小时内检出并区分啤酒有害菌，新方法还能区分活菌和死菌；常规培养可能要约 5 天'],['涂抹检测','NBB-B-AM 培养基，25–28 °C 需氧培养 3 天，变黄说明有生物膜'],['稳定性样品','每批灌装留样，26 °C 恒温保存，在最短保质期内不得出现沉淀或浑浊']],
  pts:['三点试验：给品评员三杯酒（AAB、ABA 等顺序），两杯相同、一杯不同，要他找出不同的一杯并说明理由；二点试验则描述两杯的差别。消费者偏好测试要尽量简单：在相距 10 cm、分别代表“最好”和“最差”的两条横线之间画记号，最先喝的样品最后要再喝一次。定期加入陈样，客观判断何时能尝出老化。','啤酒是习惯性的饮料：常喝的那一款最好喝——“啤酒要有自己的家乡”，这是许多地方小酒厂能生存的原因。','Pectinatus 和 Megasphaera 只能在无氧条件下繁殖，排氧做得越好，它们在灌好的啤酒里越容易生长，代谢物有粪臭味，能让啤酒无法饮用；它们藏在醋酸菌的黏液荚膜里。Pediococcus damnosus 产双乙酰；野生酵母（S. diastaticus 等，以及 Brettanomyces、Candida 等非酵母属）造成沉淀、浑浊和异味。','检测计划分生产区（一次污染）和灌装区（二次污染），检测对象分四类：专性有害、潜在有害、间接有害和指示菌。取样点包括麦汁、回收酵母与接种酵母、高泡前的嫩啤酒、转罐后的贮酒罐、过滤前后、阀组、灌装机进口和全线冲洗水。','组合检测：分级取样 + 薄弱点专项取样 + 酵母间、过滤间和灌装前的 PCR 快检 + 过滤后或灌装前的旁路膜过滤连续取样 + 灌装机及周围的涂抹。不能只靠精滤和瞬时杀菌，最重要的是一丝不苟的卫生；取样本身也必须无菌，不能把别处的菌带进样品。'],
  faults:[['成品出现粪臭味和浑浊','Pectinatus、Megasphaera 等厌氧菌，多来自灌装区的菌窝','加密灌装区涂抹和 PCR 检测，热水冲淋、CIP，清除菌窝'],['酸味或黄油味（双乙酰），出现沉淀','乳酸菌、片球菌','检查酵母、贮酒和过滤后的管路，追溯污染点'],['沉淀、浑浊、异味，发酵异常','野生酵母','检查扩培和回收酵母的纯度，必要时重新扩培']],
  q:[['为什么排氧做得越好，Pectinatus 和 Megasphaera 反而越危险？','它们是严格厌氧菌，氧气会抑制它们；灌好的低氧啤酒正好给了它们生长条件。'],['三点试验为什么要让品评员说明理由？','猜对三分之一的概率不小，要求说明理由可以区分真正尝出差别和碰运气，也能知道差别在哪里。']]},
 {id:'s7-8',no:'7.8',t:'理化分析',en:'Beer analysis',p:'766–776',
  goal:'用原麦汁、酒精、浸出物、pH、氧、双乙酰、泡沫、CO₂、苦味和稳定性等指标，持续、客观地监控啤酒质量。',
  params:[['发酵的物料平衡','180 g 糖约生成 92 g 酒精和 88 g CO₂；平均 2.0665 g 浸出物 → 1 g 酒精 + 0.9565 g CO₂ + 0.11 g 酵母'],['Balling 公式','原麦汁 p =（2.0665·A + n）× 100 ÷（100 + 1.0665·A），A 为酒精质量分数，n 为真正浸出物'],['色度','比尔森 6–11 EBC，浅色全麦 7–12，深色全麦 30–40，浅色出口 7–15，深色出口 45–100'],['pH','定型麦汁 5.3–5.5（最佳 5.0–5.2），啤酒 4.3–4.6（最佳 4.2–4.3）'],['氧','贮酒罐 0.00–0.01、灌装时 0.02–0.03、成品 0.10–0.15 mg/L；瓶颈 1 mL 空气约含 0.28 mg O₂'],['CO₂','下面发酵 0.45–0.60%（质量），上面发酵 0.40–1.00%'],['苦味','比尔森 25–40 BU，浅色全麦 20–30，浅色出口 22–26'],['强化试验','至少 5 瓶，在 40 °C（未稳定）或 60 °C（已稳定）温水与 0 °C 冷水中各 24 h 交替，直到浊度增加 2 EBC'],['膜过滤试验','0 °C 啤酒在 2 bar 下通过膜，按时称滤液得到系数：<50 g 差，>100 g 好']],
  pts:['密度测定：比重瓶（50 mL、20/20 °C 称量，最准，用于仲裁）、精密比重计（约 ±2×10⁻⁴ g/cm³）、U 形振荡管（频率随密度变化）；酒精和真正浸出物用蒸馏法（蒸出酒精、残液补重到 100 g）或折光法求得；自动分析仪用振荡管加声速或近红外，一次给出酒精、密度、色度和 pH，并算出原麦汁、发酵度和热值。','Balling 公式在德国用于计征啤酒税；对去醇啤酒（无醇、淡啤、糖尿病啤酒）和含酵母的上面发酵啤酒不适用。','总氧是溶解氧加顶隙氧（按规定摇瓶后测），比只测瓶颈空气更重要；电化学法用 Clark 膜电极，或让啤酒本身作电解液的无膜电极，可在旁路中在线测量。','双乙酰按总连二酮测（蒸馏后显色，335 nm），降到 0.10 mg/L 以下才开始冷贮。泡沫用 R&C 法（气泡平均寿命，可排除 CO₂ 含量的影响）或 NIBEM 法（泡沫面下降 10、20、30 mm 的时间），两者不能直接换算；封闭式泡沫仪不受气压、湿度影响。CO₂ 多用压力法：充分摇匀后测压力和温度，按亨利定律换算。','强化试验得到的“温天数”乘换算系数可估计保质期内不浑浊的时间；沉淀法和 Chapon 酒精冷却试验（4 mL 样品、1 h）更快。其他常规值：12% 啤酒总氮 700–800 mg/L、FAN 100–120 mg/L、总多酚 150–200 mg/L、花色苷原 50–70 mg/L。'],
  w:['tool:balling'],
  q:[['为什么表观浸出物总比真正浸出物低？','酒精的密度比水小，含酒精的啤酒让比重计沉得更深，读数就偏低；除去酒精后才是真正的浸出物。'],['为什么说总氧比瓶颈空气更能说明问题？','瓶颈空气只是氧的一部分，已经溶进啤酒的氧同样会引起老化；总氧把两者都算进去。']]},
 {id:'s7-9',no:'7.9',t:'过程测量仪表',en:'Process measurement technology',p:'776–781',
  goal:'知道酒厂常用的在线仪表测什么、怎么测、有哪些局限，才能正确选型、安装和解读数据。',
  params:[['温度','Pt100（0 °C 时 100 Ω 的铂电阻），做成变送器输出 4–20 mA 或 0–10 V'],['流量','电磁流量计 IDM（需导电、无内件、不受压力温度黏度影响、可检定，但气泡会使读数偏差）；科里奥利质量流量计（同时测密度）；超声'],['液位','差压（受密度影响）；外贴超声回波（卧罐超过一半才显示，约 ±1%）；按进出 IDM 计量；空罐信号探头'],['密度与浓度','振荡管 ±5×10⁻⁵ g/cm³；超声可穿过薄壁测量，±0.2 %mas'],['浊度','透射 + 散射：90° 散射主要反映蛋白等小颗粒，10–25° 前向散射反映酵母、硅藻土等大颗粒'],['压力','1 bar = 10⁵ Pa；压力表显示表压（0 bar 表压 = 1 bar 绝压），不标注的压力指绝压；打压要用至少 1 级的表']],
  pts:['在线测量直接在罐或管道中进行，离线测量在实验室或由人工取样；测量技术里不用 “inline” 这个说法。','IDM 用于冷麦汁计量、容积式灌装和罐的进出量；超声浓度计用于煮沸锅浸出物、头道麦汁与洗糟麦汁的切换、高浓啤酒的稀释；IDM 加超声可以在线测麦汁浓度并调节。','电导与离子浓度成正比，用来控制清洗液、酸和消毒液的浓度和自动补加，宜用不怕结垢的感应式电导传感器；pH 复合电极很薄、怕碰，要用缓冲液校准。','光学测量比电导或人眼更快：啤酒与酵母分相时，光度计的切换点明显早于人眼判断；还用于过滤机后冲、接种控制、CIP 中的浓度和脏物输送、COD 排放控制等。'],
  q:[['IDM 为什么对气泡敏感？','它靠导电液体切割磁场产生的电压测流速，气泡不导电，占了截面却不贡献信号，读数就偏差。'],['压力表上的 3 bar 是绝对压力吗？','一般不是：压力表显示的是相对大气压的表压，3 bar 表压约等于 4 bar 绝对压力。']]}
);

/* ---------- 专题 08 小型酿造 ---------- */
STAGES.push({id:'st8',n:8,topic:true,name:'小型酿造',en:'Small scale brewing',pages:'786–797',
 sum:'工艺步骤和大酒厂一样，但餐吧酒厂卖的是“看得见的酿造”、好酒和好气氛，小型酒厂要自己灌装和营销，家酿则要在厨房条件下对付卫生和设备问题。关键是先把规模算清楚。',
 scope:'餐吧酒厂、小型酒厂、家酿与自制麦芽',
 chips:['10 hl/座位·年','损耗约 15%','出酒 6–8 °C'],
 steps:[
 {id:'s8-1',no:'8.1',t:'餐吧酒厂与小型酒厂',en:'Pub breweries, microbreweries',p:'786–793',
  goal:'按客人的期待设计餐吧酒厂：先算清销量和设备规模，再让酿造过程好看、好闻而不扰客，同时守住卫生和法规。',
  params:[['规模','年产约 500–10,000 hl；美国以 15,000 US bbl（约 17,550 hl）划分区域酒厂和小型酒厂'],['数量（约 2004 年）','德国约 680 家年产 ≤5000 hl 的小酒厂，其中约 220 家餐吧酒厂；美国超过 1300 家'],['经验值','德国每个座位每年约 10 hl 啤酒；定型麦汁到售出约损耗 15%'],['容器规模','每 dt（100 kg）投料：糖化过滤槽 6–8 hl，糖化煮沸锅 8–9 hl'],['管道与泵','DN 40 不锈钢管、蝶阀；开式叶轮离心泵 ≤60 hl/h，流速 ≤1.3 m/s'],['出酒','出酒罐至少 3 个（酒种多时更多）；饮用温度欧洲 6–8 °C、美洲 0–4 °C；常用 CO₂/N₂ 混合气推送'],['酒种','原麦汁宜偏低，约 10.5–12 °P；只做少数几种']],
  pts:['客人期待看到（也闻到）酿造、认识酿酒师、喝到好酒、坐得舒服、吃到配酒的菜——书中称为“体验式餐饮”。铜（或包铜）的糖化设备抬高放在客区中央，用装饰栏杆隔开（容器烫、可能溢出）；可以自动化，但客人在时要让人看见酿酒师手动操作；发酵间放在玻璃后面，露出开口发酵罐的泡盖。煮麦汁的湿气、气味和噪声不要带进客区。','设备要点：麦芽袋装、干燥存放；对辊粉碎机放在客区外，粉尘远离客人；煮沸锅用低压锅炉的蒸汽间接加热，二次蒸汽冷凝很重要；过滤槽保温好；小批量本来就防不了吸氧，过滤可以开放进行，还能加一个看得见的压差表增加观赏性；回旋槽靠近煮沸锅或做成煮沸—回旋一体锅；板式冷却器。','发酵用玻璃后的开口罐（壁面冷却），贮酒用立式碟底罐或锥形罐；固定管道，软管要用最好的；小厂清洗消毒用一次性溶液，不设贮液罐。成熟后不过滤、冷到 0 °C 压入出酒罐，并按税务规定记录售出量。自己扩培酵母不划算，向大酒厂要，停产（检修、假期）后也要重新要新鲜酵母。','不要和大品牌拼质量保证和价格，要找自己的小众定位：原麦汁、风格、颜色、麦芽香与苦味的平衡，也可加香料、水果、草本、蜂蜜，或用上面酵母、酒香酵母、乳酸菌（要向研究所买纯培养、受控使用）；酒单要和菜单配合。不过滤的酒也必须每天清洗出酒设备。','能源：低压蒸汽锅炉（或闪蒸发生器）加热水罐、乙二醇制冷或更简单的冰水蓄冷、麦汁充氧用的空压机，买和用都贵，要认真论证，尤其要保证便宜的热水。法规：酿造许可、建筑许可、环保、税务、食品卫生、水、劳动与消防。','小型酒厂的酒不在店里卖：必须有灌装设备（首先是桶装线，需要时再加瓶或罐），灌装前要过滤和稳定化，还要靠标签和广告打出自己的小众品牌。'],
  w:['tool:pub'],
  q:[['一套 10 hl 的设备每周酿 5 批，够不够一家每天卖 6 hl 的餐吧？','按 15% 损耗、每年 40 周计约产 1700 hl，而 300 个营业日每天 6 hl 需要 1800 hl——不够，而且没有储备；每天卖 4 hl（1200 hl）才有富余。'],['为什么餐吧酒厂的过滤可以开放进行？','批量小，本来就很难避免吸氧；开放过滤让客人看得见，观赏价值更大。']]},
 {id:'s8-2',no:'8.2',t:'家酿与自制麦芽',en:'Home brewing, home malting',p:'793–797',
  goal:'在家庭条件下从麦芽（甚至大麦）做出一批干净的啤酒：算好用量、控制好发芽和焙焦、守住煮沸之后的卫生。',
  params:[['用量','1 hl 11–12% 啤酒约需 20 kg 麦芽（大厂约 17 kg），约合 25 kg 大麦（制麦损失 1/5–1/4）'],['浸麦','25 kg 大麦（含水 15%）加 12 L 水 → 37 kg、含水 42.5%；先加约 5 L，其余每 6–8 h 分次加入'],['发芽','14–15 °C 的凉房里，每天手翻 2–3 次并喷水；根芽长到籽粒的约 1.5 倍时开始焙焦'],['焙焦','几乎干透之前热风不超过 50 °C（防玻璃质），之后才升到 80 °C（约 3 h）；绿麦芽层 ≤10 cm'],['焙焦箱','25 kg 大麦约 36 L，绿麦芽约 54 L，10 cm 厚需约 0.54 m²（约 0.75 × 0.75 m），约需 150 m³ 空气'],['糖化','料水比 1 kg : 3 L；58–60 °C 投料 30 min → 63–64 °C 30 min → 缓升到 70–72 °C 至碘反应正常 → 75 °C 过滤'],['发酵与装瓶','冷到 6–8 °C 接种，6–8 °C 下静置约 1 周；每瓶加一茶匙煮过的糖浆，约 18 °C 瓶内后发酵 1 周后冷藏'],['税务（德国）','每年 200 L 以内免税，但要登记']],
  pts:['原料：麦芽或大麦、麦芽浸膏、真空包装的小包颗粒酒花（多备几个品种）、酵母（最好向酒厂要，干酵母质量未必有保证）。自来水常加氯，会产生氯酚味，要装活性炭过滤器或先把水煮沸。','自制焙焦箱：密封箱体 + 假底筛板 + 暖风机 + 不带滤网的烟囱帽；也可以把绿麦芽装在大号亚麻袋里用可调温的滚筒干衣机烘干。最后要搓掉根芽（蛋白高、有害）；焦糖麦芽和黑麦芽可在烤箱里做。','过滤可用细筛，或把一把椅子倒扣在另一把上、四条腿绑一块粗麻布当过滤器；煮沸 1 h 并加酒花，注意蒸发使浓度升高；煮沸结束让锅内旋转，热凝固物会聚在中心，再从侧面龙头放出麦汁。','煮沸之后是最大的风险：乳酸菌和醋酸菌无处不在，能很快把啤酒变酸。发酵容器要带发酵栓——既排 CO₂、挡住杂菌，也能显示发酵结束。每一次都要把配方和用量记下来，否则成功了也无法重复。','书中家酿酒花算例：25 BU = 2.5 g/hl 苦味物，“按 30% 收率 = 7.5 g/hl α-酸”；按第 3 章的算法应为 2.5 ÷ 0.30 ≈ 8.3 g/hl（见来源页的书中疑点）。'],
  q:[['家酿为什么每 hl 要的麦芽比大厂多？','小设备的粉碎、糖化和过滤效率低，损失大，要多投料才能得到同样浓度和数量的麦汁。'],['自制麦芽焙焦时为什么不能一开始就用高温？','绿麦芽还湿时高温会使胚乳变成玻璃质，酶也会受损；要先用大风量、低于 50 °C 的热风把水分带走。']]}
 ]});

/* ---------- 专题 09 废物与环境 ---------- */
STAGES.push({id:'st9',n:9,topic:true,name:'废物与环境',en:'Waste disposal and the environment',pages:'798–811',
 sum:'酿造产生废水、酒糟、酵母、硅藻土、标签和碎玻璃，还有气味、烟气、噪声和粉尘。环保法规越来越严、处置越来越贵：最省钱的办法是少产生，其次是分类回收和就地处理。',
 scope:'废水指标与费用、废水处理、副产物与固体废物、排放',
 chips:['废水目标 ≤4 hl/hl','酒糟约 20 kg/hl','BOD₅ 约 1200 mg/L'],
 steps:[
 {id:'s9-1',no:'9.1',t:'废水：来源、指标与费用',en:'Waste water',p:'798–802、804–805',
  goal:'弄清废水从哪里来、用哪些指标计量和收费，把废水量和负荷压到目标值以下——预防比处理便宜。',
  params:[['废水量','除进入啤酒、副产物和蒸发掉的约 1.8–2.5 hl/hl 外，用水全部变成废水：用水 6 hl/hl → 废水 3.5–4.2 hl/hl'],['BOD₅ 参考值','生活污水约 300、酒厂废水约 1200、污水厂出水约 20、洗糟残水可达 10,000、压榨酒糟水可达 15,000、啤酒约 80,000 mg O₂/L'],['BOD₅ 与 COD','BOD₅：20 °C 下 5 天内细菌的耗氧量（稀释法）；COD：用重铬酸钾硫酸溶液煮沸 2 h 完全氧化（旧的高锰酸钾法已不用）'],['负荷与人口当量','负荷 = 废水量 × 浓度；1 个人口当量约为每天 200 L 污水、60 g BOD₅'],['目标值','废水 ≤4.0 hl/hl、COD ≤600 g/hl，以免被收重污染附加费'],['灌装车间的持续负荷','冲掉的酒、瓶内残酒、标签浸出物和胶合计约 72–129 g COD/hl'],['入网限值（例）','温度 ≤35 °C，pH 6–9（10）；COD 超过 500 mg/L 时按档加收附加费']],
  pts:['废水里有：啤酒和麦汁残液、洗糟残水、含凝固物/酵母/硅藻土的水、CIP 的废碱和废酸、PVPP 再生排出的暗红色碱液、洗瓶机废碱（含标签纸浆、泥和胶）、润滑油脂、回收瓶和桶里的残酒、灌装机冲掉的酒，还有链道润滑剂——它不会凭空消失。','特别有害的物质：可氧化物（进入河流会耗尽氧气、腐败发臭）、磷（与氮一起促进藻类 → 清洗剂无磷化）、硝酸盐（但 CIP 仍用硝酸除啤酒石）、含氯药剂产生的有机卤化物 AOX、汞铅镉铬等重金属。酸、碱、清洗消毒剂和燃油的贮罐要有围堰或做成双壁。德国把各类污染物折算成“损害单位”收费。','间接排放者把废水排进市政污水厂，负荷记在酒厂账上，要满足入网限值；直接排放者自行处理后直接排入河流，适用更严的排放限值。','酒厂废水很不均匀：有高峰，夜间和周末很少；有时很碱很热（放掉洗瓶机的热槽），有时很酸（CIP 废酸），有时颜色很深（PVPP 再生液）。有的员工把地漏当成万能的——被监管部门当场查到，可能被取消入网许可并被索赔。','市政要投资污水处理并修缮管网，费用会越来越高地转给排放者，所以废水处理比废水预防更贵：回收残酒和残液、干法清理、少用润滑剂，都比事后处理便宜。'],
  w:['tool:waste'],
  q:[['为什么说一瓶残酒也是废水问题？','啤酒的 BOD₅ 约 80,000 mg/L，是生活污水的 250 多倍；灌装车间冲掉的酒和瓶内残酒，每 hl 啤酒就能带来几十克 COD 的持续负荷。'],['BOD₅ 和 COD 有什么区别？','BOD₅ 是细菌在 5 天内分解有机物实际消耗的氧；COD 是用强氧化剂把可氧化物全部氧化所需的氧，测得更快、数值更高。']]},
 {id:'s9-2',no:'9.2',t:'废水处理',en:'Waste water treatment',p:'802–807',
  goal:'在好氧、厌氧和调节池之间选对方案：先把废水均化、中和，再用生物法把有机物降解掉。',
  params:[['好氧处理','要耗能曝气；约 50% 的碳变成污泥，50% 变成 CO₂'],['厌氧处理','不需曝气，90–95% 的碳变成可燃的沼气，剩余污泥只有 1–5%；要求负荷均匀、操作人员水平高'],['活性污泥池','长可达 50 m、水深约 3 m，曝气器同时搅拌、防止污泥沉降'],['转盘生物膜','直径 2–3 m 的粗糙塑料盘，约 40% 浸入废水，缓慢转动'],['调节池（VLB Schumann 法）','圆罐 + 潜水曝气器 + 控制；截留生物量的周调节池可达 90–95% 生物降解'],['起始状态','池底只剩约 1.5 m 高的生物量层（最早在周日晚上）']],
  pts:['现代酒厂越来越多用“厌氧 + 后续好氧”：厌氧段先把大部分有机物变成沼气（可作锅炉燃料），好氧段再把出水净化。','曝气的混合调节池有很多好处：酸碱废水互相中和，温度被均化，很深的颜色被稀释，排放量可以控制、分摊到夜间和周末，负荷降低，就不必交重污染附加费；有时市政还能利用酒厂废水的成分来平衡生活污水，所以要与当地主管部门合作。','Schumann 周调节池按四个阶段循环：起始（只剩生物量层）→ 进水并按耗氧间歇曝气，同时降解和中和（降解产生的 CO₂ 把碱中和掉）→ 停止曝气让生物量沉降 → 用浮子从上部排出最清的水；每天循环多次。停产期间旧污泥自溶和内源呼吸，几乎不产生剩余污泥。'],
  q:[['厌氧处理为什么适合高浓度的酒厂废水？','它不需要耗能曝气，把大部分碳变成沼气回收能源，剩余污泥也很少；只是要求负荷均匀和专业操作。'],['调节池为什么能减少重污染附加费？','它把高峰和低谷、酸和碱、热水和冷水混合均化，排出的废水浓度和 pH 稳定，还能错峰排放，超标的时段就少了。']]},
 {id:'s9-3',no:'9.3',t:'副产物与固体废物',en:'Residues and waste material',p:'807–811',
  goal:'把酒糟、酵母、凝固物、硅藻土、标签、碎玻璃和废罐分门别类地卖掉、回用或妥善处置，而不是冲进下水道。',
  params:[['酒糟','每 dt 投料 110–130 kg 湿糟（含水 70–80%），约 20 kg/hl 销售啤酒；每 1 万 hl 每年约 200 t（每周约 4 t）'],['剩余酵母','每 1 万 hl 每年约 15–18 t；耗氧极强，绝不能进废水'],['废硅藻土','约 500 g 泥浆/hl 过滤啤酒，每 1 万 hl 约 5 t；再生土可替代至多 50% 的新土'],['旧标签','回收瓶每 1 万 hl 容量每年约 1.5 t'],['碎玻璃','约 0.5%，即每 1 万 hl 回收瓶容量每年约 3.5 t，送回玻璃厂'],['废罐','3–4% 的空罐因损坏不能灌装；每 1 万 hl 钢罐啤酒约 380–400 kg 废钢罐，铝罐减半'],['PET','1 kg PET 约需 1.9 kg 原油；回收料约一半可再做新瓶']],
  pts:['酒糟卖给农户作饲料最好，但有的地区没人要，夏天尤其难；干燥后便于贮存，但只有售价能高 4–5 倍才划算。凝固物还含麦汁：多数厂把浑浊麦汁当洗糟水打回过滤槽，既回收浸出物，又让富含蛋白的凝固物随酒糟变成饲料。','剩余酵母富含蛋白和维生素，可作饲料或用于制药，但必须尽快蒸煮灭活——否则会在牛胃里继续发酵，引起严重腹胀；它还会很快自溶发臭。','废硅藻土：热再生很贵；很多地方只能填埋，而填埋场要求低含水的糊状物；在沉淀池和管道里它会像水泥一样硬化。压到含水 <50%（带式或厢式压滤）后可由农户撒在地里作富氮的土壤改良剂，能改善沙土保水，但所含酵母自溶会放出氨味，要妥善暂存；也在研究用于制砖、沥青和混凝土。','旧标签含碱、混有碎玻璃和皇冠盖，回收制浆耗能大、得率低，多数只能填埋；铝箔要更高的碱浓度，还有爆炸风险。铝几乎可以无限次回收用于同类用途，而且回收耗能远低于原铝。零星废物（纸板、塑料膜、木材、废金属、电池、油脂、溶剂等）分类收集后更好卖，也更好处理。','PET 回收（以美国 URRC 法为例）：按颜色分拣压捆 → 粉碎并分离瓶盖、残液和标签 → 用烧碱溶解碎片表层、去除嵌入的杂质和阻隔层，再在回转窑中去除异物和异味 → 冲洗，经多项检验才能再接触食品。'],
  q:[['剩余酵母卖给农户前为什么要先蒸煮？','活酵母会在牛胃里继续发酵产气，引起严重腹胀；而且不灭活的酵母很快自溶发臭。'],['为什么废硅藻土不能随便冲进下水道？','它耗氧、带酵母，还会在沉淀池和管道里沉积硬化，像水泥一样难以清除。']]},
 {id:'s9-4',no:'9.4',t:'排放与环保法规',en:'Emissions, environmental legislation',p:'798、810–811',
  goal:'控制粉尘、糖化间气味、烟气和噪声，并清楚酒厂要遵守哪些环保法规。',
  params:[['粉尘','来自麦芽接收、输送和干法粉碎；有爆炸危险、会堵塞，须抽吸、分离、收集'],['糖化间气味','煮沸时挥发的麦汁和酒花成分；二次蒸汽冷凝器大幅降低，蒸汽再压缩可完全消除'],['烟气','锅炉用天然气或燃油即可达标；小型固定柴油机用涡流室式以控制 NOx 和 CO，大型柴油机和四冲程点燃式发动机用三元催化器，柴油机加颗粒过滤器，叉车装催化器'],['噪声源','灌装车间、空压机和制冷压缩机、二次蒸汽冷凝器和蒸汽压缩机'],['德国主要法规','联邦排放控制法及其条例、空气和噪声技术导则、环境责任法、联邦水法（含废水来源条例）、废水收费法、循环经济与废物法（含包装条例）、节能法、化学品法']],
  pts:['环保法的目标是让废物持续减少，最终通过反复利用实现无废；即使在还没有完善环保法的国家，污染加剧最终也会拖累整个社会。填埋场会越来越少，企业将越来越多地被要求自己处理废物，或者干脆不产生废物。','粉尘富含浸出物但质量差，收集后填埋或加入酒糟。糖化间的气味按排放法可以构成气味污染，住宅区附近的酒厂尤其要重视。柴油机废气致癌。','降噪：选用合适的建筑材料（带保温层的双层墙、隔音窗）、灌装车间装吸音吊顶、少用墙砖、给特别吵的机器加隔音罩。'],
  q:[['为什么蒸汽再压缩能完全消除煮沸的气味排放？','二次蒸汽不再排到室外，而是被压缩后当作加热蒸汽重新使用并冷凝，挥发物随冷凝水留在厂内。'],['灌装车间降噪有哪些办法？','隔音的双层墙和窗、吸音吊顶、少用反射声音的墙砖、给最吵的机器加罩。']]}
 ]});

/* ---------- 专题 10 能源 ---------- */
STAGES.push({id:'st10',n:10,topic:true,name:'能源',en:'Energy management',pages:'812–868',
 sum:'酒厂和麦芽厂每一步都要用电、用热、用压缩空气。能源是生产成本的重要部分：看清最大的用户（糖化间和灌装用热、制冷用电），再从锅炉、制冷、电气、泵和压缩空气逐项省下来。',
 scope:'能耗基准与热价、蒸汽锅炉与热电联产、制冷、电气、泵与风机、压缩空气',
 chips:['热 180–200 MJ/hl','电 10–12 kWh/hl','制冷 5.7–10.5 kWh/hl'],
 steps:[
 {id:'s10-1',no:'10.1',t:'能耗基准与热价',en:'Energy requirements, heat price',p:'812–814',
  goal:'知道全厂能耗的量级和最大用户，并用“有效热价”比较燃料和锅炉的真实成本。',
  params:[['全厂基准','每 hl 销售啤酒耗热 180–200 MJ、耗电 10–12 kWh'],['最大用户','热：糖化间和灌装；电：制冷，其次是灌装和糖化间'],['单位','1 J = 1 Ws = 1 Nm；1 kWh = 3.6 MJ = 860 kcal；1 kcal = 4.19 kJ'],['标准煤单位 SKE','29,400 kJ（1 kg 硬煤的平均热值）'],['低位热值','轻质燃料油 EL 42,700 kJ/kg，柴油 41,820 kJ/kg，硬煤 31,800 kJ/kg，天然气 H 37,500 kJ/m³、L 31,950 kJ/m³，丙烷 93,210 kJ/m³'],['热价','热价 = 燃料价格 ÷ 热值；有效热价 = 热价 ÷ 锅炉效率']],
  pts:['用电的地方：制冷、压缩空气、泵和阀门、搅拌和输送、控制、数据处理和照明；用热的地方：热水、焙焦、醪和麦汁的加热煮沸、洗瓶、洗桶、瞬时或隧道杀菌、CIP、过滤机和灌装机及管道的蒸汽灭菌、建筑采暖。','书中按 2 万 hl 和 25 万 hl 两种规模、最优值和平均值，列出了各部门的热耗和电耗，结论是上面的全厂基准：大厂的单位能耗更低，最优值与平均值相差很大。','高位热值与低位热值之差，是燃烧生成的水蒸气的冷凝热（例如 CH₄ + 2 O₂ → CO₂ + 2 H₂O）；表中通常给低位热值。冷凝式锅炉回收了部分冷凝热，按低位热值计算效率可以超过 100%。','有效热价总比热价高，因为锅炉效率低于 100%；标称效率指最佳工况，实际平均效率很少超过 85%。'],
  w:['tool:heat'],
  q:[['为什么要用“有效热价”而不是燃料单价来比较？','燃料单价不告诉你锅炉能把多少热真正送到生产中；除以锅炉效率后，才是生产用 1 MJ 热的真实成本。'],['冷凝式锅炉的效率为什么可能超过 100%？','效率按低位热值计算，而冷凝式锅炉还回收了烟气中水蒸气的冷凝热，这部分不在低位热值之内。']]},
 {id:'s10-2',no:'10.2',t:'蒸汽、锅炉与热电联产',en:'Steam, boilers, CHP',p:'814–823',
  goal:'理解蒸汽的性质，选对并用好锅炉，把烟气、冷凝水里的热回收回来；在热能充分利用时考虑热电联产。',
  params:[['汽化热','1 bar 下 1 kg 100 °C 的水汽化需 2257.9 kJ（0.6272 kWh）；压力越高越小，到临界点 221.2 bar、374.15 °C 为零'],['饱和温度（绝压）','1 bar 99.6 °C、2 bar 120.2 °C、5 bar 151.8 °C、10 bar 179.9 °C、20 bar 212.4 °C'],['体积','1 bar 下 1 kg 水约变成 1.7 m³ 蒸汽'],['三回程锅炉','1 到 30 t/h 以上、最高 32 bar（235 °C）；酒厂多为 5–15 t/h'],['省煤器','烟气从 260–300 °C 降到 120–130 °C，给水加热到 100 °C 以上，锅炉效率可超过 95%'],['冷凝水回收','140–180 °C 的冷凝水回到锅炉，可回收约 10–12% 的热'],['热水输热','160–170 °C 的加压热水也可用于煮沸（热水煮沸）'],['热电联产','天然气能量约 96% 可用：约 33% 发电、58% 变成热水或蒸汽、5% 发动机辐射热可用于预热；高温回路约 140 °C（3.5 bar），低温回路约 65 °C']],
  pts:['湿蒸汽与沸水同温，还含有水；干饱和蒸汽一降温就冷凝，放出汽化热。过热蒸汽（约 300 °C）便于远距离输送而不冷凝，但传热差，所以进换热器前常喷入冷凝水把它减温成饱和蒸汽。加压热水能用尽全部热量、不必管理冷凝水，但管径大、泵耗高。','火管（大水容积）锅炉水多，结实、能缓冲负荷波动，蒸发面大、蒸汽较干；现在酒厂多用三回程锅炉：火焰和烟气依次流过火筒和两组烟管。水管锅炉可到 180 bar；快速蒸汽发生器用泵把水压过加热盘管，2–10 min 就能出汽。德国酒厂的锅炉要设锅炉房，按规定配水位、压力、燃烧和安全控制，才能长时间无人值守。','效率取决于启停次数和运行时间：为了周日蒸一下充氧用的空气过滤器而启动一台大锅炉，效率几乎为 0；两级快速蒸汽发生器频繁启停、高低负荷切换，每次防爆吹扫都把热烟气排掉，效率不到 50%。','冷凝水一旦降到 1 bar 就闪蒸成 100 °C 的蒸汽白白跑掉，所以要用保持压力的闭式系统，而这要求系统全年运行。','热电联产用燃气或柴油发动机（大装置用燃气轮机）带发电机，与电网并联运行，可以削峰，也可以向公网售电；只发电太贵，只有热也能充分利用时才划算，是否值得取决于所在国的能源价格。过去的蒸汽机只能把燃料能量的 12–14% 变成机械能。'],
  faults:[['锅炉实际效率远低于标称值','频繁启停、低负荷运行、吹扫损失，冷凝水闪蒸损失','按负荷配置锅炉台数，装省煤器，用闭式冷凝水回收'],['换热器加热效果差','过热蒸汽直接进换热器，或蒸汽中混有空气','进换热器前减温；排除不凝气']],
  q:[['冷凝水为什么要在带压的闭式系统里回收？','冷凝水温度远高于 100 °C，一旦减压到大气压就会闪蒸，大部分热随蒸汽跑掉；保持压力才能把热带回锅炉。'],['热电联产什么时候才划算？','发电同时产生的大量热必须在厂里用得掉（热水、蒸汽、预热）；如果只用电、不用热，发的电比外购贵。']]},
 {id:'s10-3',no:'10.3',t:'制冷',en:'Refrigeration plants',p:'823–843',
  goal:'用尽可能高的蒸发温度和尽可能低的冷凝温度产生冷量，按需分配，并安全地使用氨。',
  params:[['制冷需求','麦汁冷却 1.67–2.22、发酵与深冷 1.27–2.43、房间冷却等 2.78–5.83，合计 5.72–10.49 kWh/hl'],['氨（R717）','1 bar 下 −33.8 °C 沸腾；−10 °C 时饱和压力约 2.9 bar（绝压），汽化热约 1295 kJ/kg；不破坏臭氧层'],['典型循环','蒸发 −4 到 −8 °C → 压缩到 8–12 bar、80–110 °C → 冷凝到 20–25 °C → 膨胀阀节流'],['节能规则','冷凝温度每降 1 K，驱动功率约省 2–2.5%；蒸发温度每升 1 K，约省 3–3.5%'],['直接与间接','直接蒸发只需一次换热（温差约 3–4 K），间接（载冷剂）两次（6–8 K），约多耗电 9–12%'],['冰水蓄冷','冰层最厚约 30–35 mm；夜间用便宜的电蓄冰，得到 0–1 °C 的冰水'],['房间冷却','化霜后的冷排比结厚冰时传冷好约 25%；循环风每小时换气 4–6 次，风速 <0.5 m/s'],['审批','很多国家对总充氨量超过 3 t 的装置要专门审批']],
  pts:['压缩式制冷四大件：蒸发器（氨在这里吸热汽化）、压缩机（酒厂最大的电耗设备）、冷凝器（放热液化）、膨胀阀（维持两侧压差）。它同时也是热泵。压缩机有往复活塞式、螺杆式（连续可调、不怕液击，大厂越来越多用，但噪音大、部分负荷时效率下降）、滑片式（大流量、低压差，多做两级压缩的低压级）和离心式（酒厂少见）；冷凝器有水冷壳管式、风冷式和蒸发式（喷水蒸发，天热时水温也约 25 °C）。','节能：不要让最冷的用户决定全厂的蒸发温度——按需要的温度分开回路（各配压缩机）；尽量用直接蒸发代替载冷剂；在蒸发式冷凝器中把液氨过冷；冷凝器和换热面保持清洁（去除生物膜）；排除混入的空气（会使冷凝压力明显升高）；用压力控制在天冷时切除部分冷凝面积；保温加隔汽层。','氨的危险：腐蚀、刺激甚至灼伤呼吸道；高温下与空气混合可爆；与 CO₂ 和酸反应放出大量热；属水污染物，要设集液槽。好在浓度很低就能闻到，小漏容易发现；大量泄漏时会形成约 −70 °C 的冰冷气溶胶云。出于安全，有些地方仍用间接冷却，这样氨不会漏进工作间。','麦汁冷却：一段冷却用 4 °C 的冷水把 98 °C 的麦汁一次冷到 8 °C，冷水被加热到约 80 °C 进热水罐，用水少但全部冷却水都要先制冷；两段冷却先用 12 °C 的井水预冷（不耗制冷能、用水多），再用少量冷水深冷——用水与冷量的成本决定选哪种。','冷库：暖季关好门窗，冬季可以开门利用冷空气；每天停冷几小时化霜；低温贮酒间多用光管（翅片间容易冻死），翅片管用于发酵间和灌装车间；不用的区域不供冷。现代酒厂用中央氨站连接所有用冷设备（包括 CO₂ 回收），按温度设几个分离器；CO₂ 液化由独立的级联制冷机完成。'],
  w:['tool:refr'],
  faults:[['制冷电耗高、压缩机运行时间长','蒸发温度按最冷用户定得太低，冷凝压力高（冷凝器脏、混入空气），换热面结垢或结厚冰，使用间接冷却','分开回路、清洗冷凝器并排除不凝气、定期化霜、尽量直接蒸发']],
  q:[['为什么把蒸发温度提高几度就能明显省电？','蒸发温度越高，蒸发压力越高，压缩机要克服的压差就越小；每升 1 K 驱动功率约省 3%。'],['冰水蓄冷对中小酒厂有什么好处？','夜间用便宜的电把冰蓄起来，白天麦汁冷却的冷量高峰由冰水承担，用电高峰也随之降低。']]},
 {id:'s10-4',no:'10.4',t:'电能与功率因数',en:'Electrical equipment, power factor',p:'843–848',
  goal:'理解电费的构成和功率因数的作用，避开用电高峰，让电机和补偿装置经济地运行，并严格遵守电气安全。',
  params:[['供电','发电机 10–20 kV → 升压到 60–380 kV 输送 → 10 kV 配电 → 酒厂变压器降到 380 V 三相（单相 220 V）'],['有功功率','单相 N = U·I·cos φ；三相 N = √3·U·I·cos φ'],['书中例子','220 V 下输送 10 kW：cos φ = 0.8 需 57 A，cos φ = 0.4 需 114 A'],['常见值','平均 cos φ 约 0.7–0.8；一般用电容补偿到约 0.9，再高没有实际好处'],['电费（德国，约 2004 年）','电量电价约 0.08–0.10 EUR/kWh；需量电价按 15 min 最大负荷（kVA）计，约 50–180 EUR/kW·年'],['安全','只有合格电工才能安装、改动、维修电气设备；手灯等可能被人触碰的场合用 ≤42 V 的安全低电压']],
  pts:['电动机等感性负载使电流滞后于电压，一部分电流只在电网和负载之间来回，不做有用功。cos φ 越低，输送同样的有功功率需要越大的电流：电缆要更粗、线损更大。电动机和变压器长期欠载会让 cos φ 变差，应换成功率合适的电机。','需量电价按全年最大的 15 min 负荷计：一个冬天周一早上的尖峰可能让那几度电贵得惊人（书中说一次峰值可能使那 1 kWh 值 125 EUR）。规则：制冷压缩机尽量在夜间满负荷运行并把冷量蓄起来；装负荷控制器，达到设定值时按预定顺序切除设备（自动甩负荷）；用夜间低价电；照明改用节能灯。','变频器把 50 Hz 的电源变成频率和电压可调的输出，让三相电机无级调速，用来保持恒定流量、压力或扭矩；整流器把交流变成直流，现在都用半导体整流。熔断器熔断就是线路过载的证据。'],
  w:['tool:pf'],
  q:[['为什么功率因数低会让电费变高，即使用电量（kWh）不变？','需量电费按视在功率（kVA）的峰值计，同样的有功功率在 cos φ 低时视在功率更大；电流大还使线损增加。'],['为什么说制冷压缩机最好夜里多开？','它是最大的电耗设备：夜间电价低，把冷量蓄在盐水罐或冰水罐里，白天就能削掉用电高峰。']]},
 {id:'s10-5',no:'10.5',t:'泵与风机',en:'Pumps and fans',p:'848–859',
  goal:'按介质和任务选对泵，避免汽蚀，用变频代替节流；风机也要按用途选型和运行。',
  params:[['离心泵','出流均匀、结构简单、无阀、流量易调；径向离心泵不能自吸，泵和吸入管须先充满液体'],['叶轮','闭式（纯液体）、开式（含固体、温和）、自由流道式（含气液体）'],['螺旋离心泵','不堵、可送 >4000 mPa·s 的物料、非常温和、效率 >80%、NPSH 低；出于卫生只用在定型麦汁之前'],['罗茨风机','凸轮转子泵用于气体时即罗茨风机，压差约 0.5–0.6 bar'],['变频调速','比节流调节省电 40–50%，软启动无压力冲击'],['汽蚀条件','装置的 NPSH 必须大于泵要求的 NPSH'],['风机','轴流风机最高约 1400 rpm；离心风机可远超 10 万 m³/h（麦芽厂）']],
  pts:['用途：侧流道泵（星轮泵）能自吸、压力高，用于抽酵母和罐底、取样和 CIP 回流；流道叶轮泵输送醪和湿大麦；混流泵叶轮小，用作深井泵；偏心螺杆泵（莫诺泵）几乎什么都能送，用于酒糟、醪和酵母，但定子易磨损、不能干转；凸轮泵、齿轮泵送黏稠物；活塞泵和隔膜泵用于计量清洗剂、消毒剂，隔膜泵也用于卫生要求高的酵母和硅藻土浆。','容积泵的流量几乎不随压力变化，离心泵的流量则强烈依赖扬程。选泵看流量、扬程、功率、效率和转速。','汽蚀：吸入区压力降到液体的沸点以下产生汽泡，到压力侧又剧烈溃灭——先像缝纫机的声音，后来像在泵砂石，并强烈振动；流量大降甚至断流，长期会损坏泵，产生的剪切力还会损害醪和麦汁。原因是吸上高度太大，或出口扬程太低使流量变大；热的、含气的、来自无压容器的介质最危险。','机械密封绝不能干转；麦汁泵的密封滑动面要定期清洁，CIP 常常洗不到。轴流风机不能对着关闭的风门运行，否则会喘振、很快损坏轴承。'],
  faults:[['泵发出砂石般的噪声、振动、流量下降','汽蚀：吸上高度大、吸入管流速高、介质热或含气、出口扬程太低','降低泵的安装高度或抬高罐出口，加大吸入管径，用变频控制流量']],
  q:[['为什么节流调节不如变频调速？','节流是用阀门把多余的扬程消耗掉，泵的效率大降；变频直接降低转速，功率随之下降，还能软启动。'],['为什么螺旋离心泵只用在定型麦汁之前？','书中只说是出于食品卫生原因。可以这样理解：热区的物料温度高、杂菌风险小，而定型之后的冷区产品不再经过高温，对泵的可清洗性要求更高。']]},
 {id:'s10-6',no:'10.6',t:'压缩空气',en:'Compressed air',p:'859–868',
  goal:'按用途供应合适压力和质量的压缩空气：接触产品的必须无油、干燥、无菌，同时管住泄漏这一最大的浪费。',
  params:[['用量','约 4–10 m³（吸入状态）/hl 销售啤酒：灌装 50–60%，桶装 5–10%，控制气 7–10%，其余在贮酒间和糖化间'],['接触产品','只在两处：接种时的麦汁充氧、收获后的酵母充氧（某些条件下还用于排空罐）'],['压力组织','设一个 4 bar 的中央压缩站、局部再增压，比每个压力等级各设一套省电 22–23%'],['管网泄漏','新而小的管网约 5%，分支多的约 10%，老管网可达 30–35%'],['干燥','冷冻干燥的压力露点约 1–2 °C；吸附干燥 −25 到 −40 °C'],['无菌过滤','0.2 µm 膜过滤芯，折叠后每支约 0.75 m²'],['压缩机','往复活塞式单级至 7 bar（最便宜、噪音大）；涡旋式至 3.7 kW；爪式、无油螺杆式多为两级']],
  pts:['用途：推送液体的压力气、给酵母充氧的无菌空气、气力输送（酒糟、麦芽）、碱洗前吹除 CO₂ 的无油吹扫气、阀门的控制气和气动设备的工作气。一丝油就会破坏泡沫，一个杂菌繁殖起来也可能影响质量。输送酒糟的空气用单独的压缩机，不必干燥；吹除锥形罐里的 CO₂ 用高压风机（<1 bar）就够。','空气被压缩后会升温，冷却时析出冷凝水：冷凝水妨碍运行、造成锈蚀，还是杂菌的温床，所以要干燥。也可以让空气通过 0 °C 的冷水鼓泡，或在吸入侧先把空气冷到 −25 °C（省电 5–10%，但系统必须完全密封）。','管网是压缩空气系统的薄弱环节：接头老化松动就漏，常能听到嘶嘶声；把贮气罐充满后看压降，就能算出总泄漏量。现代管网用焊接不锈钢、无死角、低点设排水，并能蒸汽灭菌和 CIP。0.2 µm 膜过滤芯靠静电作用还能截留比孔径更小的微生物，用于麦汁充氧和皇冠盖输送。'],
  q:[['压缩空气为什么一定要干燥？','压缩后冷却会析出冷凝水，它让设备生锈、妨碍气动元件，还会在管网里滋生杂菌。'],['为什么说泄漏是压缩空气最大的浪费？','老管网的泄漏可达产气量的 30–35%，这些电白白耗掉了；而找漏、换接头的成本很低。']]}
 ]});

/* ---------- 专题 11 自动化与工厂规划 ---------- */
STAGES.push({id:'st11',n:11,topic:true,name:'自动化与工厂规划',en:'Automation and plant planning',pages:'869–919',
 sum:'今天没人再钻进罐里刷洗，靠的是一整套前提：可远程控制的阀门、固定管道、能 CIP 的设计、足够的传感器和可靠的控制系统。本专题讲测控选型、规划与合同流程，以及卫生、安全、管道设计的要点。',
 scope:'测量与控制系统、规划流程与合同、卫生设计与防混料、管道设计',
 chips:['信号 4–20 mA','Ra ≤1.6 µm','麦汁啤酒 ≤3 m/s'],
 steps:[
 {id:'s11-1',no:'11.1',t:'测量与控制系统',en:'Measurement and control',p:'869–876',
  goal:'从全厂出发选仪表和控制系统：精度够用、频次够用，便于校验和维护，并把 PLC 的需求事先写清楚。',
  params:[['四类仪表','一般运行仪表（相对误差 1–2% 就够）；影响质量的（醪和洗糟水温度、杀菌温度和时间、打压压力、O₂ 和 CO₂、啤酒与麦芽分析）；经营核算用的（能源、水、原辅料，尽量称重）；实验室仪表（有的要每天或每次使用前校准并记录）'],['标准信号','0–10 V 或 0/4–20 mA；4–20 mA 便于查线路：0 mA 即断线，<4 或 >20 mA 可判为故障'],['安装与接口','耐化学的不锈钢（1.4301、1.4401、1.4541、1.4571）；螺纹、卡箍或张紧环连接，以 DN 50 为主'],['CIP 适用性','完全润湿、自动排气排空、表面光滑（可电解抛光）、耐温 100 °C（蒸汽灭菌时 130 °C）'],['传压液','压力变送器在酒厂用硅油（万一泄漏不会损泡）'],['手动控制层','只能是例外（紧急情况、故障），限定有资格的人（密码）并记录；联锁在手动下也要有效']],
  pts:['统一全厂的接口尺寸、量程、测量原理和厂家，能明显降低维护成本；每个测点都要问是否真有必要，有的只在调试时才需要。如今信号变送器已不是最弱的一环，最弱的是调节阀等执行元件。','核算用的计量要能互相核对：与送货单比、分项之和与总表比，必要时冗余测量；称重也可用来标定容积计量。仪表要建立台账（以 P&ID 上的测点为基础），用标签注明下次检定日期；规划时就在取样阀、截止阀处预留比对接口，也可借用冷麦汁计量、罐车称重或 CIP 站的仪表来校核。','PLC 需要的信息：测量值和设定值、各介质（水、压缩空气、CO₂、蒸汽、清洗剂）是否可用、阀门的开关位置、活动弯头等手动连接件的位置和驱动器状态。PLC 的需求书要回答：是否联网和分级、总线标准、集中还是分散、数据采集和归档到什么程度、化验数据是否纳入追溯、检修时如何就地操作等。','画面以简化的 P&ID 为基础，用 DIN 图形符号：显示过程值和设定值、当前程序步和剩余时间，用颜色区分阀门和驱动器状态、显示已开通的流路，报警要说清何处、何事、何时；操作站不要因为“节约”而太少。','程序可由供货商用模块拼成标准软件包，也可由用户先写出详细的程序描述和功能图、做成“量身定做”的软件（更费事，但调试快、更合用）；双方要组成团队在试运行前测试好程序、配方参数和画面。只归档偏离设定值或公差的数据，避免“数据坟场”；软件架构要开放，分散的 PLC 故障时只停一部分，现场总线能大幅降低安装成本，还要约定售后响应时间和远程维护。'],
  q:[['为什么变送器常用 4–20 mA 而不是 0–20 mA？','把量程下限对应 4 mA，0 mA 就只可能是断线，超出 4–20 mA 的信号也能判为故障，控制系统能自动发现线路问题。'],['经营核算用的计量为什么尽量用称重？','质量的测量不确定度最小，不受温度和密度变化影响；称重还可以反过来标定容积式计量。']]},
 {id:'s11-2',no:'11.2',t:'规划流程、文件与合同',en:'Plant planning, documents, contracts',p:'876–893',
  goal:'按迭代的规划流程推进项目：任务书写完整，招标可比较，合同写清楚，调试和移交有据可查。',
  params:[['规划流程','目标 → 任务书 → 可行性研究 → 初步方案（地点、工艺、规模、布局、供应与处置）与经济性研究 → 询价 → 立项决策 → 详细设计 → 招标与比价 → 合同 → 建设安装 → 培训 → 调试和试运行 → 性能考核 → 正式运行'],['四级图纸','工艺框图（不受标准约束）→ 基本流程图 → 工艺流程图 → 管道仪表流程图 P&ID（德国按 DIN 28004、DIN 19227）'],['测点字母','首字母：T 温度、P 压力、F 流量、L 液位、Q 质量参数（pH、O₂、CO₂、电导）等；后续：I 指示、R 记录、C 调节、A 报警、S 开关，H/L 为上下限，D 为差值'],['绘图比例','1:2、1:5、1:10、1:20、1:50、1:100 等标准比例，不用 1:25'],['质保期','一般从性能考核成功之日开始']],
  pts:['规划要纳入企业的中长期规划，不能在时间压力下做；要尽早与审批机关一起梳理适用的法规（环保、建筑、需监管的设备、水法、残余物处置等），环保和技术安全贯穿各阶段。','任务书必须精确、完整：遗漏会导致报价不完整，事后补项时成本不成比例地上升，设备也可能运行不好。在此基础上写招标技术说明，让各家在同样的前提下报价：详细描述、企业标准（材料、表面、指定厂家、颜色、安全技术）、供货界限、能力和介质参数、工地规则、工期、保证值（工艺参数、能力、单位消耗等）、文件和培训要求、合同条件。请供货商代写时要确保不偏向任何一家。','甲方希望承包方越少越好，可以请总承包商统一协调分包（费用按投资额的一定比例）；国际项目多为“交钥匙”工程。合同要写清标的和条件：价格方式、付款、预付款保函、完工保函、逾期和达不到保证值的罚则、质保、备件供应年限、售后和保险。','调试前设备、介质、测控都要就绪，功能试验、清洗和安全检查完成并有检验证书，操作人员经过培训并有手册；用规划阶段就写好的检查表逐项确认（谁、何时、结果）。试运行持续到稳定达到约定参数，性能考核可由双方或中立的第三方进行。只有在“无异议移交”——考核合格、尾项完成、缺陷消除、备件和竣工资料移交、培训签字、款项结清——之后才确认项目结束。','项目文件（设计图、手册、材料和焊接证书、压力容器检验、结构计算、许可等）多为孤本，要安全归档、更新为竣工状态（含当前的控制软件），日常只用复印件；工艺说明、配方和操作规程要按明确规则持续更新。'],
  q:[['任务书写得不完整会有什么后果？','各家的报价范围不同、无法比较，缺的部分事后要补，成本不成比例地上升，设备还可能达不到预期或运行不好。'],['为什么检查表最好在规划阶段就写好？','写的过程就能发现设计中的遗漏，调试时逐项确认、记录，工厂也能更快达到设计参数。']]},
 {id:'s11-3',no:'11.3',t:'卫生设计、防混料与安全',en:'Hygienic design, media separation, safety',p:'893–898、909–919',
  goal:'让设备满足自动化和无污染运行的前提，可靠地隔开“敌对”介质，防止超压和负压，并规划好 CIP 站和化学品库。',
  params:[['自动化前提','有工艺算法；全部部件可远程控制；固定管道和阀门；能 CIP；所有相关量有传感器；材料耐腐蚀'],['表面','接触产品的表面 Ra ≤1.6 µm，最好 ≤0.8 µm；焊缝与母材相当'],['焊接','TIG 手工焊或自动轨道焊，管内充分通保护气（如 90% N₂ + 10% H₂），焊后酸洗钝化；管内回火色很难去除'],['材料','通用 1.4404、1.4571（AISI 316/316Ti）；1.4301 等（AISI 304）在温度较高、pH <8 且氯离子 ≥50 mg/L 时会腐蚀'],['密封','用 EPDM（黑色）或硅橡胶（红色）；蓝色 NBR 不耐热 CIP'],['酸化热水消毒','≥90 °C、pH ≤4（防止碳酸盐析出）'],['化学品库','围堰要能容纳最大一个容器的全部内容，或用带泄漏指示的双壁容器；浓烧碱卸料时稀释到约 25%，防止冷却结晶']],
  pts:['防混料的三种办法：手动活动弯头（最简单便宜，只在一处连接、不会接错、用传感器监视位置，但不适合自动化）；泄漏阀组“block and bleed”（三只阀、位置受监视，自动化中最经济；缺点是占地大、两阀之间留有液体；无氧操作时要防止泄漏腔自动排空而进气）；双座阀（最实用、可做成紧凑的“阀岛”，但贵；要按用途选防液击型、阀座可提升清洗型或波纹管密封的无菌型，安装方向要让介质压力帮助关闭）。','超压和负压的保护要自主，在电、压缩空气或控制失效时仍然有效（例如失气时靠弹簧关闭的执行器）。安全阀按泵的最大流量选口径并定期检验；大罐对负压非常敏感，几毫米水柱就可能出事——成因有排料时没有补气、溢流时的虹吸、罐内物料冷却收缩、CO₂ 被碱液吸收等；锥形罐热 CIP 时要让冷罐保持微正压并监视罐压。','取样阀要能无菌取样、不留残液、可冲洗消毒并能 CIP；火焰灼烧只改善表面，对充满产品的阀门并没有真正的热效应，化学消毒更可靠，取样工具要泡在消毒液里。阀门：蝶阀便宜可靠，是水和产品的首选；双座阀是自动化工厂的基本前提；球阀适合水和 CIP；旋塞和闸板已过时。','CIP 规划：常按作业节奏分设几个站（糖化间含麦汁冷却、发酵成熟与酵母、过滤与清酒罐、灌装），化学品库最好集中；长管道宜用回收式清洗，罐宜用一次性清洗，站里最好两种都能做；CIP 罐容积尽量小；换介质时先把旧介质顶到罐里、再把剩下的旧介质回流、最后才送入新介质；热洗润湿好，能进入缝隙，缝隙和死角里只能靠热杀菌。','外表面也要卫生：光滑无缝、液体能流尽、四周满焊，用封端的圆管或方管，不用角钢、槽钢等开口型材，不用带缝夹紧件和内六角沉头螺钉，不许有开口孔和点焊；薄板做压花或喷砂处理不显划痕，抛光面很敏感。'],
  faults:[['罐在排料或清洗后被吸瘪','排料时补气不足、溢流虹吸、热 CIP 后冷却收缩、CO₂ 被碱液吸收','留足通气截面，装真空阀和破虹吸孔，CIP 时保持微正压并监视罐压'],['产品被清洗液或别的介质污染','“敌对”管路之间只靠一个阀门隔开','改用双座阀、泄漏阀组或活动弯头，并监视阀位']],
  q:[['为什么“敌对”介质之间不能只靠一个阀门隔开？','单阀一旦密封失效或被误开，清洗液就会直接进入产品；双座阀或泄漏阀组在两道密封之间有排空的泄漏腔，泄漏能被看见并排走。'],['锥形罐做热碱 CIP 时为什么要特别注意负压？','罐里的 CO₂ 会被碱液吸收，热罐冷却时气体还会收缩，都会让罐内压力下降；大罐几毫米水柱的负压就可能被吸瘪。']]},
 {id:'s11-4',no:'11.4',t:'管道设计',en:'Pipe design',p:'898–909',
  goal:'把管道设计成不留死角、能完全排空和清洗、流速合适、伸缩自由、保温可靠的系统，避免液击和汽蚀。',
  params:[['规格','产品管 DN 10–150，PN 一般 ≤16（视镜等有的只有 PN 6/10）'],['坡度','1–2%；做不到时水平敷设，但要能完全排空'],['推荐流速上限','麦汁与啤酒 ≤3.0 m/s，去过滤槽的醪 ≤1.5，浓酵母 ≤1.0，泵吸入管冷介质 ≤1.8、热介质 ≤1.0，水 ≤4.0（长管 ≤2.0），液氨 ≤1.6，压缩空气和 CO₂ 10–25 m/s'],['含 CO₂ 的介质','沿程任何一点的压力都不能低于 CO₂ 平衡压力的 1.5 倍'],['压降例','40 m³/h 水流经 60 m DN 50 管：约 5.7 m/s、约 4.7 bar；换 DN 65：约 3.4 m/s、约 1.3 bar（按列线图，水柱 10 m ≈ 1 bar）'],['CO₂ 吹扫','气压要比最大液柱静压高 0.4–1.5 bar'],['保温','锥形罐 ≥100 mm（现多为 120–150 mm），管道 40–60 mm'],['死角','支管长度最好小于管径，截止阀尽量贴近主管']],
  pts:['可拆连接：无菌型螺纹活接（两半必须焊得绝对平行，偏差不能靠挤扁密封圈补偿；勾扳手不需用力，要用力就说明装错了）；法兰（优先，装拆简单、能补偿小的安装误差，输送危险介质时要加防喷罩）；卡箍（国际通用）；张紧环（阀门部件和传感器）。','温度变化引起的伸缩不能产生应力：用滑动或吊挂支架、补偿器，或留几米长的弯管臂；固定支架的位置要让伸缩对称分布，支架材料与管道相同；变径用偏心大小头；支管水平引出，不留残液和气泡；穿楼板要加套管和挡水罩。','流速要兼顾压降（运行成本）和投资，还要保证 CIP 的冲刷作用；剪切对麦汁和啤酒的影响要重视但不必夸大。泵的吸入管必须流速低、压降小，热的、含气的、来自无压容器的介质尤其如此，必要时降低泵的安装高度或抬高罐的出口。','液击：阀门开闭太快，动能在瞬间变成压力冲击。90° 转角的蝶阀、球阀很难慢关，气动执行器开时突然、关时最后猛地截断 → 在气管上装可调节流阀；自动化设备最好在无压状态下切换阀门，先开通流路、再用带斜坡的变频器启动泵，停泵顺序相反。','除氧：用脱氧水顶替成本高，而且空气饱和的水除不了氧；用 CO₂ 吹扫更便宜，还能同时给管道预压。冷管的保温必须有金属隔汽层（没有真正隔汽的塑料），隔汽层总在温度高的一侧、支架处也不能中断，否则水汽渗入、冷凝，保温就失效了。','其他：安全阀、排空和 CIP 排出管要接到容器或下水，不能喷到地上（烫伤、腐蚀）；防冻用伴热或保持流动，排空不净时用气吹；会结晶的介质（烧碱、糖液）要稀释或保温；蒸汽管要定期排出冷凝水，支管从上方引出，冷管慢慢暖管。'],
  w:['tool:pipe'],
  q:[['为什么泵的吸入管要比出口管流速更低？','吸入侧压力本来就低，流速高、压降大就会使压力降到液体的沸点以下，产生汽蚀；热的和含气的介质尤其危险。'],['冷管保温为什么一定要有隔汽层？','空气中的水汽会扩散进保温层，在低温处冷凝，湿了的保温材料导热系数大增，保温就失效了。']]}
 ]});

function progFig(fig,kind){

  const bs=[...fig.querySelectorAll('.seg button')];
  function draw(i){
    const p=P[i];bs.forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));
    if(kind==='mash'){
      lineChart(cin,{h:320,mr:66,x0:0,x1:190,y0:30,y1:105,step:1,xt:[0,30,60,90,120,150,180],yt:[40,50,60,70,80,90,100],xTitle:'时间（分钟）',ybands:RESTS,
        series:[{name:'主醪',cls:'main',segs:[p.main],dot:true},{name:'煮出醪',cls:'dec',segs:p.dec}],events:p.ev,xLabel:x=>`第 ${x} 分钟`,aria:`${p.t}温度曲线（示意）`});
      if(lg)lg.hidden=!p.dec.length;
      const rows=p.main.map(q=>`<tr><td>主醪</td><td class="num">${q[0]} min</td><td class="num">${q[1]}</td></tr>`);
      p.dec.forEach((sg,n)=>sg.forEach(q=>rows.push(`<tr><td>煮出醪${p.dec.length>1?'（第 '+(n+1)+' 次）':''}</td><td class="num">${q[0]} min</td><td class="num">${q[1]}</td></tr>`)));
      tv.innerHTML=ptsTable(rows);
    }else{
      lineChart(cin,{h:300,x0:0,x1:21,y0:-2,y1:24,step:.5,xt:[0,3,6,9,12,15,18,21],yt:[0,5,10,15,20],xTitle:'时间（天）',bands:p.bands,
        series:[{name:'啤酒温度',cls:'main',segs:[p.pts],dot:true}],events:p.ev,xLabel:x=>`第 ${fmt(x,1)} 天`,aria:`${p.t}温度程序（示意）`});
      tv.innerHTML=ptsTable(p.pts.map(q=>`<tr><td>啤酒温度</td><td class="num">第 ${q[0]} 天</td><td class="num">${q[1]}</td></tr>`));
    }
    d.textContent=p.d;
  }
  bs.forEach((b,j)=>b.addEventListener('click',()=>draw(j)));draw(0);
}
const FIGS={
 enz:{t:'主要酶的最适温度窗口',cap:'条形为最适温度范围，圆点为书中给出的单一温度，× 为明显失活的温度；灰色竖带是四段常用休止温度。依据 Kunze p.214–225 的文字整理。',build:f=>{enzChart(f.querySelector('.cin'));f.querySelector('.tview .tbl').innerHTML=enzTable()}},
 mash:{t:'糖化程序温度曲线（示意）',legend:'<span><i class="lk main"></i>主醪</span><span class="lg-dec"><i class="lk dec"></i>煮出醪</span>',seg:MASH,cap:'横轴统一为 0–190 min，方便比较各方法的时长。曲线依据书中对各方法的文字描述绘制，升温速率按约 1 °C/min（煮出醪约 1.5 °C/min）假设；煮沸醪回混时按约 90 °C 的有效温度计。',build:f=>progFig(f,'mash')},
 ferm:{t:'下面发酵的温度程序（示意）',seg:FERM,cap:'依据 Kunze p.439–443 对六种工艺的文字描述绘制；三角标记为关键操作，双乙酰与压力曲线未画出。',build:f=>progFig(f,'ferm')},
 malt:{t:'淡色麦芽制麦中的物料质量变化',cap:'以 100 kg 清选大麦为起点（Kunze p.174）。质量先因吸水上升，焙焦后因失水和干物质损失降到约 78 kg，贮存中回潮到约 80 kg。',build:f=>{maltChart(f.querySelector('.cin'));f.querySelector('.tview').remove()}}
};
function buildFig(el,key){
  const F=FIGS[key];el.className='chart';el.id='c-'+key;el.dataset.name=F.t;
  el.innerHTML=`<div class="c-top"><div class="c-title">${esc(F.t)}</div>${F.legend?`<div class="legend">${F.legend}</div>`:''}</div>${F.seg?`<div class="seg" role="group" aria-label="选择工艺">${F.seg.map(p=>`<button type="button" aria-pressed="false">${esc(p.t)}</button>`).join('')}</div>`:''}<div class="cwrap"><div class="cin"></div></div>${F.seg?'<p class="prog-d"></p>':''}<figcaption>${esc(F.cap)}</figcaption><details class="tview"><summary>表格视图</summary><div class="tbl"></div></details>`;
  F.build(el);
}

const icon=n=>`<svg class="fs-ic" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- 渲染 ---------- */
const nn=n=>String(n).padStart(2,'0');
function stepHTML(s){
  const b=[];
  b.push(`<div class="sp-h"><span class="sp-no">${s.no}</span><h3>${esc(s.t)}</h3><span class="sp-en">${esc(s.en)}</span><span class="sp-pg">p.${esc(s.p)}</span></div>`);
  b.push(`<p class="goal"><b>目的</b>${esc(s.goal)}</p>`);
  if(s.params)b.push(`<div class="blk"><h4>关键参数</h4><dl class="params">${s.params.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`);
  if(s.table)b.push(`<div class="blk tbl"><table><tr>${s.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${s.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===1?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`);
  if(s.pts)b.push(`<div class="blk"><h4>机理与要点</h4><ul class="pts">${s.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`);
  (s.w||[]).forEach(w=>b.push(`<div class="wg" data-w="${w}"></div>`));
  if(s.faults)b.push(`<div class="blk"><h4>常见问题</h4><div class="tbl"><table><tr><th>现象</th><th>常见原因</th><th>对策</th></tr>${s.faults.map(f=>`<tr><td>${esc(f[0])}</td><td>${esc(f[1])}</td><td>${esc(f[2])}</td></tr>`).join('')}</table></div></div>`);
  if(s.q)b.push(`<div class="blk"><h4>自测</h4><div class="qs">${s.q.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div></div>`);
  return `<article class="step" id="${s.id}">${b.join('')}</article>`;
}
const PROC=STAGES.filter(st=>!st.topic),TOPICS=STAGES.filter(st=>st.topic);
function cardHTML(st){return `<li class="fs${st.topic?' tp':''}"><a href="#${st.id}"><div class="fs-top">${icon(st.n)}<div><div class="fs-no">${nn(st.n)}</div><div class="fs-nm">${esc(st.name)}</div></div></div><div class="fs-pg">p.${esc(st.pages)}</div><div class="fs-io">${st.topic?esc(st.scope):`入 <b>${esc(st.inp)}</b><br>出 <b>${esc(st.out)}</b>`}</div><div class="chips">${st.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></a></li>`}
function sectionHTML(st){return `<section class="stage${st.topic?' tpc':''}" id="${st.id}" aria-labelledby="${st.id}-h"><div class="st-h"><span class="st-no">${st.topic?'专题':'阶段'} ${nn(st.n)} · ${esc(st.en)} · p.${esc(st.pages)}</span><h2 id="${st.id}-h">${esc(st.name)}</h2><p class="st-sum">${esc(st.sum)}</p><p class="st-io">${st.topic?`范围 <b>${esc(st.scope)}</b>`:`输入 <b>${esc(st.inp)}</b> → 输出 <b>${esc(st.out)}</b>`}</p></div>${st.steps.map(stepHTML).join('')}</section>`}
function glossHTML(){
  const col=new Intl.Collator('zh-Hans-CN'),rows=[...GLOSSARY].sort((a,b)=>col.compare(a[0],b[0])),by={};
  STAGES.forEach(st=>st.steps.forEach(s=>{by[s.id]=s}));
  return `<section class="stage gloss" id="glossary" aria-labelledby="glossary-h"><div class="st-h"><span class="st-no">附录 · ${rows.length} 条 · 按拼音排序</span><h2 id="glossary-h">术语表</h2><p class="st-sum">中英对照和一句话解释；点“见”一栏的编号，跳到主要出现的工序。</p></div><div class="tbl gl-t"><table><tr><th>术语</th><th>英文</th><th>解释</th><th>见</th></tr>${rows.map(r=>{const s=by[r[3]];return `<tr class="gl-r"><td>${esc(r[0])}</td><td class="gl-en">${esc(r[1])}</td><td>${esc(r[2])}</td><td class="gl-see">${s?`<a href="#${s.id}">${s.no}</a>`:''}</td></tr>`}).join('')}</table></div></section>`;
}
const covHTML=()=>`<details class="cov"><summary>覆盖范围与书中疑点</summary><div class="tbl"><table><tr><th>章节</th><th>印刷页</th><th>状态</th><th>说明</th></tr>${COVERAGE.map(r=>`<tr>${r.map((c,i)=>`<td${i===1?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div><div class="tbl"><table><tr><th>位置</th><th>内容</th><th>本页的处理</th></tr>${NOTES.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
function render(){
  $('#flow').innerHTML=PROC.map(cardHTML).join('');
  $('#topics').innerHTML=TOPICS.map(cardHTML).join('');
  $('#main').innerHTML=PROC.map(sectionHTML).join('')+(TOPICS.length?'<div class="part-h" id="part-t">专题 · 原书引言与第 7–11 章</div>':'')+TOPICS.map(sectionHTML).join('')+glossHTML()+'<p class="empty" id="empty" hidden>没有找到匹配的工序或术语，换个关键词试试。</p>';
  document.querySelectorAll('.wg').forEach(el=>{const [k,v]=el.dataset.w.split(':');if(k==='tool')buildTool(el,v);else{const f=document.createElement('figure');el.replaceWith(f);buildFig(f,v)}});
  const idxItem=st=>`<li class="ist"><a href="#${st.id}"><span>${nn(st.n)}</span>${esc(st.name)}</a><ol>${st.steps.map(s=>`<li><a href="#${s.id}" data-s="${s.id}">${s.no} ${esc(s.t)}</a></li>`).join('')}</ol></li>`;
  $('#idx').innerHTML=PROC.map(idxItem).join('')+(TOPICS.length?'<li class="isep">专题</li>':'')+TOPICS.map(idxItem).join('')+'<li class="isep">附录</li><li class="ist"><a href="#glossary">术语表</a></li><li class="ist"><a href="#src">来源与覆盖范围</a></li>';
  const tools=[...document.querySelectorAll('.tool,figure.chart')];
  $('#idx-tools').innerHTML='<h2>图与计算工具</h2>'+tools.map(t=>`<a href="#${t.id}">${t.classList.contains('tool')?'计算':'图'} · ${esc(t.dataset.name)}</a>`).join('');
  const nSteps=STAGES.reduce((a,s)=>a+s.steps.length,0),nQ=STAGES.reduce((a,s)=>a+s.steps.reduce((b,x)=>b+(x.q?x.q.length:0),0),0);
  $('#stats').innerHTML=`<span><b>${PROC.length}</b> 个阶段</span><span><b>${TOPICS.length}</b> 个专题</span><span><b>${nSteps}</b> 个工序</span><span><b>${document.querySelectorAll('.tool').length}</b> 个计算工具</span><span><b>${document.querySelectorAll('figure.chart').length}</b> 张图</span><span><b>${nQ}</b> 道自测</span><span><b>${GLOSSARY.length}</b> 条术语</span>`;
  $('#src').innerHTML=`<p>来源：Wolfgang Kunze，《Technology Brewing and Malting》第 3 版国际版，Susan Pratt 译，VLB Berlin，2004（ISBN 3-921690-49-8）。页码均为原书印刷页码。</p><p>这是一份学习笔记：内容为中文自述整理，没有复制原书的段落、插图或表格；工艺曲线依据书中文字描述绘制，时间与升温速率是示意假设。计算工具按书中给出的方法实现；书中的几处排印或前后不一致（如 p.245 的煮出醪示例）见下表，本页按公式计算。</p><p>书中数据反映约 2004 年的德国与欧洲实践及法规（如纯酒令、饮用水与环保法规、当时的电价）；出现的商业设备与工艺名称只作为方法示例。</p>${covHTML()}<p>姊妹页：<a href="https://claude.ai/artifact/3KpeDWEpxwJbjuLpghvZHf" target="_blank" rel="noopener">啤酒酿造七层问答</a>（问答、酿造流程、风格配方与费曼复习）。</p>`;
  const steps=[...document.querySelectorAll('.step')];steps.forEach(s=>s._t=s.textContent.toLowerCase());
  const grows=[...document.querySelectorAll('.gl-r')];grows.forEach(r=>r._t=r.textContent.toLowerCase());
  const q=$('#q'),cnt=$('#count');
  function filter(){
    const v=q.value.trim().toLowerCase();let k=0,g=0;
    steps.forEach(s=>{const ok=!v||s._t.includes(v);s.hidden=!ok;if(ok)k++});
    grows.forEach(r=>{const ok=!v||r._t.includes(v);r.hidden=!ok;if(ok)g++});
    document.querySelectorAll('section.stage:not(.gloss)').forEach(sec=>{sec.hidden=!!v&&!sec.querySelector('.step:not([hidden])')});
    $('#glossary').hidden=!!v&&!g;
    const ph=$('#part-t');if(ph)ph.hidden=!!v&&!document.querySelector('section.tpc:not([hidden])');
    $('#empty').hidden=k+g>0;cnt.textContent=v?`显示 ${k} / ${steps.length} 个工序${g?`、${g} 条术语`:''}`:'';
  }
  q.addEventListener('input',filter);
  const links=new Map([...document.querySelectorAll('#idx a[data-s]')].map(a=>[a.dataset.s,a]));
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.remove('on'));const a=links.get(e.target.id);if(a)a.classList.add('on')}})},{rootMargin:'-12% 0px -75% 0px'});
    steps.forEach(s=>io.observe(s));
  }
  document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const t=document.getElementById(a.getAttribute('href').slice(1));if(!t)return;if((t.hidden||t.closest('[hidden]'))&&q.value){q.value='';filter()}e.preventDefault();t.scrollIntoView({block:'start',behavior:smooth()});history.replaceState(null,'','#'+t.id);t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')});
  if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)setTimeout(()=>t.scrollIntoView({block:'start'}),0)}
}
render();

</script>
