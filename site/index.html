<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kunze 酿造工艺图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1C211E; --muted:#5A665F; --line:#DCE2DD;
  --amber:#A85A08; --amber-soft:#F6E7D2; --hop:#476535; --hop-soft:#E3ECDB;
  --warn:#9A3B1E; --code:#EEF1EC; --s-main:#2A78D6; --s-dec:#C9651A;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121614; --surface:#1A201D; --ink:#E4E9E5; --muted:#9BA8A0; --line:#2C3530;
    --amber:#E8A04A; --amber-soft:#3A2A16; --hop:#A3C585; --hop-soft:#233021;
    --warn:#F0A080; --code:#222A26; --s-main:#3987E5; --s-dec:#D9701F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121614; --surface:#1A201D; --ink:#E4E9E5; --muted:#9BA8A0; --line:#2C3530;
  --amber:#E8A04A; --amber-soft:#3A2A16; --hop:#A3C585; --hop-soft:#233021;
  --warn:#F0A080; --code:#222A26; --s-main:#3987E5; --s-dec:#D9701F;
}
*{box-sizing:border-box}
html{scroll-padding-top:14px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:0 72px;-webkit-font-smoothing:antialiased}
a{color:var(--amber);text-underline-offset:2px}
.wrap{max-width:1200px;margin:0 auto}
header.top{padding-block:28px 4px}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.04em;margin:0 0 6px}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,3.6vw,38px);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:.01em}
.lede{max-width:70ch;margin:10px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:16px}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;font:inherit;font-size:14.5px;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--mono);font-weight:600}
.count{font-size:13px;color:var(--muted)}
/* 流程条 */
.flow{margin-top:20px;overflow-x:auto;padding-bottom:6px}
.flow ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(178px,1fr));gap:22px}
.fs{position:relative}
.fs+.fs::before{content:"";position:absolute;left:-19px;top:34px;width:14px;border-top:1.5px solid var(--muted)}
.fs+.fs::after{content:"";position:absolute;left:-7px;top:29.5px;border:5px solid transparent;border-left:6px solid var(--muted)}
.fs a{display:grid;gap:6px;align-content:start;height:100%;padding:13px 14px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s}
.fs a:hover{border-color:var(--amber)}
.fs a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.fs-top{display:flex;align-items:center;gap:10px}
.fs-ic{width:40px;height:40px;flex:none;color:var(--hop)}
.fs-no{font:600 12px/1.2 var(--mono);color:var(--amber)}
.fs-nm{font:700 16px/1.3 var(--serif)}
.fs-pg{font-size:11.5px;color:var(--muted)}
.fs-io{font-size:12.5px;color:var(--muted);line-height:1.55}
.fs-io b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:11.5px/1.45 var(--mono);padding:1px 7px;border-radius:6px;background:var(--code);color:var(--ink);white-space:nowrap}
/* 布局 */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:32px;margin-top:26px}
.idx{display:none}
@media (min-width:1000px){
  .layout{grid-template-columns:232px minmax(0,1fr)}
  .idx{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - 24px);overflow:auto;font-size:13px;line-height:1.5;padding-right:6px}
}
.idx h2{font:600 12px var(--sans);letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.idx ol{list-style:none;margin:0;padding:0}
.idx .ist{margin-bottom:6px}
.idx .ist>a{display:flex;gap:8px;font-weight:700;color:var(--ink);text-decoration:none;padding:4px 6px;border-radius:6px}
.idx .ist>a span{font-family:var(--mono);color:var(--amber);font-weight:600}
.idx .ist ol a{display:block;color:var(--muted);text-decoration:none;padding:2px 6px 2px 30px;border-radius:6px}
.idx a:hover{background:var(--code)}
.idx a.on{color:var(--ink);background:var(--amber-soft)}
.idx .tl{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.idx .tl a{display:block;color:var(--muted);text-decoration:none;padding:2px 6px;border-radius:6px}
main{min-width:0}
section.stage{margin-top:46px}
section.stage:first-child{margin-top:0}
.st-h{display:grid;gap:6px;border-bottom:1px solid var(--line);padding-bottom:14px}
.st-no{font:600 13px var(--mono);color:var(--amber);letter-spacing:.04em}
.st-h h2{font:800 clamp(22px,2.6vw,28px)/1.3 var(--serif);margin:0;text-wrap:balance}
.st-sum{margin:0;max-width:70ch}
.st-io{font-size:13.5px;color:var(--muted);margin:0}
.st-io b{color:var(--ink);font-weight:500}
/* 工序卡 */
.step{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px 16px}
.sp-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.sp-no{font:600 13px var(--mono);color:var(--amber)}
.sp-h h3{font:700 19px/1.35 var(--serif);margin:0}
.sp-en{font-size:13px;color:var(--muted)}
.sp-pg{margin-left:auto;font:11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.goal{margin:10px 0 0;max-width:74ch}
.goal b{font-weight:700;color:var(--hop);margin-right:6px}
.blk{margin-top:14px}
.blk>h4{font:600 12.5px var(--sans);letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.params{display:grid;grid-template-columns:minmax(120px,32%) minmax(0,1fr);margin:0;border-top:1px solid var(--line)}
.params dt,.params dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.params dt{color:var(--muted);padding-right:14px}
.params dd{font-variant-numeric:tabular-nums}
ul.pts{margin:0;padding-left:1.2em}
ul.pts li{margin:4px 0;max-width:76ch}
ul.pts li::marker{color:var(--hop)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.55}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:6px 12px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:600}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.qs{display:grid;gap:6px}
.qs details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.qs summary{cursor:pointer;font-weight:500;list-style:none}
.qs summary::-webkit-details-marker{display:none}
.qs summary::before{content:"问";font:600 11px var(--mono);color:var(--surface);background:var(--hop);border-radius:5px;padding:1px 5px;margin-right:8px;vertical-align:1px}
.qs summary:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
.qs details[open] summary{margin-bottom:6px}
.qs p{margin:0}
.qs p::before{content:"答";font:600 11px var(--mono);color:var(--hop);border:1px solid var(--hop);border-radius:5px;padding:0 5px;margin-right:8px;vertical-align:1px}
/* 计算工具 */
.tool{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--code);padding:14px 16px}
.tool-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-weight:700}
.tag{font:600 11px var(--mono);color:var(--amber);border:1px solid var(--amber);border-radius:5px;padding:0 6px}
.tool-h .src{margin-left:auto;font:400 11.5px var(--mono);color:var(--muted)}
.tool-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px 14px;margin-top:10px}
.tool-g label{display:grid;gap:3px;font-size:12.5px;color:var(--muted);line-height:1.4}
.tool-g .in{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tool-g .in:focus-within{outline:2px solid var(--amber);outline-offset:1px}
.tool-g input{flex:1;min-width:0;font:15px var(--mono);color:var(--ink);background:transparent;border:0;padding:6px 8px;outline:none}
.tool-g em{font-style:normal;font-size:12px;color:var(--muted);padding-right:8px;white-space:nowrap}
.tool-o{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px 14px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.out{display:grid;gap:1px;align-content:start}
.out span{font-size:12.5px;color:var(--muted);line-height:1.4}
.out b{font:600 19px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.out.main b{color:var(--amber)}
.out small{font-size:12px;color:var(--muted)}
.tool-n{margin:10px 0 0;font-size:13px;color:var(--muted);max-width:84ch}
.tool-err{color:var(--warn);font-size:13px;margin:10px 0 0}
/* 图 */
figure.chart{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.c-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 12px}
.c-title{font-size:14px;font-weight:700}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.lk{display:inline-block;width:18px;height:0;border-top:2px solid var(--muted);vertical-align:4px;margin-right:6px}
.lk.main{border-top-color:var(--s-main)} .lk.dec{border-top-color:var(--s-dec)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button{font:inherit;font-size:13px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button:hover{border-color:var(--amber)}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.seg button[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft);font-weight:600}
.cwrap{overflow-x:auto;margin-top:8px}
.cin{position:relative;min-width:600px}
.cin svg{display:block;width:100%;height:auto}
.cin svg:focus{outline:none}
.cin svg:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.prog-d{font-size:13.5px;margin:8px 0 0;max-width:84ch}
figure.chart figcaption{font-size:12.5px;color:var(--muted);margin-top:8px;max-width:84ch}
.tview{margin-top:8px}
.tview summary{cursor:pointer;font-size:13px;font-weight:600}
.tf-band{fill:var(--code)} .tf-band.alt{fill:transparent}
.tf-bl{font-size:11px;fill:var(--muted)}
.tf-yl{font-size:10.5px;fill:var(--muted)}
.tf-grid{stroke:var(--line);stroke-width:1}
.tf-base{stroke:var(--muted);stroke-width:1}
.tf-ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tf-s{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tf-s.main{stroke:var(--s-main)} .tf-s.dec{stroke:var(--s-dec)}
.tf-d{stroke:var(--surface);stroke-width:2} .tf-d.main{fill:var(--s-main)} .tf-d.dec{fill:var(--s-dec)}
.tf-ev{fill:var(--muted)}
.tf-evl{font-size:11px;fill:var(--ink)}
.tf-x{stroke:var(--muted);stroke-width:1}
.en-band{fill:var(--code)}
.en-g{font-size:11.5px;font-weight:700;fill:var(--muted)}
.en-n{font-size:12px;fill:var(--ink)}
.en-bar,.en-pt{fill:var(--amber)}
.en-fade{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:3 3}
.en-x{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.en-v{font-size:11px;font-family:var(--mono);fill:var(--muted)}
.en-hit{fill:transparent}
.en-row.on .en-hit{fill:var(--amber-soft)}
.mb{fill:var(--amber)} .mb-hit{fill:transparent} .mbg.on .mb{fill:var(--hop)}
.mb-v{font-size:12px;font-weight:600;font-family:var(--mono);fill:var(--ink)}
.mb-l{font-size:12px;fill:var(--muted)}
.tt{position:absolute;top:8px;left:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.55;box-shadow:0 2px 10px rgba(0,0,0,.1);min-width:150px;max-width:280px;z-index:2}
.tt .h{color:var(--muted);font-size:12px}
.tt .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tt .r b{font-variant-numeric:tabular-nums}
.tt .e{color:var(--muted);font-size:12px}
/* 专题卡片、分隔、术语表 */
.topics{margin-top:14px}
.tp-h{font:600 12.5px var(--sans);letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.topics ol{grid-template-columns:repeat(5,minmax(178px,1fr))}
.fs.tp::before,.fs.tp::after{display:none}
.fs.tp .fs-ic{color:var(--amber)}
.fs.tp .fs-no{color:var(--hop)}
.idx .isep{margin:12px 6px 6px;padding-top:10px;border-top:1px solid var(--line);font:600 11.5px var(--sans);letter-spacing:.06em;color:var(--muted)}
.part-h{margin:60px 0 0;padding-top:14px;border-top:2px solid var(--amber);font:700 13px var(--sans);letter-spacing:.08em;color:var(--amber)}
.part-h+section.stage{margin-top:22px}
.gl-t{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px 10px}
.gl-t td:first-child{min-width:7.5em}
.gl-t td.gl-en{color:var(--muted);font-size:12.5px;min-width:9em}
.gl-t td.gl-see{white-space:nowrap}
footer.src details{margin:14px 0 10px}
footer.src summary{cursor:pointer;font-weight:600;color:var(--ink)}
footer.src .tbl{margin-top:10px}
footer.src .tbl table{font-size:12.5px}
footer.src{margin-top:60px;border-top:1px solid var(--line);padding-top:18px;font-size:13px;color:var(--muted)}
footer.src p{max-width:92ch;margin:0 0 8px}
.empty{margin-top:24px;color:var(--muted)}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:600px){
  .step{padding:16px 14px 14px}
  .params{grid-template-columns:minmax(0,1fr)}
  .params dt{border-bottom:0;padding-bottom:0}
  .params dd{padding-top:2px}
  .sp-pg{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.fs a{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">学习笔记 · 据 Kunze《Technology Brewing and Malting》第 3 版国际版（VLB Berlin, 2004）· 页码为原书印刷页码</p>
    <h1>Kunze 酿造工艺图谱</h1>
    <p class="lede">从大麦到瓶子，按原书顺序整理成 6 个工艺阶段；成品啤酒、小型酿造、废物与环境、能源、自动化与工厂规划另列 5 个专题。每个工序写明它要达到的目的、关键参数、背后的机理和常见问题；书里的计算方法做成了可以改数的小工具。全部为中文自述，不是原文翻译。</p>
    <div class="bar">
      <label class="search" for="q"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input id="q" type="search" placeholder="搜索工序或术语，如 DMS、PVPP、双座阀" autocomplete="off" aria-label="搜索工序或术语"></label>
      <div class="stats" id="stats"></div>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
  </header>
  <nav class="flow" aria-label="六个工艺阶段"><ol id="flow"></ol></nav>
  <nav class="flow topics" aria-label="专题"><h2 class="tp-h">专题 · 原书引言与第 7–11 章</h2><ol id="topics"></ol></nav>
  <div class="layout">
    <aside class="idx" aria-label="目录"><h2>目录</h2><ol id="idx"></ol><div class="tl" id="idx-tools"></div></aside>
    <main id="main"></main>
  </div>
  <footer class="src" id="src"></footer>
</div>
<script>
/* ---------- 通用 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=1)=>Number.isFinite(n)?n.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const smooth=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
/* ASBC/Plato 多项式：°P → 比重 SG(20/20)；乘 0.998203 得 SG(20/4) */
const sg2020=p=>1.0000131+0.00386777*p+1.27447e-5*p*p+6.34964e-8*p*p*p;
function interp(pts,x){
  if(x<pts[0][0]-1e-9||x>pts[pts.length-1][0]+1e-9)return null;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(x<=b[0]+1e-9)return b[0]===a[0]?b[1]:a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}
  return pts[pts.length-1][1];
}
function interpSegs(segs,x){for(const p of segs){if(p.length<2)continue;const v=interp(p,x);if(v!=null)return v}return null}
function placeTip(tt,host,px,W){
  const r=host.getBoundingClientRect(),left=px*r.width/W,tw=tt.offsetWidth;
  tt.style.left=(left+14+tw>r.width?Math.max(0,left-14-tw):left+14)+'px';
}

/* ---------- 折线图（支持分段、横向温度带、事件标记） ---------- */
function lineChart(el,cfg){
  const W=720,H=cfg.h,m={t:30,r:cfg.mr||28,b:44,l:48},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const sx=x=>m.l+(x-cfg.x0)/(cfg.x1-cfg.x0)*pw, sy=y=>m.t+ph-(y-cfg.y0)/(cfg.y1-cfg.y0)*ph, f=n=>Math.round(n*10)/10;
  let s='';
  (cfg.ybands||[]).forEach(b=>{s+=`<rect class="tf-band" x="${m.l}" y="${f(sy(b[1]))}" width="${pw}" height="${f(sy(b[0])-sy(b[1]))}"/><text class="tf-yl" x="${W-m.r+6}" y="${f(sy(b[0])-2)}">${esc(b[2])}</text>`});
  (cfg.bands||[]).forEach((b,i)=>{s+=`<rect class="tf-band${i%2?' alt':''}" x="${f(sx(b[0]))}" y="${m.t}" width="${f(sx(b[1])-sx(b[0]))}" height="${ph}"/><text class="tf-bl" x="${f((sx(b[0])+sx(b[1]))/2)}" y="${m.t-9}" text-anchor="middle">${esc(b[2])}</text>`});
  cfg.yt.forEach(v=>{s+=`<line class="tf-grid" x1="${m.l}" x2="${W-m.r}" y1="${f(sy(v))}" y2="${f(sy(v))}"/><text class="tf-ax" x="${m.l-8}" y="${f(sy(v)+4)}" text-anchor="end">${v}</text>`});
  cfg.xt.forEach(v=>{s+=`<text class="tf-ax" x="${f(sx(v))}" y="${H-m.b+17}" text-anchor="middle">${v}</text>`});

blend:{t:'调配（混合十字）',src:'p.408–409',f:[['V1','啤酒（麦汁）A 的量',500,'hl',1],['E1','A 的浸出物',12.4,'%',.1],['E2','B 的浸出物（水填 0）',0,'%',.1],['Et','目标浸出物',11.6,'%',.1]],

 n:'混合十字：把两种液体的浸出物写在左侧、目标写在中间，交叉相减得到两者的份数；混合方程 V1·E1 + V2·E2 =（V1+V2）·Et 给出同样结果。按百分数计算是近似，严格计算应换成 20/4 °C 密度；而且两种液体很难真正混匀。'},
co2:{t:'CO₂ 溶解量',src:'p.409–410',f:[['T','啤酒温度',1,'°C',.5],['P','罐压（表压）',.5,'bar',.05],['C','目标 CO₂ 含量',.5,'%',.01]],
 c:v=>{if(v.T<-2||v.T>20)return{err:'温度请在 −2 至 20 °C 之间。'};const s=co2sol(v.T),c=s*(v.P+1),need=v.C/s-1;return{o:[['饱和 CO₂ 含量',fmt(c,3),'%',1],['约合',fmt(c*10.1,1),'g/L'],['该温度常压溶解度',fmt(s,3),'%'],['达到目标所需表压',fmt(Math.max(0,need),2),'bar']],w:c<.32?'低于 0.32%：啤酒会显得平淡。':c<.5?'低于 0.50%：灌装途中还会损失一些，贮酒时宜再高一点。':''}},
 n:'亨利定律：溶解量 ≈ 该温度下常压溶解度 × 绝对压力（按书中做法，常压取 1 bar）。常压溶解度取书中 12 °P、发酵度 80% 啤酒的数值并线性插值，0 °C 以下为外推。灌装的啤酒应含约 0.5% CO₂。'},
pitch:{t:'接种量',src:'p.400、438',f:[['C','目标细胞浓度',25,'×10⁶/mL',1],['S','酵母泥浓度',3,'×10⁹/mL',.1],['V','麦汁量',500,'hl',10]],
 c:v=>{if(!(v.S>0))return{err:'酵母泥浓度要大于 0。'};const l=100*v.C/v.S/1000;return{o:[['每 hl 酵母泥',fmt(l,2),'L',1],['总共需要',fmt(l*v.V,0),'L']]}},
 n:'常用接种量 20–30×10⁶ 个/mL，约相当于每 hl 0.6–1 L 浓酵母泥（泥约 3×10⁹ 个/mL）。提高接种量是加快发酵而不带来负面后果的最重要手段，也能减少高级醇。'},
ccv:{t:'锥形罐容积与顶空',src:'p.417–419、426',f:[['D','罐直径',4.5,'m',.05],['A','锥角',70,'°',1],['H','总液高（含锥部）',12,'m',.1],['K','顶空比例',25,'%',1]],
 c:v=>{if(!(v.A>10&&v.A<170))return{err:'锥角请在 10°–170° 之间。'};const r=v.D/2,hc=r/Math.tan(v.A/2*Math.PI/180);if(!(v.H>hc))return{err:`总液高要大于锥高（${fmt(hc,2)} m）。`};const a=Math.PI*r*r,Vt=a*hc/3+a*(v.H-hc),hh=Vt*v.K/100/a;return{o:[['锥高',fmt(hc,2),'m'],['麦汁容量',fmt(Vt*10,0),'hl',1],['顶空高度',fmt(hh,2),'m'],['筒体+锥部总高（不含封头）',fmt(v.H+hh,2),'m'],['直径 : 总液高',`1 : ${fmt(v.H/v.D,1)}`,''],['CIP 清洗液（约）',fmt(Math.PI*v.D*30*100/3600,1),'L/s']]}},
 n:'锥部 V = πr²h/3，筒体 V = πr²h；锥角 60° 时锥高 ≈ 0.866 × 直径。发酵罐顶空一般取接种麦汁体积的 18–25%（小麦啤酒约 40%）；液高最好不超过约 20 m，直径与总液高约 1 : 2。CIP 按每米罐周长约 30 hl/h 估算。'},
cool:{t:'发酵与冷贮冷量',src:'p.395、429',f:[['OE','原麦汁',12,'°P',.1],['Vs','最终表观发酵度',80,'%',1],['dT','发酵后降温幅度',10,'K',.5],['V','批量',1000,'hl',10]],
 c:v=>{const fh=v.OE*.81*v.Vs/100*587,lh=420*v.dT,t=fh+lh;return{o:[['发酵热',fmt(fh,0),'kJ/hl'],['降温液体热',fmt(lh,0),'kJ/hl'],['合计（未含散热）',fmt(t,0),'kJ/hl',1],['整批',fmt(t*v.V/1000,0),'MJ']]}},
 n:'发酵热按每 kg 已发酵浸出物 587 kJ；已发酵浸出物 ≈ 原麦汁 × 0.81 × 表观发酵度。全麦啤酒发酵热约 4,300–4,600 kJ/hl，从 9 °C 冷到 −1 °C 约 4,200 kJ/hl，加上散热损失总计约 8,600–9,000 kJ/hl；最大冷量出现在发酵后 24–48 h 的降温。'},
pu:{t:'巴氏杀菌单位 PU',src:'p.489–490',f:[['T','杀菌温度',70,'°C',.5],['t','保持时间',50,'s',1],['G','目标',15,'PU',1]],
 c:v=>{const k=Math.pow(1.393,v.T-60),pu=v.t/60*k,need=v.G/k*60;const row=[62,64,66,68,70,72].map(x=>`${x} °C ${fmt(v.G/Math.pow(1.393,x-60)*60,0)} s`).join(' · ');return{o:[['得到',fmt(pu,1),'PU',1],['达到目标需保持',fmt(need,0),'s'],['温度倍率',fmt(k,2),'× /min']],i:'达到 '+v.G+' PU 所需时间：'+row}},
 n:'1 PU = 60 °C 保持 1 min；PU = 时间(min) × 1.393^(T−60)。啤酒一般 14–15 PU，污染重时 22–27 PU；罐装啤酒 18–20 PU，温度不超过约 62 °C。PU 衡量杀菌效果，不衡量风味损伤——后者更取决于保持时间和含氧量。'},
hg:{t:'高浓酿造节能',src:'p.510',f:[['V1','常规定型量',300,'hl',1],['P1','常规浓度',11,'%',.1],['P2','高浓浓度',15,'%',.1]],
 c:v=>{if(!(v.P2>v.P1))return{err:'高浓浓度要高于常规浓度。'};const v2=v.V1*v.P1/v.P2,d=v.V1-v2;return{o:[['高浓定型量',fmt(v2,1),'hl'],['少加热煮沸',fmt(d,1),'hl',1],['节省比例',fmt(d/v.V1*100,1),'%'],['后续稀释水',fmt(d,1),'hl']],w:v.P2>15?'超过约 14.5–15% 时，副产物会在稀释后的成品中被察觉。':''}},
 n:'按书中的简化算法（体积 × 百分浓度）。高浓的主要好处是稀释水不必加热和煮沸；代价是发酵更慢、酯和高级醇更多，泡沫也随稀释程度变差。'},
loss:{t:'啤酒损耗与麦芽单耗',src:'p.709–712',f:[['Vc','定型麦汁量',11700,'hl',10],['Vs','可售啤酒量',10500,'hl',10],['G','投料量',180000,'kg',100]],
 c:v=>{if(!(v.Vc>0&&v.Vs>0))return{err:'体积要大于 0。'};return{o:[['啤酒损耗',fmt((v.Vc-v.Vs)/v.Vc*100,2),'%',1],['损失体积',fmt(v.Vc-v.Vs,0),'hl'],['麦芽单耗',fmt(v.G/v.Vs,2),'kg/hl']]}},
 n:'损耗 = 定型麦汁与可售啤酒之差占定型麦汁的百分比，平均 8–10%（其中约 4% 是冷缩）。麦芽单耗参考：6% 啤酒约 9 kg/hl，11% 约 17 kg/hl，16% 约 26 kg/hl。收率与损耗的百分数不能相加。'},
cap:{t:'糖化间年产能',src:'p.333–334',f:[['W','每批定型麦汁',640,'hl',10],['B','每天批次',8,'批',1],['D','每周酿造天数',5,'天',.5],['K','每年生产周',52,'周',1],['Hd','节假日',10,'天',1],['L','损耗',9,'%',.5]],
 c:v=>{const d=v.W*v.B,y=d*v.D*v.K-v.Hd*d;return{o:[['每天定型麦汁',fmt(d,0),'hl'],['每年定型麦汁',fmt(y,0),'hl'],['每年可售啤酒',fmt(y*(1-v.L/100),0),'hl',1]]}},
 n:'书中经验：1 hl 啤酒约耗 17 kg 麦芽；1 t 投料约定型 64.6 hl 麦汁；每天 8 批、每周 5 天时，每 1 t 投料能力大约对应每年 10 万 hl 啤酒。这是理论上限，维修停产会明显降低。'},
berg:{t:'灌装线能力分级（Berg 曲线）',src:'p.707',f:[['F','灌装压盖机能力',50000,'瓶/h',1000]],
 c:v=>{if(!(v.F>0))return{err:'能力要大于 0。'};const r=[['卸垛机',135,140],['卸箱机',120,125],['洗瓶机',110,115],['空瓶检验机',110,115],['贴标机',110,120],['装箱机',120,125],['码垛机',135,140]];return{o:r.map(([n,a,b])=>[n,fmt(v.F*a/100,0)+'–'+fmt(v.F*b/100,0),'瓶/h'])}},
 n:'以灌装压盖机为 100%，其余设备按书中的能力分级配置更高的设计能力，离灌装机越远越高。这不是说它们要一直满负荷运行，而是为了在短暂故障过后，能尽快把缓冲段重新填满或排空；缓冲段约半满运行。'},
balling:{t:'原麦汁与发酵度（Balling 公式）',src:'p.767–768',f:[['Av','酒精（体积分数）',5.07,'% vol',.01],['Es','表观浸出物',2.04,'%',.01],['Ew','真正浸出物',3.84,'%',.01]],
 c:v=>{if(!(v.Av>=0&&v.Av<20&&v.Ew>0&&v.Es>-3&&v.Es<v.Ew+1e-9))return{err:'请检查输入：酒精 0–20% vol，真正浸出物大于 0，且表观浸出物不高于真正浸出物。'};const rho=sg2020(v.Es)*.998203,A=v.Av*.78924/rho,p=(2.0665*A+v.Ew)*100/(100+1.0665*A),vs=(p-v.Es)/p*100,vw=(p-v.Ew)/p*100;return{o:[['酒精（质量分数）',fmt(A,2),'mas%'],['原麦汁浓度',fmt(p,2),'%',1],['表观发酵度',fmt(vs,1),'%'],['真正发酵度',fmt(vw,1),'%'],['真正 ÷ 表观',fmt(vw/vs,2),'']]}},
 n:'Balling 公式：原麦汁 =（2.0665 × 酒精质量分数 + 真正浸出物）× 100 ÷（100 + 1.0665 × 酒精质量分数）；平均 2.0665 g 浸出物生成 1 g 酒精、0.9565 g CO₂ 和 0.11 g 酵母。体积分数按“酒精质量分数 = 体积分数 × 0.7893 ÷ 啤酒密度”换算，啤酒密度由表观浸出物求得。示例是书中 VLB 2002 年 375 个比尔森的平均值，算出的原麦汁与书中一致。不适用于去醇啤酒和含酵母的上面发酵啤酒。'},
pub:{t:'餐吧酒厂产能与需求',src:'p.787',f:[['W','每批定型麦汁',10,'hl',1],['L','定型→售出损耗',15,'%',1],['B','每周酿造批数',5,'批',1],['K','每年酿造周数',40,'周',1],['S','每天售出',6,'hl',.5],['D','每年营业日',300,'天',5]],
 c:v=>{if(!(v.L>=0&&v.L<100))return{err:'损耗要在 0–100% 之间。'};const y=v.W*(1-v.L/100)*v.B*v.K,d=v.S*v.D,x=y-d;return{o:[['每年可产啤酒',fmt(y,0),'hl',1],['每年需求',fmt(d,0),'hl'],['余量',fmt(x,0),'hl'],['按每座位 10 hl/年约合',fmt(d/10,0),'个座位']],w:x<0?'产量不够：要多酿批次或加大设备。':(d>0&&x/d<.1?'余量不到需求的 10%，几乎没有储备。':undefined)}},
 n:'书中例子：10 hl 设备约出 8.5 hl 啤酒（损耗约 15%），每周 5 批、每年 40 周（休假 5 周、病假 3 周、检修 2 周）得 1700 hl；300 个营业日每天卖 6 hl 需要 1800 hl——不够且没有储备，每天卖 4 hl（1200 hl）才有富余。德国经验是每个座位每年约 10 hl 啤酒。'},
waste:{t:'废水与副产物估算',src:'p.799–809',f:[['Q','年销售啤酒',100000,'hl',1000],['Wu','用水',5,'hl/hl',.1],['Wk','进入产品、副产物和蒸发的水',2,'hl/hl',.1],['B','废水 BOD₅',1200,'mg/L',50]],
 c:v=>{if(!(v.Q>0&&v.Wu>v.Wk&&v.Wk>=0&&v.B>=0))return{err:'请检查输入：用水要大于不成为废水的部分。'};const ww=v.Wu-v.Wk,m3=ww*v.Q/10,kg=m3*v.B/1000;return{o:[['废水量',fmt(ww,1),'hl/hl'],['年废水量',fmt(m3,0),'m³',1],['年 BOD₅ 负荷',fmt(kg/1000,1),'t'],['约合人口当量',fmt(kg/(.06*365),0),'人'],['湿酒糟',fmt(v.Q*.02,0),'t/年'],['剩余酵母',fmt(v.Q*.0015,0)+'–'+fmt(v.Q*.0018,0),'t/年'],['废硅藻土（全部过滤时）',fmt(v.Q*.0005,0),'t/年']],w:ww>4?'废水超过 4.0 hl/hl 的目标值。':undefined}},
 n:'除进入啤酒、副产物和蒸发掉的约 1.8–2.5 hl/hl 外，用水全部变成废水（书中：用水 6 hl/hl 时废水 3.5–4.2 hl/hl）；目标是废水不超过 4.0 hl/hl、COD 不超过 600 g/hl。酒厂废水 BOD₅ 约 1200 mg/L；1 个人口当量按每天 60 g BOD₅ 计。副产物按书中经验值：湿酒糟约 20 kg/hl，剩余酵母每 1 万 hl 每年 15–18 t，废硅藻土约 0.5 kg/hl 过滤啤酒。'},
heat:{t:'有效热价与年燃料费',src:'p.812–814',f:[['Pf','燃料价格（示例）',.4,'EUR/m³',.01],['Hu','低位热值',37500,'kJ/m³',100],['eta','锅炉平均效率',85,'%',1],['q','全厂热耗',190,'MJ/hl',5],['Q','年销售啤酒',100000,'hl',1000]],
 c:v=>{if(!(v.Hu>0&&v.eta>0&&v.eta<=110))return{err:'热值要大于 0，效率在 0–110% 之间。'};const hp=v.Pf/(v.Hu/1000),ah=hp/(v.eta/100),E=v.q*v.Q;return{o:[['热价',fmt(hp*100,2),'欧分/MJ'],['有效热价',fmt(ah*100,2),'欧分/MJ',1],['合每 kWh 热',fmt(ah*360,2),'欧分'],['年耗热',fmt(E/1000,0),'GJ'],['年燃料费',fmt(E*ah,0),'EUR']]}},
 n:'热价 = 燃料价格 ÷ 热值；有效热价 = 热价 ÷ 锅炉效率，才是生产用 1 MJ 热的真实成本。书中的低位热值：天然气 H 37,500 kJ/m³、L 31,950 kJ/m³，轻质燃料油 42,700 kJ/kg（按 kg 计价时把单位换成 EUR/kg、kJ/kg 即可）。标称效率指最佳工况，平均效率很少超过 85%；全厂热耗约 180–200 MJ/hl。燃料价格是示例值，不是书中数据，请换成自己的。'},
refr:{t:'制冷：蒸发与冷凝温度的节电效果',src:'p.826–827、842',f:[['E','制冷压缩机年耗电',1000000,'kWh',10000],['dTe','蒸发温度提高',2,'K',.5],['dTc','冷凝温度降低',3,'K',.5],['P','电价',.09,'EUR/kWh',.01]],
 c:v=>{if(!(v.dTe>=0&&v.dTc>=0))return{err:'温度变化请填 0 或正数。'};const lo=3*v.dTe+2*v.dTc,hi=3.5*v.dTe+2.5*v.dTc;if(hi>40)return{err:'变化太大，线性估算已不适用（请控制在几 K 以内）。'};return{o:[['节电比例',fmt(lo,1)+'–'+fmt(hi,1),'%',1],['年节电',fmt(v.E*lo/100,0)+'–'+fmt(v.E*hi/100,0),'kWh'],['年节省',fmt(v.E*lo/100*v.P,0)+'–'+fmt(v.E*hi/100*v.P,0),'EUR']],i:'另外：用直接蒸发代替载冷剂（间接冷却），约可再省 9–12% 的电。'}},
 n:'经验规则：冷凝温度每降 1 K，压缩机驱动功率约降 2–2.5%；蒸发温度每升 1 K，约降 3–3.5%（p.842 取 2.5% 和 3%）。办法：按用户需要的蒸发温度分开回路、直接蒸发、保持冷凝器清洁并排除不凝气、把液氨过冷。这里按线性叠加估算，只适用于几 K 的变化；电价 0.09 EUR/kWh 取自书中当时的 0.08–0.10 EUR/kWh。'},
pf:{t:'功率因数与需量电费',src:'p.843–848',f:[['P','有功功率峰值（15 min）',500,'kW',10],['c1','当前 cos φ',.75,'',.01],['c2','补偿后 cos φ',.9,'',.01],['U','线电压（三相）',380,'V',10],['K','需量电价',100,'EUR/kVA·年',5]],
 c:v=>{if(!(v.P>0&&v.U>0&&v.c1>0&&v.c1<=1&&v.c2>0&&v.c2<=1))return{err:'功率和电压要大于 0，cos φ 在 0–1 之间。'};const s1=v.P/v.c1,s2=v.P/v.c2,k=Math.sqrt(3)*v.U/1000;return{o:[['当前视在功率',fmt(s1,0),'kVA'],['补偿后视在功率',fmt(s2,0),'kVA'],['线电流（当前 → 补偿后）',fmt(v.P/(k*v.c1),0)+' → '+fmt(v.P/(k*v.c2),0),'A'],['每年需量电费可省',fmt((s1-s2)*v.K,0),'EUR',1]],w:v.c2<v.c1?'补偿后的 cos φ 应高于当前值。':undefined,i:v.c2>.9?'书中建议一般补偿到约 0.9，再高没有实际好处。':undefined}},

function buildTool(el,key){
  const T=TOOLS[key],id='t-'+key;el.id=id;el.className='tool';el.dataset.name=T.t;
  el.innerHTML=`<div class="tool-h"><span class="tag">计算</span><span>${esc(T.t)}</span><span class="src">Kunze ${esc(T.src)}</span></div><div class="tool-g">${T.f.map(([k,l,v,u,st])=>`<label for="${id}-${k}"><span>${esc(l)}</span><span class="in"><input id="${id}-${k}" type="number" inputmode="decimal" value="${v}" step="${st}">${u?`<em>${esc(u)}</em>`:''}</span></label>`).join('')}</div><div class="tool-o" aria-live="polite"></div><p class="tool-err" hidden></p><p class="tool-n tool-i" hidden></p><p class="tool-n">${esc(T.n)}</p>`;
  const out=el.querySelector('.tool-o'),er=el.querySelector('.tool-err'),inf=el.querySelector('.tool-i');
  function run(){
    const v={};for(const [k] of T.f){const x=parseFloat(el.querySelector(`#${id}-${k}`).value);v[k]=x}
    if(Object.values(v).some(x=>!Number.isFinite(x))){out.hidden=true;er.hidden=false;er.textContent='请把每一项都填成数字。';return}
    const r=T.c(v);
    if(r.err){out.hidden=true;inf.hidden=true;er.hidden=false;er.textContent=r.err;return}
    out.hidden=false;
    out.innerHTML=r.o.map(([l,val,u,mn])=>`<div class="out${mn?' main':''}"><span>${esc(l)}</span><b>${esc(val)}</b>${u?`<small>${esc(u)}</small>`:''}</div>`).join('');
    if(r.w){er.hidden=false;er.textContent=r.w}else er.hidden=true;
    if(r.i){inf.hidden=false;inf.textContent=r.i}else inf.hidden=true;
  }
  el.addEventListener('input',run);run();
}

  params:[['浸麦度（目标水分）','淡色 42–44%（分步提水可到 48%）；深色 44–47%'],['吸水到 42% 所需时间','5 °C 约 100 h，10 °C 约 75 h，15 °C 约 50 h'],['典型节奏','湿浸 4 h → 空气休止约 20 h（每小时抽 CO₂ 10–15 min）→ 第二次湿浸 → 出槽后在发芽箱喷水补足'],['空气休止占比','约 80% 的浸麦时间'],['用水','4–7 m³/t（回用可到约 3.5）；仅把水分从 12% 提到 45% 就要 0.94 m³/t'],['体积膨胀','约 40–45%']],
  pts:['吸水后呼吸大增。泡在水里缺氧会转入分子内呼吸、生成醇和醛，严重时胚被“浸死”。CO₂ 比空气重，要从槽底抽走。','小粒吸水快，所以分级后分别浸麦更均匀；对水敏感的大麦，先在 37–40% 水分等它破口，再逐步加水。','第一遍浸麦水很脏（单宁、苦味物、硅酸、谷皮蛋白），必须换掉。','浸麦槽里一般只到 36–38%，其余水分在发芽设备中喷水完成——浸麦和发芽其实是连续的。'],
  faults:[['发芽不齐','分级不严；锥底积聚 CO₂；通风不足','底部抽 CO₂、用压缩空气翻动；平底槽均匀装料']],
  q:[['为什么现代浸麦把大部分时间都安排成空气休止？','胚在吸水后需要大量氧来呼吸和产酶；长时间泡水缺氧，发芽慢且不均，甚至死胚。']]},
 {id:'s2-4',no:'2.4',t:'发芽',en:'Germination',p:'135–158',
  goal:'让酶大量形成，把胚乳细胞壁和蛋白基质分解开（溶解），同时把呼吸和根芽造成的损失压到最低。',
  params:[['发芽时间','现多为 5 天（5–6 天）'],['最高温度','比尔森麦芽 17–18 °C；深色麦芽 22–25 °C'],['绿麦芽水分','约 45%（不低于 40%）'],['料层','装料 1.2–1.3 m，发芽后长到 1.8–1.9 m'],['通风','300–700 m³/(t·h)，进风比料层低约 2 °C，并保持饱和湿度'],['叶芽长度','淡色 2/3–3/4 粒长；深色 3/4–1；超过粒长称“骠骑兵”'],['根芽','淡色约 1.5 倍粒长，深色约 2 倍'],['第 3 天起','先减半新风，之后掺入 80% 以上富 CO₂ 的循环风限制呼吸']],
  pts:['胚分泌赤霉酸 → 糊粉层新合成 α-淀粉酶（大麦中原本没有）、界限糊精酶、葡聚糖酶和蛋白酶；β-淀粉酶原本就在胚乳里，只是被释放出来。多数酶在第 3–4 天形成。','溶解顺序固定：先分解细胞壁中层的蛋白，再是戊聚糖，最后才轮到 β-葡聚糖骨架；溶解从盾片向粒尖推进。粒尖没溶解，就会把淀粉和 β-葡聚糖问题带进糖化间。','蛋白溶解（库尔巴哈指数）与细胞溶解同步进行。太高会让焙焦时美拉德反应过强，TBI 和色度上升、风味稳定性下降。','冷发芽总能得到最高的淀粉酶量；发芽越暖越久，根越长、损失越大。','发芽中形成 DMS 前体（SMM）：浸麦度越高、发芽温度越高、时间越长，前体越多。'],
  faults:[['溶解过度','浸麦度高、温度高、时间长','限制绿麦芽水分、降温，第 3 天起减氧'],['溶解不足或不均','起发不齐、水分不够','保证均匀起发和足够水分；检查品种纯度']],
  q:[['为什么说“细胞溶解只能交给麦芽厂”？','分解 β-葡聚糖的内切葡聚糖酶很怕热，糖化中很快失活；而耐热的 β-葡聚糖溶解酶会把未溶解部位的大分子 β-葡聚糖释放出来却不分解它，酒厂没法根本补救。'],['叶芽长度为什么能用来判断溶解？','叶芽在谷皮下沿背部向粒尖生长，长度大致与溶解进度同步；超过粒长说明温度太高或发芽过度。']]},
 {id:'s2-5',no:'2.5',t:'焙焦',en:'Kilning',p:'158–172',
  goal:'把水分从 40% 以上降到 5% 以下、终止生命活动，尽量保留酶，按啤酒类型生成或避免色香物质，并把 DMS 前体赶走。',
  params:[['两段','凋萎（预干）+ 焙焦；水分降到 10–12% 之前，料温不超过约 50 °C'],['淡色（比尔森）','80–85 °C 保持 3–5 h；宁取 85 °C 2–3 h，不取 80 °C 5 h'],['深色（慕尼黑）','100–105 °C'],['风量','约 4,300–5,000 m³/(t·h)，穿透点后可降到约一半'],['淡色麦芽的酶保留','α-淀粉酶比绿麦芽约高 15%；β-淀粉酶约低 40%；内切 β-葡聚糖酶损失 20–40%'],['风味稳定指标','麦芽 TBA <14；DMS 前体 <5–6 ppm；亚硝胺（NDMA）限值约 2.5 µg/kg'],['热耗（带热回收）','单层炉 250–300 MJ/t，双层炉 200–250 MJ/t；热回收可省 30–35%']],
  pts:['湿热会破坏酶，湿淀粉在高温下糊化后冷却成玻璃质 → 必须先低温大风量除水，干了再升温。','美拉德反应与 Strecker 降解在 90 °C 以上、时间较长时明显：生成类黑精（颜色、香气、还原力），也生成日后老化味的前体。热负荷用 TBA（TBI）表示。','SMM → DMS 活性前体 → 游离 DMS：温度越高，转化并排出越多；但温度越高、时间越长，TBA 也越高。高温短时是两者的折中。','淡色麦芽前半段强风快速干燥，让酶来不及分解；深色麦芽关风门在湿热中“焖”，让酶生成大量糖和氨基酸，供焙焦时显色生香。','改用间接加热后，燃气中的 NOx 不再穿过麦芽，亚硝胺问题基本解决；烟熏麦芽则是有意让山毛榉烟穿过麦芽。'],
  faults:[['玻璃质麦芽','水分还高时就升温','严格控制穿透点之前的料温'],['DMS 前体偏高','焙焦温度不足或保持太短','提高焙焦温度或延长保持时间']],
  q:[['为什么比尔森麦芽宁要 85 °C 2–3 h，而不要 80 °C 5 h？','两种方式都能把 DMS 前体降到目标，但高温短时的累计热负荷（TBA）更低，对风味稳定性更有利。']]},
 {id:'s2-6',no:'2.6',t:'焙焦后处理与制麦收率',en:'After kilning, malting yield',p:'172–174',
  goal:'冷却、除根、贮存熟化和抛光，并核算制麦损失。',
  params:[['出炉','约 80 °C，冷却到 35–40 °C 以下'],['麦根','约占麦芽 3–4%，蛋白约 30%，是优质饲料'],['贮存','至少 4 周：水分回升到 4–5%，加工性能改善'],['干物质损失','淡色 10.5%（浸麦 1.0 + 呼吸 5.8 + 麦根 3.7）；深色 13.0%'],['经验收率','100 kg 大麦约得 80 kg 淡色麦芽']],
  pts:['新焙焦的麦芽直接用会造成过滤和发酵困难，所以要贮存熟化。','麦芽吸湿，库房要干燥凉爽；筒仓表面积小，吸湿风险低。','降低损失的办法：低温发芽，从第 3 天起多用富 CO₂ 循环风限制呼吸和根的生长。'],
  w:['chart:malt'],
  q:[['100 kg 大麦只出 80 kg 麦芽，20 kg 去哪了？','大约一半是水分差（大麦 12–14% 对麦芽 3–4%），另一半是干物质损失：呼吸消耗最多，其次是被除去的麦根，少量随浸麦水流失。']]},
 {id:'s2-7',no:'2.7',t:'麦芽评价',en:'Malt evaluation',p:'174–179',
  goal:'用一组指标判断这批麦芽能不能在酒厂里顺利糖化、过滤和发酵。',
  params:[['水分','淡色 3.0–4.5%；合同上限 5%'],['浸出率（细粉，干基）','淡色约 80–82% 以上；深色 75–78%'],['粗细粉差','1.2–1.8%（<1.8% 为好）'],['库尔巴哈指数','38–42%（<35 溶解不足，>41 过度）'],['脆度','>85–87%；全玻璃质粒 <2%'],['协定麦汁黏度','<1.55–1.6 mPa·s（8.6% 浓度）'],['β-葡聚糖（65 °C 协定麦汁）','<350 mg/L'],['色度','淡色协定麦汁 ≤4 EBC；煮沸麦汁 ≤5–7 EBC'],['糖化力','淡色 240–260 WK'],['游离氨基氮','120–160 mg/100 g 干麦芽'],['DMS 前体 / TBA','≤5 mg/kg；TBA ≤14–15']],
  pts:['协定糖化法是各项分析的共同基础：50 g 麦芽粉加 200 mL 水，45–46 °C 保持 30 min，以 1 °C/min 升到 70 °C，再加 100 mL 水保持 1 h，冷却补重后过滤测浸出物。','Carlberg 纵切染色法看均一性（≥70%，最好 75%），能发现混入的短芽麦芽。','近红外快速仪器能在 1 分钟内给出主要数据。'],
  q:[['为什么同时需要“脆度”和“库尔巴哈指数”两个溶解指标？','脆度看细胞壁（物理上是否松脆，关系 β-葡聚糖和过滤）；库尔巴哈看蛋白溶解（可溶氮占总氮，关系泡沫、FAN 和色度）。两者可以不同步。']]},
 {id:'s2-8',no:'2.8',t:'特种麦芽',en:'Special malts',p:'179–187',

   ['浅焦香（Carahell 类）','20–40','焙炒滚筒里 70–80 °C 让籽粒内部糖化，再焙炒','提升酒体和泡沫'],

   ['糊精麦芽（Carapils 类）','3.5–5','只糖化，60–65 °C 低温烘干','至 15%；无醇啤酒可到 30%'],
   ['酸麦芽','约 3.5','绿麦芽喷乳酸，含 2–4% 乳酸，pH 3.4–3.5','降低醪 pH；配硬水常用 6–9%'],
   ['焙烤、巧克力麦芽','800–1,600','淡色麦芽润湿后 180–220 °C 焙烤，喷水“去苦”','0.5–2% 调色'],

STAGES.push({id:'st3',n:3,name:'麦汁制备',en:'Wort production',pages:'195–366',
 sum:'在糖化间把麦芽中不溶的淀粉和蛋白变成可溶浸出物，分离酒糟，煮沸加酒花，去除凝固物，再冷却充氧。这一阶段决定可发酵糖比例、苦味、DMS 和热负荷。',
 inp:'麦芽（和辅料）、酿造水、酒花',out:'接种麦汁：如 11–12 °P，5–8 °C，溶氧 8–10 mg/L',

 steps:[
 {id:'s3-1',no:'3.1',t:'粉碎',en:'Milling',p:'196–214',
  goal:'把胚乳粉碎得足够细，便于酶作用；同时尽量保护谷皮，让它在过滤槽里继续充当滤层。',
  params:[['六辊典型辊距（过滤槽粗粉）','预碎辊 1.2–1.6 mm，皮辊 0.6–0.8 mm，粒辊约 0.4 mm；压滤机粉更细'],['辊','直径约 250 mm，长 0.8–1.0 m；600–900 条斜齿纹，两辊转速比约 1.25 : 1'],['调湿粉碎','粉碎前 1–2 min 用 30–35 °C 蒸汽或水；谷皮水分 +1.2–2.5%，籽粒内部仅 +0.3–0.5%'],['浸渍调湿','60–70 °C 水接触 50–60 s（要抑制脂氧合酶可用 80 °C）'],['粉的体积','未调湿 0.5–0.7 hl/100 kg；调湿 0.8–1.0 hl/100 kg'],['筛分检验','6 级筛：谷皮、粗粒、细粒 I、细粒 II、粉、细粉；锤磨粉的谷皮部分只有约 1%'],['粉尘','0.4–1.4 kg/100 kg 麦芽']],
  pts:['矛盾在于：粉越细酶作用越充分，但过滤槽需要完整的谷皮做滤层。湿而有弹性的谷皮加上干而脆的胚乳是理想状态，这就是调湿粉碎。','溶解差的麦芽要磨得更细；溶解好的麦芽、强糖化法、过滤时间长时可以粗一些。','压滤机靠薄滤饼和聚丙烯滤布过滤，不依赖谷皮，可以用锤式粉碎机磨得很细，收率更高。','粉碎一开始脂氧合酶就被激活 → 粉仓和调湿段可以充惰性气体，投料尽快进行。','防爆：辊下防爆板、泄爆片、Q 管或抑爆系统，设备良好接地。'],
  faults:[['过滤慢、酒糟压实','粉太细或谷皮破碎太多','放大辊距，采用调湿粉碎'],['酒糟可提取浸出物高','粉太粗、辊磨损、麦芽太湿','调整辊距、重磨辊子、放慢粉碎']],
  q:[['调湿粉碎为什么能同时提高过滤速度和收率？','润湿的谷皮有弹性、不易碎，体积增加 10–20%，滤层更松；胚乳仍然干脆，可以磨细，酶作用面更大。']]},
 {id:'s3-2',no:'3.2',t:'糖化',en:'Mashing',p:'214–247',
  goal:'让麦芽中的酶在各自最适条件下，把淀粉分解成糖和糊精，分解 β-葡聚糖和蛋白，并按啤酒类型设定可发酵糖的比例。',
  params:[['休止温度','45–50 °C 蛋白与 β-葡聚糖；62–65 °C 麦芽糖（β-淀粉酶）；72–75 °C 糖化（α-淀粉酶）；76–78 °C 终止'],['糊化温度','有淀粉酶存在时麦芽和大麦淀粉约 60 °C；大米 80–85 °C'],['可发酵糖（淡色全麦）','占浸出物 62–68%；其中麦芽糖约 65%、麦芽三糖约 17.5%、葡萄糖和果糖约 12%、蔗糖约 5%'],['料水比','淡色 3–4 hl/100 kg；深色 3–3.5 hl/100 kg；醪比成品原麦汁浓 5–6%'],['目标醪 pH','5.1–5.2（未处理时通常 5.6–5.9）'],['麦汁 FAN 与锌','FAN 约 200–230 mg/L（12%）；锌 ≥0.10–0.15 mg/L'],['搅拌','周速 ≤2 m/s（最高 3），为防剪切宜 <1 m/s'],['糖化时长','浸出法 1.5–2 h；煮出法最多约 3 h']],
  pts:['淀粉分解三步不能颠倒：糊化（淀粉粒吸水膨胀破裂）→ 液化（α-淀粉酶迅速降低黏度）→ 糖化（α-淀粉酶切成 7–12 个葡萄糖的糊精，β-淀粉酶从链端切下麦芽糖）。两种淀粉酶都切不开 1,6 支点，所以总会留下界限糊精。','碘检：冷却的醪样滴 0.02 N 碘液不再变色即“碘正常”。若到定型麦汁仍显蓝色，只能补加头道麦汁或麦芽浸出物来补救。','62–63 °C 长休止 → 麦芽糖多、发酵度高；以 72–75 °C 为主 → 糊精多、发酵度低。醪较稠时酶受保护，发酵度略高；较稀时浸出更多。','β-葡聚糖：内切葡聚糖酶最适 45–50 °C（40–45 °C）而且怕热；耐热的溶解酶（约 62 °C）只释放不分解 → 溶解差的麦芽不适合高温投料。泵、急弯、剧烈搅拌产生的剪切力会让 β-葡聚糖交联成凝胶。','蛋白：45–50 °C 生成较多氨基酸（酵母营养），60–70 °C 生成较多高分子产物（泡沫）。溶解好的麦芽再做长时间 50 °C 休止，泡沫反而变差。','脂氧合酶在低温、较高 pH 的投料阶段最活跃 → 高投料温度（≥60 °C）、低 pH（5.1–5.2）、避免进氧都能保护风味稳定性。','生物酸化：培养麦芽自带的乳酸菌（如 L. amylovorus，48 °C），得到 0.8–2% 的乳酸液；每把 pH 降 0.1，醪中约需 60 mL/kg 麦芽的 0.8% 乳酸液（加在麦汁中约需一半）。纯酒令下这是唯一合规的降 pH 方法。','煮出法永远煮稠醪：稠醪里是尚未溶解的颗粒，需要煮沸破开淀粉；稀醪溶有大量酶，一煮就失去酶。回混时把煮沸醪泵入未煮醪，并尽量从底部进入以免吸氧。'],
  w:['chart:enz','chart:mash','tool:water','tool:decoct'],
  faults:[['碘反应不正常','糖化温度过高或时间不足；终止温度过高使 α-淀粉酶失活','延长 72 °C 休止；终止温度不超过约 78 °C'],['发酵度偏低','麦芽糖休止不足','延长 62–64 °C 休止'],['泡沫差、口感空','50 °C 休止太长，蛋白分解过度','缩短或取消低温蛋白休止，提高投料温度'],['过滤困难','β-葡聚糖高、剪切过大','检查麦芽溶解；降低搅拌和泵速，避免急弯']],
  q:[['为什么终止温度一般不超过 78 °C？','过滤中还会溶出少量未分解的淀粉，需要仍然有活性的 α-淀粉酶完成后糖化；超过约 78–80 °C 它迅速失活，麦汁可能不再碘正常，形成淀粉浑浊。'],['高温投料（60–64 °C）的前提是什么？','麦芽必须溶解得非常好而且均匀（脆度 >85%、均一性 ≥70%、协定麦汁黏度 <1.6 mPa·s），否则 β-葡聚糖得不到分解，过滤出问题。'],['为什么煮出法比浸出法多耗 10–20% 的能量？','除了把全醪升温，还要把相当一部分稠醪单独加热到沸腾并保持一段时间。']]},
 {id:'s3-3',no:'3.3',t:'辅料糖化与特殊糖化法',en:'Adjuncts, special mashing',p:'245–255',
  goal:'处理糊化温度高、没有经过制麦的谷物；或者用特殊程序得到特定的发酵度或收率。',
  params:[['大米','米粉加 10–20% 麦芽粉，每 100 kg 至少 5 hl 水；78 °C 液化 10–20 min，或 85–90 °C 糊化后兑入较冷的麦芽醪到 72–75 °C，再煮沸 30–40 min'],['玉米片','已压片糊化，可直接投入糖化锅'],['高粱','可用 100% 高粱麦芽；52 °C、pH 约 4.6 保证 FAN'],['酶制剂','耐热细菌 α-淀粉酶（80 °C 以上仍有效）、蛋白酶、葡聚糖酶（纯酒令不允许）'],['跳跃糖化','约 35 °C 稠醪中注入沸水，直接升到约 72 °C → 发酵度极限约 40%'],['麦芽糖酶休止','45 °C → 葡萄糖可达 35–40%，乙酸异戊酯等酯香增加 70–120%'],['加压糖化','2–3 bar 可多得 2–3% 收率，但额外浸出物质量差'],['糖化时长约束','每天 8 批须每 3 h 投料和定型；12 批则每 2 h']],
  pts:['米淀粉糊化后黏度极高：先与一部分麦芽醪一起升温，让 α-淀粉酶把它液化，再煮沸，最后兑入主醪。','辅料比例越高，麦汁的 FAN、多酚越少，口味越淡——从一开始就要考虑与全麦芽竞品的差别。','每天批次越多，越需要精确到分钟的程序和计算机控制。'],
  q:[['跳跃糖化为什么能得到低发酵度的麦汁？','它直接越过了 β-淀粉酶最适的 62–65 °C，只让 α-淀粉酶在 72 °C 工作，于是生成大量不可发酵的糊精。']]},
 {id:'s3-4',no:'3.4',t:'过滤',en:'Lautering',p:'255–281',
  goal:'把麦汁和酒糟分开，再用洗糟水把酒糟里的浸出物洗出来；速度、清亮度和收率三者都要顾到。',
  params:[['头道麦汁','比定型麦汁高 4–6%（12% 啤酒约 16–20%）'],['温度','全程接近 78 °C，不超过约 80 °C'],['假底负荷','干法粉 140–175 kg/m²；调湿 150–210；浸渍调湿 200–280'],['假底','缝宽 0.7–0.9 mm，开孔率 8–12%，距槽底约 20 mm'],['进醪','从底部进，10 min 内完成，进口流速 ≤1 m/s'],['酒糟静置','5–30 min（150 kg/m² 时糟层约 25 cm）'],['残糖水','洗到约 2%（最多 3%）就停'],['2 h 节奏','准备和进醪 15 min + 头道麦汁 45 min + 洗糟 45 min + 排糟清理 15 min'],['压滤机','糟层约 4 cm，周期 100–110 min，每天可做 12 批；滤布寿命 2,000–3,500 批'],['酒糟','每 100 kg 麦芽得 100–130 kg 湿糟（水分 70–80%），约合每 hl 啤酒 21–22 kg']],
  pts:['过滤槽顺序：排气（热水从下面顶满假底）→ 进醪 → 静置 → 回流浑浊麦汁 → 头道麦汁 → 洗糟（二道麦汁）→ 排糟。','静置后酒糟分三层：底层面团、主层、顶层面团（蛋白和细谷皮，透性差，要尽早打破）。','抽吸会把酒糟压实，所以按压差控制耕刀：压差升高就降刀松糟，浊度升高就抬刀。','分次小洗比连续洗收率高；连续洗更清亮、少浸提谷皮、少吸氧。','洗糟后期多酚、苦味物和硅酸溶出越来越多，所以不要过度洗糟，也不要轻易回用残糖水。','从上方抽出头道麦汁再精滤，可缩短约 20 min 而不损失收率。'],
  faults:[['酒糟可洗出浸出物高（>0.8%）','麦芽溶解差、粉太细、洗糟太快、醪分布不均、酒糟压实、头道麦汁太稀、过滤太冷','用溶解好的麦芽，调粗粉碎，保证洗糟时间，均匀布醪，控制抽吸，头道麦汁 18–20%，全程保温约 78 °C'],['酒糟可提取浸出物高','麦芽溶解差、粉太粗、糖化太短或不合适','调细粉碎，延长或强化糖化，稠醪煮得更久']],
  q:[['头道麦汁浓度越高，为什么收率反而越高？','头道麦汁量少了，就能留出更多洗糟水去冲洗酒糟，残留在糟里的浸出物更少。'],['能不能用 100 °C 过滤来加快速度？','不能。高温虽降低黏度，但会让 α-淀粉酶失活，洗糟中溶出的残余淀粉无法后糖化，造成“蓝醪”和淀粉浑浊。']]}
 ]});

STAGES[2].steps.push(
 {id:'s3-5',no:'3.5',t:'麦汁煮沸与加酒花',en:'Wort boiling, hop addition',p:'281–323',
  goal:'溶解并异构化酒花苦味物，让蛋白与多酚凝固，灭菌并破坏全部酶，蒸发水分和 DMS 等不良挥发物，同时把热负荷压到最低。',
  params:[['煮沸时间','传统 50–60 min；现代系统 40–50 min（有的 35–40 min）'],['总蒸发','现代目标约 4–6%（过去 10–15%）'],['低压煮沸','102–104 °C，最大过压约 0.5 bar'],['定型麦汁 pH','未酸化约 5.4–5.5；宜在煮沸末生物酸化到 5.1–5.2'],['可凝固氮','冷麦汁宜 20–30 mg/L（至少 14 mg/L）'],['游离 DMS','宜 40–60 µg/L 以下，冷却中点不超过 100 µg/L'],['热负荷 TBI','定型麦汁 <45（宜 30–40）；冷麦汁 <60'],['MgSO₄ 可沉淀氮','约 200 mg/L；越高泡沫越好'],['α-酸异构化所需时间','100 °C 约 90 min；130 °C 3–5 min；140 °C 2–3 min'],['能耗','常规煮沸（蒸发 12%）约 14 kWh/hl 定型麦汁；低压煮沸约 9 kWh/hl']],
  pts:['苦味去向：煮沸中只有约 1/3 的 α-酸异构化；之后凝固物、酵母和泡沫还会带走一部分，最终按成品约 25–35% 留在啤酒里。','pH 较高时异构化更好；pH 较低时苦味更细腻、色度升得少、蛋白凝固更好（最适约 pH 5.2）。','如今不追求把可凝固蛋白全部沉淀，而是保留一部分高分子蛋白给泡沫，所以煮沸时间和强度都在下降。','DMS：前体 SMM 受热裂解成游离 DMS，随蒸汽排出；回旋静置中前体还在裂解 → 回旋前预冷到 85–90 °C 以下，或回旋后用汽提、闪蒸再除一次。','内加热器（锅内管束 + 分配伞）结构简单、易于 CIP；外加热器（每小时循环 7–8 次）控温精确、可用很低的蒸汽压。动态低压、分级香气煮沸、薄膜蒸发、真空闪蒸、汽提塔等现代系统的共同目标：低能耗、短时温和、低热负荷、保留泡沫蛋白。','锅汽冷凝器回收汽化热：每蒸发 1 hl 约得 0.8 hl 80 °C 热水；配合蓄能罐，可把下一批 72–74 °C 的麦汁预热到 93 °C 以上。','加酒花：多个品种时苦型先加，尽量异构化并赶走月桂烯等粗糙挥发物；香型最后加，甚至加在降到约 80 °C 的回旋槽里。'],
  w:['tool:hops'],
  faults:[['DMS 高（煮蔬菜味）','麦芽前体高、蒸发不足、回旋静置太久太热','保证蒸发效率；回旋前预冷或回旋后汽提'],['TBI 高、色深','长时间强烈煮沸、回旋久','缩短煮沸、降低强度、回旋前预冷'],['热凝固物差','煮沸不足、pH 偏高、麦汁浑','酸化到 pH 5.2，保证剧烈沸腾，提高过滤清亮度']],
  q:[['现代煮沸更短更温和，为什么不担心 DMS？','靠结构给麦汁足够的蒸发界面（分配伞、薄膜、闪蒸、汽提）把 DMS 带走，同时避免长时间强热带来的 TBI、色度上升和泡沫蛋白过度沉淀。'],['为什么锅汽要冷凝回收，而不是直接排掉？','一方面回收大量汽化热得到热水，另一方面排出的蒸汽气味会扰民（德国受排放法规约束）；冷凝水含 DMS 等物质，不宜作酿造水，但可用于预冲洗等。']]},
 {id:'s3-6',no:'3.6',t:'糖化间收率',en:'Brewhouse yield',p:'323–331',
  goal:'用定型麦汁的量和浓度，算出投料中有多少变成了浸出物；这是糖化间效率的核心指标，也是税务核查的依据。',
  params:[['公式','收率 = 浸出物(kg/hl) × 0.96 × 热定型麦汁(hl) ÷ 投料(dt)'],['0.96','热麦汁（约 100 °C）冷到 20 °C 的体积收缩系数'],['收率因子','浸出物 × 比重 × 0.96，已并入 Plato 表（例如 12.0% 对应 12.06）'],['正常范围','74–79%；最多比细粉、风干基的实验室收率低约 1%'],['比重计','20 °C 校准，读最上方仍清楚的刻度；不在 20 °C 时查修正值']],
  pts:['实验室收率与糖化间收率之差是评价设备和操作的标尺；现代糖化间这个差很小。','影响因素：麦芽（溶解度；投料按风干基记，水分越高收率越低）、设备、糖化法（稠醪煮得越久浸出越多）、过滤（分次洗糟、出流均匀）、操作纪律。','回收的浑浊麦汁回到下一批时，计算下一批收率要扣掉其体积的 75%，避免重复计算。'],
  w:['tool:yield'],
  q:[['为什么要乘 0.96？','定型麦汁在接近 100 °C 下量取，比重计却在 20 °C 读数；冷却时体积收缩约 4%（这 4% 里还包括酒花糟和凝固物），不乘就会高估浸出物。']]},
 {id:'s3-7',no:'3.7',t:'回旋沉淀与热凝固物',en:'Whirlpool, hot break',p:'336–346',
  goal:'去除 30–80 µm 的热凝固物（粗凝固物）。它妨碍澄清、包裹酵母、增加损失，还带入麦芽脂肪酸。',
  params:[['热凝固物','定型后 6,000–8,000 mg/L，去除后应 ≤100 mg/L'],['回旋槽','平底，向出口有 1% 坡度；直径与液高常取 3 : 1（1 : 1 到 5 : 1）'],['进口','流速 ≤3.5 m/s，大流量、低剪切，切向进入（底部一个防吸氧，下 1/3 一个产生旋转）'],['静置','20–30 min；加 Denk 环可缩短 30–60%，但不少于 20 min'],['Imhoff 锥测试','适合回旋的麦汁 5–6 min 沉降完，上层清亮'],['分离机','损失 <0.3%，但碟片驱动 0.65–0.8 kW/m³、投资高'],['整酒花','每 kg 酒花约带走 4.9 L 麦汁（喷淋加压榨可降到 2.0 L）']],
  pts:['“茶杯效应”：旋转停下后，底部边界层因摩擦减速，压力与离心力失衡，形成指向中心的二次流，把颗粒推到中央堆成锥。','底部的环形涡会干扰沉降，Denk 环（离底一定高度的同心格栅）可以切断它。','为降低热负荷和后生成的 DMS，现代工艺尽量缩短回旋静置，并在回旋前预冷到 85 °C 以下。','浑浊麦汁（约 75% 麦汁 + 25% 凝固物）在下一批洗糟开始时加回，几乎可全部回收。'],
  faults:[['凝固物锥不紧、带进冷麦汁','过滤浑、管道剪切大、进液太快、二次流强、出液太快、液高与直径比例不当','逐项检查进液条件；出液末期放慢速度']],
  q:[['回旋槽底部为什么不宜做中心凝固物杯？','凹坑破坏底部边界层、削弱回旋效应，也不能防止锥体露出液面后坍塌。']]},
 {id:'s3-8',no:'3.8',t:'冷却、充氧与冷凝固物',en:'Cooling, aeration, cold break',p:'347–357',
  goal:'快速把麦汁冷到接种温度，按需去除冷凝固物，并给酵母供足氧。',
  params:[['冷却','板式换热器，从 95–98 °C 冷到 5–8 °C'],['一段冷却','1–2 °C 冰水被加热到 80–88 °C；两段冷却先用工艺水预冷，再用冰水'],['板片压差','通常约 2 bar，最多 4 bar'],['冷凝固物','约 0.5 µm，60 °C 以下开始析出；冷到 5 °C 仍有约 14% 溶解'],['残留冷凝固物','120–160 mg/L（干物质）较理想'],['充氧目标','8–10 mg O₂/L；理论上每 hl 只需约 3 L 空气，实际要多得多'],['氧的溶解系数','0 °C 47.4，10 °C 36.8，20 °C 30.0 mL/(kg·bar)']],
  pts:['冷麦汁充氧是整个啤酒生产中唯一有意加氧的时刻：几小时内被酵母用于合成不饱和脂肪酸和甾醇，并不伤麦汁。热麦汁充氧则会大量氧化，使麦汁变深变苦。','空气必须先经无菌过滤；充氧方式有烧结烛管、文丘里管、双组分喷嘴、静态混合器、离心混合器。','冷凝固物是蛋白-多酚复合物，不宜完全去除，否则口味发空；方法有珍珠岩过滤（约 90%）、浮选（4–8 h，去除 60–65%，已少新建）、冷麦汁分离机（50% 以上）。','如果热凝固物去得干净、酵母活力强，如今多数厂不再单独去除冷凝固物。'],

 steps:[
 {id:'s5-1',no:'5.1',t:'硅藻土过滤',en:'Kieselguhr filtration',p:'453–473',
  goal:'用预涂层和连续添加的硅藻土截留酵母和浑浊颗粒，同时绝不让氧进入啤酒。',
  params:[['预涂','第一层粗土约 700–800 g/m²（约占 70%），第二层较细的土；合计 800–1,200 g/m²，厚 1.5–3 mm，约 10–15 min'],['连续添加','60–120 g/hl（约 1/3 中等土 + 2/3 细土）；整个过程 80–120 g/hl，最多约 200'],['压差上升','平均约 0.1–0.3 bar/h（罐式最多 0.5 bar/h）'],['终止压力','板式预涂机 2–5 bar；烛式 6–8 bar'],['烛式滤机','楔形丝缝 50–80 µm，烛芯最长约 2 m，最多约 700 根，无运动部件'],['灭菌','出口 >85 °C（最好 90–95 °C）后至少保持 30 min'],['助滤剂','硅藻土用于啤酒（湿密度 <300 g/L 较好）；珍珠岩只用于麦汁'],['比过滤能力（hl/(m²·h)）','烛式预涂 4.8–6；板式预涂 3.8–4；纸板 1.5–1.8；除菌过滤 0.8–1.0']],
  pts:['支撑网孔（70–100 µm）远大于硅藻（2–4 µm），所以必须先预涂出一层互相支撑的“桥”。压力或流量一冲，桥就断，啤酒立刻跑浑 → 滤前滤后设缓冲罐，恒流运行。','添加太少：酵母不能嵌进土层，形成阻挡层，压力陡升；添加太多：曲线平缓，但过早占满滤渣空间；酵母冲击会造成堵塞。','1 L 空气（0.5 bar 表压）约含 450 mg 氧，混进 450 hl 啤酒就会让它升高约 0.01 mg/L——所以管道要用脱氧水排空气，用纯 CO₂ 背压，不回收富氧的前后段。','前后段（水与啤酒的混合段）含氧、易污染，至少要经过瞬时杀菌（约 28–30 PU）；为了能兑回去，酿造时浸出物要提高 0.2–0.3%。','硅藻土粉尘（尤其煅烧后含方石英）可致矽肺：散装入仓、无尘拆袋、戴 P2 面罩、定期体检。'],
  q:[['硅藻土过滤为什么必须“恒流、无冲击”？','滤饼是靠颗粒互相搭桥形成的，压力或流量突变会撕裂滤层，浑浊颗粒直接穿过去。']]},
 {id:'s5-2',no:'5.2',t:'精滤、错流与无硅藻土过滤',en:'Sheet, membrane, cross-flow',p:'473–487',
  goal:'在硅藻土之后进一步澄清或除菌，或者用膜和可再生助滤剂彻底取代硅藻土。',
  params:[['冷除菌串联','精滤约 5 µm → 抛光约 1 µm → 除菌约 0.45–0.5 µm'],['纸板和模块','纤维素 + 硅藻土；分粗滤、澄清、精滤、除菌（EK）等级；越精通量越小'],['错流膜','中空纤维或陶瓷，孔 0.4–0.8 µm（啤酒常用 0.45–0.65 µm）'],['典型膜系统','每 2 h 或 4–5 h 反冲一次；损失 0.2–0.4%；膜寿命约 4,000 h'],['连续式错流','浓缩液干物质上限约 17–18%'],['可再生助滤剂','例如聚苯乙烯 + PVPP 的颗粒：预涂约 2 kg/m²，连续 50–300 g/hl，兼有稳定作用'],['预澄清分离机','可减少硅藻土 20–50%，滤机周期约翻倍']],
  pts:['取代硅藻土的动力主要是废土处置费和健康风险，而不是土本身的价格。','膜过滤的难点：孔径均匀、长期耐压、断丝时能立即隔离、清洗能恢复全部孔（碱加过氧化氢比单用碱效果好）。','纸板机效果好，但只能在厂内反洗，占地大、人工多，不耐高固含量和高菌数。'],
  q:[['错流过滤和死端过滤的根本区别是什么？','死端过滤让全部液体穿过滤层，颗粒越积越厚；错流过滤让液体沿膜面流过，只有一部分清液透过，截留物被流动冲刷并回流浓缩。']]},
 {id:'s5-3',no:'5.3',t:'生物稳定化',en:'Microbiological stabilisation',p:'487–493',
  goal:'保证保质期内不被微生物破坏：要么杀死，要么除去所有可能的腐败菌。',
  params:[['PU 定义','60 °C 保持 1 min = 1 PU；PU = 时间(min) × 1.393^(T−60)'],['所需 PU','啤酒一般 14–15 PU，污染重时 22–27 PU；罐装啤酒 18–20 PU（最多约 30）'],['瞬时杀菌','68–72 °C 保持约 50 s，全程约 2 min；热回收可达 96%；需最高约 12 bar 的泵压防止 CO₂ 析出'],['隧道杀菌','约 1 h；能耗 14–24 MJ/hl；瓶内顶隙 ≥4%（0.5 L 瓶约 20 mL）'],['罐装杀菌温度','不超过约 62 °C（罐只耐 6 bar）'],['常见腐败菌','野生酵母（如 S. diastaticus）；Pectinatus、Megasphaera、短乳杆菌、有害片球菌等']],
  pts:['温度稍升，所需时间就指数下降：以 15 PU 为例，64 °C 约 4 min，68 °C 约 1 min，72 °C 只要约 17 s——控温必须极准。','PU 衡量的是杀菌效果，不是风味损伤；风味受损更取决于保持时间和啤酒含氧量。','约一半的污染来自过滤后、灌装时的二次污染，所以瞬时杀菌对洗瓶和灌装卫生要求很高。','冷除菌灌装避免了热损伤，是趋势；但整条线都要按无菌设计，而且常见泡沫稳定性变差（蛋白酶 A 仍在）。','隧道杀菌的冷点在瓶底中央上方约 1.5 cm，温度要在那里测；停机时要有 PU 保护，防止过度杀菌。'],
  w:['tool:pu'],
  q:[['隧道杀菌的瓶子为什么必须留足顶隙？','液体几乎不可压缩，受热膨胀只能压缩顶部的气体；顶隙太小，内压会升到几个 bar，把瓶子撑破。'],['为什么说瞬时杀菌只保证了“啤酒本身”的生物纯净？','它在灌装之前进行，之后的洗瓶、灌装、压盖环节仍可能带入微生物。']]}
 ]});

/* ---------- 第 5 阶段 过滤与稳定化（下） ---------- */
STAGES[4].steps.push(
 {id:'s5-4',no:'5.4',t:'胶体稳定化',en:'Colloidal stabilisation',p:'493–504',
  goal:'推迟冷浑浊和永久浑浊的出现：减少蛋白降解物和多酚中的一方，并排除加速它们结合的因素。',
  params:[['冷浑浊','冷却时出现、回温到 20 °C 又溶解；随时间转为不再溶解的永久浑浊'],['加速因素','温度（影响最大）、氧化（可让浑浊提前约 5 倍）、重金属离子、晃动、光'],['硅胶','50–150 g/hl；吸附形成浑浊的多肽，对泡沫蛋白影响小；颗粒平均 8–20 µm 最有效'],['PVPP','选择性吸附多酚；德国最多 50 g/hl；可用约 85 °C 的 1% NaOH 再生重复使用'],['硅溶胶','约 30–60 mL/hl，冷贮前加入，与蛋白交联成凝胶后沉降、被完全去除（符合纯酒令）'],['工艺底线','定型麦汁可凝固氮 ≤2 mg/100 mL；过滤前 −2 至 0 °C 冷贮 ≥7 天']],
  pts:['冷浑浊是高分子蛋白降解物与高度缩合的多酚（主要是花色苷原）靠氢键松散结合而成，夹带少量碳水化合物和重金属。颗粒在布朗运动中不断碰撞、越聚越大，最后肉眼可见。','工艺措施贯穿全程：低蛋白细皮大麦、良好溶解、充分焙焦、残碱 <5 °dH、不做长蛋白休止、完全糖化、不过度洗糟、强力煮沸和充分凝固、酸化到 pH 5.1–5.2、冷而旺盛的发酵、足够的冷贮、全程排氧、不接触裸露的非不锈钢金属。','这些措施只能推迟、不能阻止浑浊，所以保质期长的啤酒还要用稳定剂：硅胶去蛋白、PVPP 去多酚，两者可以联用。'],
  q:[['为什么巴氏杀菌反而会加速胶体浑浊？','温度升高加快了蛋白与多酚的聚合；杀菌解决了生物稳定，却牺牲了一部分胶体稳定。']]},
 {id:'s5-5',no:'5.5',t:'风味稳定与防氧',en:'Flavour stability, oxygen',p:'504–509',
  goal:'延缓老化味：从制麦起就控制老化物质的前体，从贮酒罐到瓶子杜绝进氧，并保护成品不受光和热的伤害。',
  params:[['老化羰基','2-甲基丁醛、3-甲基丁醛、苯乙醛等 Strecker 醛，以及脂肪降解产生的醛；阈值极低，在瓶中不断增加'],['进氧预算','贮酒罐出口 0.00–0.01 mg/L；到灌装机入口最多再增加 0.01–0.02 mg/L'],['瓶或罐中总氧','<0.10–0.15 mg/L'],['CO₂ 纯度','≥99.998%'],['日光臭','350–500 nm 的光使异 α-酸侧链裂解成硫醇；棕瓶防护最好，绿瓶不足'],['麦芽这一端','TBA <14、库尔巴哈 <41%、凋萎温度低（30–40 °C）'],['糖化这一端','投料 60–62 °C、醪 pH 约 5.2、低氧投料、回旋热保持 <30 min']],
  pts:['两大前体库：不饱和脂肪酸（脂氧合酶酶解与自氧化）和美拉德产物（焙焦与煮沸中形成）。其中很大一部分在麦芽里就已定型，之后无法降低。','老化气味会依次出现：黑醋栗味（严重进氧后几天）、纸板味（脂肪降解）、面包和甜麦芽味（Strecker 醛）、雪莉酒味。','氧是头号敌人，但不是唯一原因：很多转化不需要氧，高温贮存和持续晃动同样加速老化。','抗坏血酸等还原剂（非纯酒令国家可用）反而会增加羰基生成，不能无限延长保质期；酵母自产的 SO₂ 有一定保护作用。','充 CO₂：只有 CO₂ 不足时才做；CO₂ 要极细地分散并有足够的溶解管段，喷气元件必须易于清洗（不要用烧结棒），因为其后已没有过滤。'],
  q:[['为什么灌装日期比保质期更能说明啤酒好不好喝？','经过稳定化的啤酒几乎能一直保持清亮，但风味从灌装那天起就在老化；灌装日期直接告诉你它已经放了多久。'],['容器预压时为什么用的水也必须先脱氧？','先充水再用 CO₂ 顶出，水中的溶解氧会进入 CO₂ 气相，随后又溶入啤酒。']]},
 {id:'s5-6',no:'5.6',t:'特殊工艺',en:'Special methods',p:'509–523',
  goal:'高浓酿造提升产能，冰啤改变口感，脱醇或限制发酵来生产无醇和低醇啤酒。',
  params:[['高浓','定型麦汁常用 13.5–14.5%；上限约 14.5–15%，再高副产物在成品里可察觉'],['节能例','300 hl 11% 改成 15% 只需 220 hl，少加热煮沸 26.7%'],['高浓发酵供氧','约每 1% 原麦汁 1 mg O₂/L'],['过滤后加水','成分与酿造水一致、冷到 −1 °C、除菌、完全脱氧、充到啤酒的 CO₂ 含量，并全程按比例加入'],['冰啤','冷到约 −4 °C 形成冰晶，再结晶长大后分离，用碳酸水调酒度'],['反渗透脱醇','约 40 bar，啤酒 ≤15 °C；透过液含酒精 1.5–1.8%'],['透析脱醇','啤酒只从 1 °C 升到约 6 °C；某些酯最多损失 65%'],['真空蒸馏','绝压 0.04–0.2 bar，蒸发温度 30–55 °C'],['无醇啤酒','酒精 <0.5% vol；常先脱到约 0.3%，再兑起泡酒或成熟啤酒恢复香气'],['中断发酵法','原麦汁 9–11%，发酵到 0.5% 酒精（表观发酵度约 10%）后停止，0–1 °C 成熟至少 10 天']],
  pts:['高浓的好处主要是稀释水不必加热和煮沸；代价是发酵更慢、酯和高级醇更多，泡沫随稀释变差，回旋沉淀也可能变差。','冰啤中部分多酚和多肽随冰析出，口感更顺更圆，泡沫与稳定性通常改善；“冰”指的是工艺，不是饮用温度。','所有脱醇方法都会同时带走一部分酯和高级醇，所以要回兑。','限制发酵的难点是麦汁味：从 7–8% 的麦汁出发、配 8–15% 浅色焦香麦芽、煮沸不要太短、选合适的酵母。冷接触法在 −2 °C 让酵母还原麦汁味的羰基而几乎不产酒精；固定化酵母可在约 1 °C 连续、可控地生产。'],
  w:['tool:hg'],
  q:[['高浓酿造在过滤后加水，为什么是最复杂的一环？','这些水直接进入成品：成分、温度、无菌、脱氧、CO₂ 含量都必须与啤酒一致，而且要在整个放酒过程中按比例加入，事后无法纠正。']]}
);

/* ---------- 第 6 阶段 灌装与收尾（上） ---------- */
STAGES.push({id:'st6',n:6,name:'灌装与收尾',en:'Filling, packaging, losses, cleaning',pages:'532–731',
 sum:'把清酒装进瓶、罐、桶，保住 CO₂、不进氧、不污染；再经贴标、装箱、码垛送出工厂，并用损耗、麦芽单耗和清洗体系把整条线闭环管起来。',
 inp:'清酒（0–1 °C）',out:'瓶装、罐装、桶装成品；总氧 ≤0.10–0.15 mg/L',
 chips:['洗瓶 80–85 °C','灌装吸氧 ≈0.02 mg/L','损耗 8–10%'],
 steps:[
 {id:'s6-1',no:'6.1',t:'洗瓶与空瓶检验',en:'Bottle washing, empty bottle inspection',p:'532–564',
  goal:'让回收瓶干净、无菌、无残留地回到灌装机，并逐瓶剔除有缺陷或不干净的瓶子，同时控制用水、用热和化学品。',
  params:[['碱液','1.5–2.0% NaOH（1.6% 最佳）加添加剂；第二碱槽 65–70 °C、0.6–0.8%'],['温度','80–85 °C；升温一次跳跃 ≤30 K、降温 ≤20 K，防止爆瓶'],['碱浸时间','平均 6–7 min（80 °C 下 6–8 min，双端机必要时可到 25 min）'],['流程','倒残液 → 预浸（约 40 °C）→ 预碱（约 60 °C）→ 主碱（80 °C）→ 碱喷 → 中间喷 → 温水喷 → 冷水喷 → 新鲜水喷'],['节拍与瓶笼','节拍约 3–4 s；200–600 个瓶笼，每排 16–40 瓶；节拍 4 s 时每个瓶位约 900 瓶/h，所以 5 万瓶/h 至少要 55 瓶/排'],['喷冲','约 2.0–2.5 bar，喷孔 2–4 mm；多数瓶口内径只有约 16 mm，限制了喷入量'],['带出量与消耗','带出量 10–20 mL/瓶（好的机器 <8）；用水 200–250 mL/瓶；耗热 30–40 kJ/瓶（目标 <35）'],['洗后抽检','表面张力 >55 mN/m，非离子表面活性剂 <0.5 mg/L，瓶内 COD <15 mg/L'],['空瓶检验','5 万瓶/h 时每瓶只有约 0.07 s；残液检测永远双重（高频 + 红外）；约每 30 min 过一次测试瓶']],
  pts:['回收瓶灌装的完整链条：分拣外来瓶和外来箱 → 检查回收瓶 → 洗瓶 → 空瓶检验 → 灌装压盖 → 液位检验 →（需要时）隧道杀菌 → 贴标 → 装箱码垛。','清洗效果来自四个要素相乘：化学（NaOH 与添加剂）、温度、时间和喷冲的机械作用。','单端机进出瓶在同一端，省地方、机身矮、便宜，但脏瓶进口挨着净瓶出口；双端机两端分开，出瓶端可以用隔墙与脏区隔开。瓶笼要略微倾斜：水平的瓶子既灌不满（气垫妨碍清洗），也排不净（带出碱液）。','30–50 °C 的温水喷淋区正好是细菌的最适温度，多孔水垢和机顶潮湿的空间也是菌窝 → 定期清洗；末道冲洗水常加少量 ClO₂（<0.4 mg/L），出瓶处抽走蒸汽，防止冷凝水滴进净瓶。','标签要整张、尽快取出，泡久了会碎成浆：靠强力循环加筛网或筛带连续捞出，湿标签含碱，再经压榨（12–15 bar）脱水约 80%。铝箔遇碱放出氢气，要抽到室外，防止在机内形成爆炸性混合气。','空气中的 CO₂ 会把 NaOH 变成碳酸盐、降低清洗力 → 按电导持续补碱。碱液中的纸浆、颜料和胶会形成泥，可用沉降、离心或膜过滤去除；膜过滤能让碱液几乎无限期使用。','空瓶检验机用多台 CCD 相机和频闪灯“冻结”图像：外侧壁（擦伤环、残标）、瓶底（异物、碎玻璃、薄膜，PET 瓶的应力裂纹）、瓶口螺纹和密封面、内侧壁；残液用两种方法查：高频利用液体的介电常数是玻璃的 2–3 倍，红外看瓶底；还可剔除过高、过矮、异色、外来的瓶子。检验机本身要用测试瓶定期验证，误剔的好瓶也要统计。','5–7 次循环后瓶身涂层被洗掉，擦伤环越来越明显；棕色瓶对 350–500 nm 的光防护最好。'],
  faults:[['洗后瓶内有残碱或表面活性剂，泡沫变差','冲洗不足、带出量大，残液检测失灵','检查喷嘴和冲洗水量；按表面张力和 COD 抽检；用测试瓶验证检验机'],['过滤后无菌，成品却检出杂菌','洗瓶机温水区、喷淋水或机顶冷凝水带菌','定期清洗温水区和机顶，末道水加 ClO₂，出瓶处抽蒸汽']],
  q:[['洗瓶机升温为什么要分几级？','玻璃怕温度骤变，一次跳 30 K 以上会产生热应力而爆瓶；预浸和预碱段既预热瓶子，又预先溶解污垢。'],['为什么残液检测要同时用高频和红外两种方法？','残碱会伤害消费者，而单一方法可能漏检（例如残标堵住瓶口、残液留在瓶里）；两种原理互相补充，才能可靠剔除。']]},
 {id:'s6-2',no:'6.2',t:'灌装与压盖',en:'Bottle filling, closing',p:'564–599',
  goal:'用等压原理把啤酒灌进瓶里，尽量排尽瓶中空气并立即封口，再逐瓶检验；灌装区还要保持无菌。',
  params:[['原理','等压（背压）灌装：瓶内气压与贮液缸相等时才开液阀；灌装压力要高于 CO₂ 饱和压力'],['灌装温度','冷灌 5–10 °C（最常见）；温灌 18–25 °C；热灌不用于啤酒'],['预抽真空','两次抽到约 90%（约 100 mbar），中间充 CO₂ → 瓶内空气降到原来的约 1%'],['长管与短管','长管阀让酒从瓶底往上灌，吸氧最少，但瓶口窄、速度受限；“短管”阀的短管其实是回气管，酒沿瓶壁流下，要配合预抽真空，能力高，现在最常用'],['灌装吸氧','现代灌装机约 0.02 mg/L；灌装后总氧 ≤0.10–0.15 mg/L'],['高压喷射（HDE）','最高约 40 bar 的极细 80 °C 热水射入瓶口，使瓶颈起泡、把空气顶出'],['顶隙氧','0.33 L 瓶 ≤0.06 mg；0.5 L 瓶 ≤0.08 mg'],['液位精度','0.5 L 瓶多灌 1 mL，年灌 10 万 hl（2000 万瓶）就是 200 hl'],['灌装机','旋转式，最多约 200 个阀；单次灌装 5–6 s；可超过 10 万瓶/h'],['皇冠盖','26 mm 规格、21 个齿；压盖时盖进入压盖环 7.7 mm，封口直径 28.6–28.7 mm；带除氧剂的垫片可结合 2–4 mg O₂'],['灌装区冲淋','易污染部位约每 2 h 用 80–95 °C 热水冲淋一次，停机或半速时冲 2–3 转，用宽水流而不是雾化喷雾']],
  pts:['计算机控制的短管阀一个循环：压紧 → 第一次抽真空 → CO₂ 冲洗 → 第二次抽真空 → 背压到与缸等压 → 快灌（酒经分流锥沿瓶壁成薄膜流下）→ 慢灌 → 探头到位结束 → 经锥形细通道缓慢卸压，防止冒泡；每周一次 CIP，阀下放假瓶。','定量方式：液位（回气管或探头，最常用）、容积（电磁流量计 IDM）、质量（多用于桶）。少灌是欺骗消费者和税务，多灌损失利润。','灌装阀的演变：旋塞式（1950 年代前，残酒会被带进下一瓶）→ 外部驱动阀（酒接触弹簧等内件，不卫生）→ 气动膜片阀（阀内没有弹簧）；换瓶型时用丝杠把环形缸和阀整体升降。','罐和 PET 瓶是薄壁容器，不能抽真空（会瘪），只能 CO₂ 冲洗预压或用长管灌装。HDE 的水量要恰当：太多反而带进氧，泡太多又损失啤酒；研究表明使用 HDE 时生成的 Strecker 醛更少。','灌后检验：液位（γ 射线、X 射线、高频或红外），同时剔除缺盖、歪盖；电磁脉冲让盖子中心振动，可以判断瓶颈是否充满细泡、盖是否密封。','压盖后要冲净盖下的残酒并吹干，否则齿下积水会生锈，存久了在瓶口下形成锈环；皇冠盖用磁性带输送、放在塑料容器里，互相磨下的漆屑会漂在酒面上且无法去除，所以料斗液位要设低。摇摆盖（瓷头 + 橡胶垫）封盖机复杂、橡胶垫易藏菌和串味，只用于高价特色酒。','灌装区的污染机理：醋酸菌到处都有，外面包着黏液荚膜，能抗干燥、热和消毒剂；荚膜里的氧被耗尽后，严格厌氧的 Pectinatus、Megasphaera 在其中定居，乳酸菌产生的乳酸又促进它们。对策：灌装机和压盖机闭路 CIP、定期热水冲淋、清理全线的“菌窝”（星轮、链道、盖板、砖缝、地沟），先喷一层硅藻土粉能找出喷淋死角。'],
  faults:[['液位高低不齐','探头或阀门故障、回气管堵塞，HDE 水量过大使泡沫溢出','逐阀检查并调整 HDE；按阀号统计液位'],['压盖后漏气或很难开启','压盖直径不对（压盖头磨损或调整不当）','用通止规逐个压盖头检查'],['瓶口下出现锈环','压盖后没有冲净吹干，仓库里有冷凝水','压盖后冲淋并吹干，仓库通风']],
  q:[['啤酒灌装为什么一定要等压？','啤酒是 CO₂ 过饱和溶液，常压下灌会立刻大量起泡，既灌不满又跑 CO₂；先让瓶内建立与缸内相同的 CO₂ 压力，啤酒才能平稳流入。'],['为什么“短管”灌装一定要预抽真空？','酒沿瓶壁流下，会和瓶内的气体接触；只有先把空气抽走、换成 CO₂，吸氧才能压到很低。'],['灌装区的厌氧菌为什么能在有空气的地方存活？','它们躲在醋酸菌的黏液荚膜里；醋酸菌耗尽荚膜里的氧，形成厌氧的小环境，还挡住了干燥、热和消毒剂。']]},
 {id:'s6-3',no:'6.3',t:'贴标与日期标注',en:'Labelling, dating',p:'604–611',
  goal:'把标签牢固、端正地贴在规定位置，印上日期和批号；同时保证标签在下一轮洗瓶时能完整、快速地脱落。',
  params:[['标签纸','单面涂布上光（金银色要金属化）；加钛白并全施胶，干湿都不透底；背面也要处理以防卷曲；Cobb 吸水值约 16–20 g/m²'],['纤维方向','与瓶轴垂直，洗瓶时更容易脱标'],['贮存','60–70% 相对湿度、20–25 °C，保持平整'],['标签胶','约 90% 酪蛋白胶，约 9.5% 淀粉胶，其余为合成胶'],['酪蛋白胶','黏度随温度变化大且有触变性 → 恒温 25–38 °C、用黏液泵循环；可用到约 8 万瓶/h；适合冷瓶、湿瓶'],['用胶量','约 8–15 g/m²'],['日期','德国须标最佳食用期；国外越来越多标灌装日，并建议 90–110 天内饮用'],['激光打码','红外脉冲最高约 6 J、约 2 µs，经金属掩模打出字样；要抽走产生的臭氧']],
  pts:['标签位置：身标、背标、胸标、颈标，环绕标越来越多。标签要耐碱、在洗瓶机里整张脱落；美、英、丹麦等国则要求标签碱溶成浆，前提是洗瓶机能处理纸浆、废水也允许。','贴标过程：上胶辊给胶片涂上薄胶 → 胶片滚过标签盒、粘起一张标签 → 打日期 → 夹指滚筒夹住没上胶的部位转交 → 贴到转盘上的瓶子并刷平。控制要做到“无瓶不取标”，断瓶后降到最低速。','胶的规律：黏度越高，初始黏着越快；酪蛋白越多，5 min 后越牢；胶层越薄，越耐冷凝水；胶层越薄、pH 越低，在碱槽中脱标越快。太厚脱标慢、易脏，太薄黏不牢、会滑移。淀粉和糊精胶对温度不敏感，适合温瓶、热瓶。','印刷颜料除蓝色（含铜络合物）外不含重金属；银色以铝为基；胶印金色用铜锌合金。','封颈箔（金色或银色铝箔）紧接在贴标之后、与出瓶星轮同步贴上。日期可用打码、在标签边缘切口、压凹或打孔、喷墨或激光。','一次性玻璃瓶由玻璃厂成托盘供货，基本干净，只需逐层卸垛，再在冲瓶机里瓶口朝下冲 8–10 s（有时省略）。'],
  faults:[['标签在洗瓶机里碎成浆','标签不耐碱、在碱槽里泡得太久、纤维方向不对','选耐碱标签；加强碱液循环，尽快把标签捞出'],['标签起皱、翘边或滑移','胶量太多或太少、胶温不对、瓶面有冷凝水','控制胶温和用量；潮湿的冷瓶用耐冷凝水的胶']],
  q:[['为什么标签纸的纤维要与瓶轴垂直？','洗瓶时标签吸碱后更容易卷起、整张脱落，不会碎成纸浆。'],['酪蛋白胶为什么必须恒温？','它的黏度强烈依赖温度，而且越搅越稀（触变性）；温度一变，上胶量和黏着力就跟着变。']]},
 {id:'s6-4',no:'6.4',t:'罐、PET 瓶与桶',en:'Cans, PET, kegs',p:'611–679',
  goal:'按容器特点调整灌装：罐和 PET 怕压、怕真空，PET 还透气；桶要全自动清洗灭菌，并靠内压证明自己密封。',
  params:[['罐','耐内压 ≥6 bar；罐壁约 0.09 mm（钢）/0.11 mm（铝）；铝罐 330 mL 约 12 g'],['罐装','阀下降压到罐上（罐不抬升）；CO₂ 冲洗预压，液膜沿罐壁灌入，约 5 s 灌完；总氧可达约 0.02 mg/L（耗 CO₂ 0.6–0.8 kg/hl）；盖下充 CO₂ 后两道卷封'],['容积式罐装','细长计量腔预先量好（超声浮子，精度 <1.5 mL），开阀后全速灌入，不需要末段减速'],['罐的液位','罐径 66 mm 时高度差 1 mm ≈ 3.4 mL（约为 0.33 L 罐的 1%）'],['PET','0.5 L 瓶 <30 g；透氧、失 CO₂，需要阻隔涂层、多层结构或除氧剂；啤酒用 PET 只做一次性瓶'],['PET 灌装','不能抽真空：短管阀用 CO₂ 吹出空气（CO₂ 约 600 g/hl，预抽真空的玻璃瓶约 250 g/hl，吸氧约 0.08 mg/L）；长管阀可用 CO₂ 预压，吸氧约 0.02 mg/L'],['塑料螺旋盖','聚丙烯两件式，垫料含除氧剂（结合 2–4 mg O₂）；盖本身带进约 5 mL 空气（铝盖约 3 mL）'],['PEN','阻气性好、耐热、可巴氏杀菌，价格约为 PET 的 5 倍，约可循环 20 次，是唯一的塑料回收啤酒瓶'],['桶（Keg）','不锈钢 1.4301/1.4306，常用 30 L 和 50 L；矛管直达桶底；始终带压；灌装吸氧 ≤0.1 mg/L'],['桶线能力','直线式约 300 桶/h；旋转式最多约 1,000 桶/h']],
  pts:['罐的刚性来自内压，空罐一碰就瘪，而且变形会传给相邻的整排：叉车要轻进轻出，运输中损坏的罐要在进提升井前剔除，凹罐绝不能压回去；卸垛时整层平推，罐挤在一起才站得稳。空罐检验查圆度、翻边、罐壁和罐底变形、内涂层缺陷和异物——罐口不圆会撞坏封罐机。','罐的贴标用卷筒环绕标（热熔胶涂在首尾，约 4.5 万罐/h，只贴已封口的罐）；日期用喷墨印在罐底，最好在卸垛后罐底还干的时候打。非碳酸饮料要滴一点液氮建立内压；充氮胶囊（widget）开罐时释放氮气，形成细腻的泡沫。','PET 瓶由瓶坯在线拉伸吹塑：加热 → 拉伸杆把瓶坯拉长 → 吹气成形 → 冷却定形；吹后立即检查瓶底、密封面和侧壁。瓶子很轻、在输送带上易倒，所以挂着瓶颈环在风送道里输送；新瓶一般不冲洗（每滴水都会带进氧）。','PET 会吸附香气成分、使用后出现应力开裂而无法洗净，所以不适合做回收瓶。HDE 使泡沫升到螺纹里会长霉 → 先盖预封片、冲净螺纹再旋盖。回收塑料瓶洗瓶温度不得超过 60 °C（PEN 可 75–80 °C），洗前还要用“嗅探器”剔除装过汽油、溶剂的瓶子。','桶线：翻转（阀朝下）→ 去帽 → 压力检查（失压说明泄漏、阀坏或被动过）→ 排残 → 外洗 → 水、碱、酸、热水脉冲冲洗 → 蒸汽灭菌并检漏 → CO₂ 吹出蒸汽并预压 → 灌装（慢起步、快主灌、慢收尾）→ 称重或 γ 射线查液位 → 翻正 → 戴帽。','自冷桶（5–20 L）：打开阀门后，外层真空里的沸石吸水，使中层含水层的水蒸发吸热，约 30 min 后可饮，6–9 °C 能维持约 12 h；再生要把外壳加热到约 250 °C，所以桶身不能印刷。5 L 聚会罐要用能补气保压的放酒装置，喝到最后酒也不会“死”。'],
  q:[['回收的空桶为什么先要测内压？','桶离开市场时仍然带压，外界的东西进不去；压力消失说明桶漏、阀坏或被人动过，必须先查明原因。'],['容积式罐装为什么比按液位灌装快？','计量在换罐的时间里已经完成，灌装时可以一直全速，不必在接近液位时减速。']]}
 ]});

STAGES[5].steps.push(
 {id:'s6-5',no:'6.5',t:'输送、装箱与码垛',en:'Conveying, packing, palletising',p:'679–702',
  goal:'让瓶、罐、箱和托盘平稳、安静、不擦伤地到达每台机器，并把成品可靠地装箱、码垛、固定后送出工厂。',
  params:[['包装形式','塑料周转箱（回收瓶唯一的包装，6–24 瓶、0.25–1 L）、折叠纸箱、托盘纸板加收缩膜、六联包（4–8 件）'],['托盘','欧洲托盘 800 × 1200 mm；纸箱类各层纵横交错以提高稳定性'],['装箱节拍','5 万瓶/h、每箱 20 瓶 → 每小时 2500 箱，每分钟约 42 箱，每秒约 0.7 箱'],['瓶罐流量','5 万瓶/h 时每秒约 14 瓶要连续通过检验、灌装和压盖'],['链道润滑','肥皂 → 加硬度螯合剂（会从污泥中释放重金属，多国已禁）→ 含胺润滑剂 → 可生物降解的无胺非离子表面活性剂；塑料链可干跑或只喷水'],['收缩包装','PE 膜的生产耗能约为纸的 1/3，用料约为纸板的 25%；包好后稳定，不需隔板'],['托盘库','空托盘最多叠约 15 个；满垛可由叠垛机叠 2–3 层']],
  pts:['企业专用箱广告效果好，但必须回到本厂（麻烦、有成本）；共用箱放弃广告，可开窗露出标签（对标机把标签转向箱窗）。20–24 瓶的大箱太重（空瓶箱几乎和内容物一样重），小箱越来越多。','进厂的空瓶箱要检查瓶高、颜色、残留瓶盖，以及箱色、标志、提手孔裂纹、箱内杂物和碎瓶；出厂前的满箱检查缺瓶、少灌、缺盖和破损漏酒——这些错一定出在厂内。洗箱机是箱子倒扣通过的隧道，用碱液或热水喷洗；换品种时空箱先进箱库等待，否则会堵住箱流。','不锈钢板链在弯道和多道输送上会让瓶子互相推挤、转动，形成擦伤环；单列器靠很小的带速差把多道瓶流无背压地排成一列，PET 瓶和底径 <60 mm 的瓶用平行移位输送。链道框架内要装喷淋自动清洗，用焊接代替螺栓、减小接触面、不留水平面，否则会成为向灌装机扩散的菌窝。','装箱机的抓头数量和排列必须与箱格一致（4 × 5 = 20 瓶），换箱型就要换装。机械式抓头夹住瓶口（不能碰坏封箔和防盗标），气动式用气囊推动软指夹住瓶颈。类型有间歇式、连续回转式、多件包装机、组合式（一个循环先卸后装，省去洗箱）和对标机；卸箱前提是箱里没有异型瓶、瓶上没有残留瓶盖。','码垛越来越多用机器人（2 轴直线、3 轴旋转臂、6 轴关节臂）。装载头按包装选：钩式、层夹式、直接抓瓶的抓瓶头式、充气管夹瓶颈式、吸盘式（纸箱）、磁力式（钢罐）、桶用夹头。托盘要检查面板、角墩和尺寸；满垛用顶层打包带、缠绕膜或收缩膜固定，纸箱可喷防滑剂。'],
  faults:[['瓶身擦伤环越来越重','多道链上瓶子互相推挤、转动，转弯太多，背压太大','用单列器和无压缓冲，减少转向；选用带擦伤凸环的瓶形'],['地面积泡沫，废水负荷升高','链道润滑剂加得太多','自动定量加入；改用可干跑的塑料链']],
  q:[['为什么越来越多的酒厂把链道换成塑料链？','塑料链可以干跑或只喷水，不用润滑剂：地面不起泡、废水负荷低，也省化学品。'],['卸箱机为什么要求瓶上不能有残留的瓶盖？','抓头要从瓶口抓起空瓶，残留的皇冠盖会让抓瓶失败或损坏抓头，这些瓶子还要单独处理。']]},
 {id:'s6-6',no:'6.6',t:'灌装线的整体设计',en:'The filling line as a whole',p:'702–708',
  goal:'把几十台机器连成一条稳定运行的线：灌装压盖机是核心，其余设备的能力和缓冲段都为它连续运行服务。',
  table:{head:['设备','设计能力（灌装压盖机 = 100%）'],rows:[['卸垛机','135–140%'],['卸箱机','120–125%'],['洗瓶机','110–115%'],['空瓶检验机','110–115%'],['灌装压盖机','100%'],['贴标机','110–120%'],['装箱机','120–125%'],['码垛机','135–140%']]},
  params:[['缓冲段','多道缓冲加单列器；约半满运行，料位用来自动调节各机的速度'],['三个循环','托盘循环（可作干区）、箱循环、瓶循环（最长，经过全部工序）'],['布置形式','直线式（少见）、梳式（最常见，缓冲段长）、竞技场式（环形，省地方）'],['成品库','按品牌存放、防冻、库存 2–3 天、先进先出；叉车堆垛的地面利用率只有 50–60%，所以大厂用高架库'],['德国标准','DIN 8782（灌装术语）、DIN 8783（设备检验）、DIN 8784（订货信息）、DIN 55405（包装术语）']],
  pts:['灌装车间连同输送和堆场，是全厂最大、最贵、用人最多的部分。','能力分级（书中称 Berg 曲线）：离灌装机越远，设计能力越高。这不是让卸垛机一直以 140% 运行（那样会堵），而是保证短暂故障过后，上游能尽快把缓冲段重新填满，下游能尽快把积压的瓶子排空。','布置时让操作工看得见全线，不必钻过或跨过几条输送线就能到达机器；设备要便于维修；尽量把干区和湿区分开；少让瓶子转动互相摩擦。','空瓶库要保证同品牌、同瓶型的空瓶连续供应，否则灌装线会因为缺合适的空瓶而停下来。'],
  w:['tool:berg'],
  q:[['缓冲段为什么要半满运行？','上游停机时，缓冲段里还有瓶子可供灌装机；下游停机时，缓冲段还有空间接住灌好的瓶子。两头都要留余地。'],['为什么说灌装压盖机决定整条线的产量？','它是全线的核心和瓶颈，它一停，上游积瓶、下游断料；其他设备都按比它高的能力配置，就是为了让它尽量不停。']]},
 {id:'s6-7',no:'6.7',t:'损耗、麦芽单耗与产能',en:'Losses, malt usage, capacity',p:'333–334、709–715',
  goal:'用三套相互独立的数字检查整个工厂：糖化间收率管粉碎到定型，啤酒损耗管定型到可售啤酒，麦芽单耗管全过程。',
  params:[['啤酒损耗','平均 8–10%（占定型麦汁）'],['损耗构成','冷缩约 4%（体积收缩）、开放冷却蒸发 2.5–3.0%、发酵间 1.3–1.7%、贮酒 0.6–0.8%、过滤 0.8–1.0%、灌装 0.2–0.8%'],['麦芽单耗','6% 啤酒约 9 kg/hl，11% 约 17 kg/hl，16% 约 26 kg/hl'],['滴漏','每秒一滴（0.05 mL），一年约 15.8 hl'],['过滤损失','板框约 0.4–0.8%，烛式约 0.3%；现代灌装车间 0.2–0.4%'],['产能经验','每天 8 批、每周 5 天时，每 1 t 投料能力约对应每年 10 万 hl 啤酒']],
  pts:['可售啤酒产量 = 本期销量 + 期末库存 − 期初库存；库存要按各工段的经验损耗折算成“可售啤酒”再相加。','麦芽单耗最难被操作参数“修饰”，最能客观反映全厂水平；但收率和损耗的百分数不能相加。','常见损失点：容器壁、长管道、漏点，酒花糟和凝固物带走的麦汁，溢出的泡沫，撇泡沫盖（每 100 hl 损失 10–20 L），沉降不紧的酵母；回用酵母尽量“干”加入下一批。'],
  w:['tool:loss','tool:cap'],
  q:[['为什么说麦芽单耗“不能被操纵”？','它直接用投进去的麦芽除以卖出去的啤酒，中间任何收率或损耗的算法调整都绕不过去。']]},
 {id:'s6-8',no:'6.8',t:'清洗与消毒（CIP）',en:'Cleaning and disinfection',p:'716–731',
  goal:'让所有接触产品的表面保持清洁无菌；材料、药剂、程序和管道设计必须互相匹配。',
  params:[['典型 CIP 程序','回收水预冲 3–5 min → 1–2% NaOH 70 °C 循环 30–50 min → 中间冲洗 → 1–2% 硝酸 10–15 min → 冲洗 → 消毒 15–20 min → 新鲜水终冲；合计 1–2 h'],['锥形罐酸性一步法','预冲约 10 min → 酸约 60 min → 冲洗 5 min → 消毒 15 min → 新鲜水 10 min；可在 CO₂ 气氛下进行'],['糖化容器','2–3% NaOH 加氧化性添加剂，再做短时酸洗'],['过氧乙酸','0.01–0.1%，分解后无残留'],['喷淋','以低压喷淋为主（≤6 bar，20–75 m³/h）；高压喷射最高约 60 bar'],['回流泵','能力比送液泵高约 25%'],['材料','CrNi 钢（1.4301/1.4306）不耐含氯药剂；含氯场合用 CrNiMo 钢（如 1.4404、1.4571）']],
  pts:['分区设 CIP 站：糖化间与麦汁管路、未滤啤酒管道、未滤啤酒罐、滤后啤酒与灌装，防止污染跨区传播。','热碱遇 CO₂ 生成碳酸盐而失效；锥形罐要先排 CO₂，而且清洗温度通常 ≤35 °C（冷液喷淋热罐会造成真空内爆）。酸性一步法同时避开了这两个问题。','啤酒石是微生物的藏身处，用稀硝酸去除；季铵盐难冲净，长期使用会培养出耐药的腐败菌；次氯酸盐绝不能与酸混用。','管道设计缺陷（死角、没排气的高点、下垂积液段、变径、三通阀）会让 CIP 失效。','配制化学品永远“先水后酸碱”，并戴护目镜。'],
  q:[['锥形罐为什么很少用 80 °C 以上的热碱清洗？','罐里残留的 CO₂ 会把 NaOH 变成碳酸盐，清洗力下降；而且热罐被冷液喷淋时气体收缩、蒸汽冷凝，会产生真空，大罐可能被吸瘪。']]},
 {id:'s6-9',no:'6.9',t:'安全',en:'Safety at work',p:'187–188、359–360、523–526',
  goal:'记住酒厂里几类会致命的风险：CO₂、粉尘爆炸、运动机械、受限空间与压力容器、化学品、硅藻土粉尘。',
  params:[['CO₂','德国车间限值 0.5% vol（短时 1.0%）；>2% 呼吸加快、出现视觉障碍；8–10% 失去意识直至死亡'],['进罐前','抽吸或冲洗到 ≤0.5%（短时 1.0%）；书面许可、指定监护人、安全联络岗；用气体检测仪'],['粉尘','粒径 <100 µm、浓度约 20–2,000 g/m³ 时可爆；混合物约 400 °C 以上被点燃，薄层粉尘在 200 °C 以下的热表面上就能着火'],['锥形罐人孔','上下各至少 450 mm；从上方进入须系安全带和绳，禁用绳梯和移动梯'],['压力容器','液面上方可能出现 >0.1 bar 过压的容器都属压力容器']],
  pts:['典型事故模式：一个人留下“我自己弄完”，CO₂ 让人逐渐无力、跪倒，在罐底更高的浓度中窒息；周一早上开工前 CO₂ 浓度最高。','进入带搅拌器、耕糟机或翻麦机的设备前，拔下保险或控制钥匙随身带着，防止被人误启动。','离心分离机必须按标记位置装配；不平衡的转鼓一旦解体，破坏半径很大。'],
  q:[['为什么“放下点燃的蜡烛”不能用来判断发酵罐能否进入？','蜡烛要到 CO₂ 约 8–10% 才熄灭，而这个浓度已经足以让人失去意识。']]}
);

/* ---------- 专题 07 成品啤酒（上）：含原书引言 ---------- */
STAGES.push({id:'st7',n:7,topic:true,name:'成品啤酒',en:'Finished beer',pages:'19–31、732–785',
 sum:'工艺最后要落到一杯啤酒上：它由什么组成、风味和泡沫取决于哪些工艺细节、各类啤酒怎样酿造，以及怎样用品评、微生物检测、理化分析和在线仪表保证质量始终如一。本专题也收入了原书引言中的啤酒简史。',
 scope:'啤酒简史、成分、风味与泡沫、啤酒类型、质量检验与过程测量',
 chips:['比尔森 11.6% · 5.1% vol','泡持 R&C ≈120 s','成品总氧 0.10–0.15 mg/L'],
 steps:[
 {id:'s7-1',no:'7.1',t:'啤酒简史与行业格局',en:'A short history of beer',p:'19–31',
  goal:'了解啤酒从古代到工业化的几次关键转折，以及 2004 年前后的行业格局，明白今天的工艺是怎样一步步形成的。',
  params:[['最早记载','公元前约 2800 年美索不达米亚楔形文字：给工人每天分发啤酒和面包；汉谟拉比法典（公元前 1728–1686）已规定啤酒的酿造和出售'],['酒花','14 世纪起才成为唯一的调味料，此前用多种草药混合的 Grut'],['纯酒令','图林根 Weissensee 1434 年、慕尼黑 1447 年已有规定；1516 年 4 月 23 日巴伐利亚纯酒令（只许大麦、酒花和水）；1906 年起在全德适用于下面发酵啤酒'],['技术转折','斯帕顿酒厂 1846 年装上第一台（1 马力）蒸汽机；林德制冷机 1871 年发明、1876 年安装；巴斯德证明发酵是微生物的活动；Hansen 1883 年在嘉士伯实验室实现单细胞纯种培养（Lindner 1893 年改进）；Enzinger 发明棉饼过滤机'],['比尔森','1842 年皮尔森城市酒厂酿出第一批比尔森型啤酒；1875 年 Busch 在美国推出类似的“百威”'],['德国酒厂数','1873 年 13,561 家（其中 10,171 家酿上面发酵啤酒），另有 36,297 户免税自酿；1891 年降到 7,785 家'],['世界产量','1992 年 11.63 亿 hl → 2002 年 14.44 亿 hl（11 年增加约 25%，年均约 +2.2%）；2003 年约 14.79 亿 hl，前 40 大酒业集团约占 79%'],['人均消费','捷克约 160 L，德国约 125 L（巴伐利亚约 175 L）；中国 2000 年产量约 2.4 亿 hl 成为第一，但人均只有约 18 L'],['麦芽','2002/03 年全球啤酒约需麦芽 1540 万 t，几家大型制麦集团约供应其中一半']],
  pts:['酿造离不开三个前后相连的生化过程：发芽的谷物形成酶，酶把淀粉分解成糖，糖被发酵成酒精和 CO₂。人类很早就会做，但很晚才明白其中的道理。','在水质常常不可靠的年代，经过煮沸和发酵、含酸的啤酒比水更安全，因此长期是上至君主、下至平民的日常饮料。','欧洲早期是家庭里（多由女性）酿造，修道院酒厂开始对外出售，酿造变成产业和男性职业；中世纪北德的酿造权属于市民（不来梅、汉堡、艾因贝克等酿酒城），南德则逐渐成为领主的特权，并受大量规定约束（当时酒厂还垄断着面包师用的酵母）。','歉收时人们用面包谷物、燕麦甚至有害的植物代替麦芽和酒花，这正是纯酒令产生的背景：保证原料正当、供应充足、价格合理，所以它也被称为世界上最早的消费者保护法。','设备材料从木头 → 涂沥青的铁 → 铝 → 不锈钢；糖化锅从铸铁 → 铜（先烧煤或燃气，近 90 年改用蒸汽）→ 不锈钢；木桶被不锈钢桶取代，自动清洗和自动化大大减少了繁重的体力劳动。','美国酿酒师 1860–70 年代就用玉米粉或碎大米作辅料，形成今天全球重要的一类啤酒；1919–1933 年的禁酒令使酒厂只能生产“近似啤酒”。研究和教学机构纷纷成立：魏恩施蒂芬（1865）、西贝尔（1868）、VLB（1883）、根特（1885）、伦敦 IOB（1886）、Doemens（1895）；MEBAK、EBC、ASBC 统一了分析方法。','如今自动化和在线测量接管了大量工作，但酿酒师仍要监督全过程、做出正确判断——看到的产品越少，对工艺的理解就越重要。'],
  q:[['为什么纯酒令被称为最早的消费者保护法？','它限定只能用大麦（麦芽）、酒花和水，防止在歉收时用廉价或有害的替代品，同时让城市能按质量规定合理的价格，保护的是饮用者。'],['林德制冷机对啤酒类型有什么影响？','下面发酵需要低温，过去只能靠冬季和天然冰；有了制冷机，全年都能稳定地发酵和贮酒，拉格和浅色啤酒才得以普及。']]},
 {id:'s7-2',no:'7.2',t:'啤酒成分与营养',en:'Beer composition',p:'732–736',
  goal:'知道一杯啤酒里有什么、各成分从哪里来，尤其是高级醇和真正浸出物这两个常被忽视的数字。',
  params:[['水','约 91–92%'],['酒精','常见 4.5–5.5% vol；质量分数约比体积分数低 1 个百分点（酒精与水混合时体积收缩）'],['浸出物组成','75–80% 碳水化合物（主要是糊精，麦芽三糖很少）、6–9% 含氮物、4–5% 甘油，另有 β-葡聚糖和无机物'],['含氮物','总氮 600–1100 mg/L，α-氨基氮 80–120 mg/L；80–85% 来自麦芽，10–15% 来自酵母'],['高级醇','正丙醇约 10、异丁醇约 10、戊醇约 60、2-苯乙醇约 20 mg/L'],['无机物','K 500–600、Mg 100–110、磷酸盐 300–400、Ca 35–40、Na 30–32 mg/L；硝酸盐 10–80 mg/L'],['其他','甘油 500–1600 mg/L；β-葡聚糖 220–400 mg/L；黏度 1.40–1.60 mPa·s；pH 4.3–4.7；成熟结束时连二酮 ≤0.10 mg/L'],['热值','比尔森约 40 kcal/100 mL（约 168 kJ）']],
  pts:['比重计直接测得的是表观浸出物，酒精比水轻，使读数偏低；除去酒精后测得的才是真正浸出物。比尔森约为 2.0% 对 3.8%——啤酒里剩下的浸出物比“发酵度 80–85%”听起来多得多。','高级醇（杂醇油）由酵母从氨基酸转化而来：缺缬氨酸时异丁醇多，缺亮氨酸时 3-甲基丁醇多，所以麦汁要有足够的 FAN（≥20 mg/100 mL）。浓啤酒高级醇多，人体分解乙醇很快，分解高级醇却要绕道、常要一天，这是宿醉的主要原因。','甘油是发酵副产物，使口感圆润；多酚（尤其是低分子的花色苷原）有很强的还原力。','酵母会带走麦汁中大部分维生素 B1，所以未过滤、含酵母的啤酒维生素更多；“窖藏浑浊”的浑浊也可以是蛋白浑浊，不会沉淀，也不影响口味。','书中还讨论了适量饮用与健康的关系（引用 2004 年前的研究），并区分适量饮用、滥用和依赖；这不属于工艺内容，本页不展开。'],
  q:[['为什么浓啤酒更容易让人第二天头疼？','原麦汁越高，发酵生成的高级醇越多；人体分解高级醇远比分解乙醇慢，它们在体内停留时间长。'],['比尔森的表观浸出物约 2%，为什么说剩下的浸出物其实接近 4%？','比重计读数被酒精拉低了；去掉酒精后的真正浸出物约 3.8%，大约是表观值的 1.9 倍。']]},
 {id:'s7-3',no:'7.3',t:'风味：香气、酒体、杀口感与苦味',en:'Beer flavour',p:'737–740',
  goal:'把入口的香气、酒体、杀口感和后味的苦味分别追溯到原料和工艺参数，出现偏差时知道往哪里查。',
  params:[['高级醇:酯','正常发酵 2.5–3:1；长时间分批满罐时可到 4–5:1；快速追加麦汁并强力充氧时可到 11–12:1（口味空、粗糙）'],['罐的径高比','1:2 到 1:3 有利于高级醇和酯的平衡'],['香型酒花分批','煮沸 1 h 时：开始 25%、结束前 40 min 25%、前 20 min 25%、前 5 min 25%'],['DMS 异味阈值','加辅料啤酒约 60 ppb；全麦芽啤酒约 100–130 ppb'],['杀口感的 pH','全麦芽啤酒 4.35–4.40；加辅料啤酒 4.0–4.2'],['有利酒体的麦芽','蛋白 10.5–11%，库尔巴哈指数 39–41%，粗细粉差 1.7–2.0%，黏度 1.54–1.57 mPa·s'],['蛋白分解','如今限制在 FAN 只占麦汁总氮的 21–22%，可以 60–62 °C 投料']],
  pts:['香气取决于酵母菌株与副产物、酒花品种与用量、硫化物。上面酵母（温度高）产生的酯和高级醇多，带压发酵则减少它们；博克、节日啤酒需要一点酯香，比尔森则要压低。','酒花香关键在酒花油的组成而不是数量：整酒花和颗粒比浸膏更容易给出可溶的酒花油；头道麦汁加酒花能把相当部分酒花油以可溶形式带进啤酒；苦型浸膏在煮沸开始时加，让不想要的酒花油随蒸汽跑掉；热麦汁吸入空气会产生异戊酸（奶酪味）。','SO₂ 在发酵后期生成，有利于风味稳定：充氧少时 SO₂ 多，但发酵变长；混用回收酵母和扩培酵母、最后一批麦汁少充氧或不充氧，可以兼顾。','浅色柔和的啤酒有时带“硫—酵母味”（硫化物、硫醇），来自焙焦温度低的麦芽、麦汁制备吸氧少、生物酸化和很快的主/后发酵；热麦汁受强剪切会变成“洋葱味”。','酒体随原麦汁（酒精和残余浸出物）增加；10–100 kDa 的蛋白分解产物也贡献酒体；加石膏或 CaCl₂ 让口感更圆润。45–55 °C 的长时间休止会让啤酒空、粗、不杀口、泡沫差；溶解过度的麦芽有霉味、没有酒体。','杀口感由 CO₂ 和 pH 决定；倒酒要小心、约 3 min 内端给客人，宁可小杯多次。','苦味有四个来源：酒花（合葎草酮苦味粗）、多酚（回用洗糟残水或压榨酒糟水、头道麦汁很浓时洗糟水比例高、多酚被氧化、含碳酸盐的水浸出更多酒花多酚）、蛋白（溶解不足的麦芽、糖化过强）、酵母（状态差、代数太多、转罐时酵母太多）。按苦味由弱到强、香气由强到弱：Hersbrucker/Perle/Hüller → Bitter Record、Northern Brewer、美国超高 α 品种 → Brewers Gold、Nugget、Magnum。'],
  faults:[['口味空、粗糙，没有圆润感','高级醇与酯比例失衡（快速追加麦汁、强力充氧），或 45–55 °C 蛋白休止太长','分步加酵母并二次充氧，均匀增殖；缩短蛋白休止'],['苦味粗、后苦重','多酚苦（回用残水、洗糟水多、多酚氧化、碳酸盐水）、合葎草酮高的酒花、酵母状态差','降低残碱度，不回用低质残水，换用香型酒花，保证酵母活力'],['洋葱味或硫味','热麦汁剪切太强；低焙焦麦芽加快速发酵','降低热麦汁泵送和回旋的剪切；调整麦芽和发酵温度']],
  q:[['比尔森为什么要把最好的香型酒花放到最后加？','酒花油易挥发，煮沸越久损失越多；最后几分钟加入，细致的香气才能留在啤酒里。'],['为什么酒花浸膏适合在煮沸一开始就加？','浸膏里也有不需要的酒花油；早加能让它们随蒸汽赶走，同时有足够时间让 α-酸异构化。']]},
 {id:'s7-4',no:'7.4',t:'泡沫',en:'Beer foam',p:'740–742、773',
  goal:'分清起泡和泡持，知道哪些成分和工艺步骤决定泡沫能否稳定、持久，并能用 R&C 或 NIBEM 法测量。',
  params:[['促进泡沫','10–40 kDa 的蛋白，尤其是 LTP1（约 10 kDa）和蛋白 Z（约 40 kDa）；异 α-酸（酒花多泡沫好）；未氧化的单宁'],['破坏泡沫','酒精、部分发酵副产物、花色苷原、较多的氨基酸、油脂'],['R&C 法的影响','凝固性氮 +0.1 mg/100 mL → +1.0 分；黏度 +0.1 cP → +2.6；异葎草酮 +1 mg/100 mL → +0.5；低分子多肽 +0.1 mg/100 mL → −0.3；酒精 +0.1% → −1.4'],['目标值','比尔森：R&C 120–130 s，或 NIBEM 220–290 s'],['NIBEM 评价','<220 s 很差，260–280 s 好，>300 s 很好（R&C 一般 90–140 s，平均约 120 s）'],['糖化','62–65 °C 投料，70–72 °C 较长休止，pH 5.2–5.3；避免 50–60 °C 长休止']],
  pts:['CO₂ 越多起泡越多，但只有表面活性物质才能让泡沫稳定——矿泉水就形成不了稳定的泡沫。泡沫形成后先是气泡膜破裂回流，上层逐渐“结实”，约 1 min 后续倒才能把泡沫顶出杯口，形成泡盖和挂杯的泡沫环。','未经热处理的啤酒在贮存中，酵母分泌的蛋白酶 A 会分解 LTP1，使泡持下降；巴氏杀菌能让它失活。受损的酵母（贮存不当、收获太晚、增殖不足），以及长时间温贮或压力过高，都会增加酵母分泌物而损泡。','影响最大的外部因素是杯沿的油脂，几秒钟就能消泡：杯子要绝对无油，擦布要干净；酒馆输酒管压力不足、管路不洁、龙头不合适、洗涤剂残留也会损泡。','气体越难溶于液体，泡沫越稳：N₂ 最好，泡沫细而持久（罐内充氮胶囊、桶啤用氮气出酒），但口感变柔、失去 CO₂ 的刺激；用混合气时要注意两种气体的饱和压力关系，防止 CO₂ 流失。','纯酒令之外可以加铁盐（约 0.6 g/hl，配还原剂防变褐）、藻酸盐、黄原胶或阿拉伯胶稳泡，但几乎都会改变口味；几十年前一家加拿大酒厂擅自加钴盐稳泡，造成许多饮用者心肌严重受损甚至死亡——任何添加都必须严格按法规和用量。','杯形也有作用：小麦啤酒用高杯；比尔森用细高的小杯，先在斜杯中打低泡，等上层泡沫稳定后二次续倒，把稳定的泡盖顶出杯口——比尔森不能一次倒成。'],
  faults:[['泡沫少、消得快','50–60 °C 长休止、酒花少、酵母受损或温贮太久、杯子或管路有油脂','调整糖化，提高投料温度；保护酵母；清洗杯子和出酒管路'],['未杀菌啤酒放久了泡持明显下降','酵母蛋白酶 A 逐渐分解泡沫蛋白','彻底去除酵母、低温贮存；需要时做热处理']],
  q:[['起泡多为什么不等于泡沫好？','起泡取决于 CO₂ 含量，泡沫能否留住取决于包在气泡外的表面活性物质（蛋白、异 α-酸等）；没有它们，气泡很快就破。'],['氮气为什么能打出更细、更持久的泡沫？','N₂ 在啤酒里的溶解度远低于 CO₂，不容易从气泡里溶回液膜，气泡就不容易长大和破裂。']]}
 ]});
